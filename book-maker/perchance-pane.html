<style>
  :root{ --bg:#0b0907; --bg2:#13100b; --bg3:#1b1711; --ink:#f8f3ea; --ink2:#ccc0ac; --line:#3c3225; --accent:#d4ab73; --accent2:#ecc488; --ok:#8fc278; --danger:#e29a78; }
  *{box-sizing:border-box}
  .ic{display:inline-flex;align-items:center;justify-content:center;vertical-align:-0.16em;line-height:0;}
  .ic svg{display:block;}
  button .ic, .chip .ic, .card .ic{flex:0 0 auto;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,Segoe UI,sans-serif;text-align:left;}
  a{color:var(--accent2)}
  /* Perchance's generator container inherits text-align:center into the pane — force our content left. */
  #app,#app *,.bm-modal,.bm-modal *{text-align:left;}
  #app .chmark,#app .chmark *{text-align:center;}   /* the chapter divider stays centered on purpose (out-specifies the rule above) */
  #app{max-width:880px;margin:0 auto;padding:18px 18px 80px;}
  header.sf{display:flex;align-items:baseline;gap:10px;padding:6px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  header.sf .logo{font-size:22px}
  header.sf h1{font:600 20px/1 Georgia,serif;margin:0;letter-spacing:.3px;}
  header.sf .tag{color:var(--ink2);font-size:12px;}
  .steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap;}
  .steps .st{font-size:12px;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:3px 11px;cursor:pointer;}
  .steps .st.on{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600;}
  .steps .st.done{color:var(--accent2);border-color:var(--accent);}
  .steps .st-menu{margin-left:auto;background:var(--bg2);color:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;}
  .steps .st-menu:hover{border-color:var(--accent);color:var(--accent2);}
  /* settings panel controls */
  .set-row{display:flex;align-items:center;gap:10px;margin-top:9px;}
  .set-lbl{flex:1;font-size:13px;color:var(--ink);}
  .set-color{width:46px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--bg3);cursor:pointer;}
  .set-clear{padding:3px 9px;font-size:11px;}
  .set-font{min-width:170px;}
  .set-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:6px;}
  .preset{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer;color:var(--ink);}
  .preset:hover{border-color:var(--accent);}
  .preset.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .preset-sw{display:inline-flex;width:24px;height:24px;border-radius:6px;border:1px solid;overflow:hidden;flex:0 0 auto;}
  .preset-sw span{flex:1;}
  .preset-nm{font-size:12px;}
  h2.sec{font:600 16px/1.2 Georgia,serif;margin:22px 0 10px;color:var(--accent2);}
  .sublbl{font:600 12px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:18px 0 0;opacity:.85;}
  .muted{color:var(--ink2);font-size:13px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .12s;}
  .card:hover{border-color:var(--accent);}
  .card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .card .t{font-weight:600;margin-bottom:3px;}
  .card .b{font-size:12px;color:var(--ink2);}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;}
  button.btn{background:var(--accent);color:#1a140d;border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14px;}
  button.btn:hover{background:var(--accent2);}
  button.btn.ghost{background:var(--bg3);color:var(--ink);border:1px solid var(--line);font-weight:500;}
  button.btn.sm{padding:5px 10px;font-size:12px;}
  input,select,textarea{background:var(--bg3);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;}
  textarea{width:100%;resize:vertical;}
  .cast{display:flex;flex-direction:column;gap:8px;}
  .cm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;}
  .cm .h{display:flex;gap:8px;align-items:center;}
  .cm .nm{font-weight:600;flex:1;}
  .cm .nm-edit{font-weight:600;flex:1;min-width:0;}
  .cm .pers-edit{width:100%;margin-top:7px;resize:vertical;min-height:38px;}
  .cm .sel{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .cm select{font-size:12px;padding:5px 8px;}
  .chip{font-size:11px;color:var(--ink2);background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:2px 8px;}
  label.ck{font-size:12px;color:var(--ink2);display:inline-flex;gap:4px;align-items:center;cursor:pointer;}
  .page{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0;}
  .page h3{font:600 17px/1.3 Georgia,serif;margin:0 0 4px;color:var(--accent2);display:flex;align-items:baseline;flex-wrap:wrap;}
  .page h3 .title-edit{font:600 17px/1.3 Georgia,serif;color:var(--accent2);background:transparent;border:1px solid transparent;border-radius:6px;padding:1px 6px;min-width:120px;flex:1;}
  .page h3 .title-edit:hover{border-color:var(--line);}
  .page h3 .title-edit:focus{border-color:var(--accent);background:var(--bg3);outline:none;}
  .page .meta{font-size:11px;color:var(--ink2);margin-bottom:10px;}
  .page .body{font:16px/1.7 var(--page-font, Georgia,serif);white-space:pre-wrap;color:var(--page-ink, var(--ink));}
  .page .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--accent);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .pill{display:inline-block;font-size:11px;color:var(--accent2);border:1px solid var(--line);border-radius:14px;padding:1px 8px;margin-left:6px;}
  header.sf{align-items:center;padding-right:104px;}  /* reserve room for the pinned Comments button */
  .page .body.streaming::after{content:'▍';color:var(--accent);animation:bmblink 1s steps(2) infinite;margin-left:1px;}
  @keyframes bmblink{50%{opacity:0;}}
  .rk-vote{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer;filter:grayscale(.6);opacity:.8;}
  .rk-vote:hover{filter:none;opacity:1;}
  .rk-vote.on{filter:none;opacity:1;border-color:var(--ok);background:rgba(127,176,105,.15);}
  .rk-vote.on.down{border-color:var(--danger);background:rgba(217,139,106,.15);}
  .chip.on{color:var(--bg);background:var(--accent);border-color:var(--accent);}
  .page .chmark{text-align:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px;}
  .page .chmark .cht{font:600 20px/1.2 Georgia,serif;color:var(--accent2);letter-spacing:.3px;}
  .page .chmark .chs{font:italic 13px/1.4 Georgia,serif;color:var(--ink2);margin-top:3px;}
  button.btn.ghost.sm.stopbtn{border-color:var(--danger);color:var(--danger);}
  .page .foot{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font:italic 12px/1.5 Georgia,serif;color:var(--ink2);}
  .page .foot::before{content:'⸻  ';color:var(--accent);}
  .page .foot .footedit{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle;}
  .page .foot .footedit button{padding:1px 7px;font-size:11px;}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);}
  .pcount{font-size:13px;color:var(--ink2);white-space:nowrap;}
  #bm-comments-btn{position:fixed;top:10px;right:12px;z-index:80;background:var(--bg3);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  #bm-comments-btn:hover{border-color:var(--accent);}
  #bm-comments{position:fixed;top:48px;right:12px;bottom:12px;width:min(380px,92vw);z-index:79;background:var(--bg2);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);overflow:auto;padding:10px;display:none;}
  #bm-comments.open{display:block;}
  button.btn.ghost.sm.on{border-color:var(--accent);color:var(--accent2);}
  .brainp{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;}
  .brainp-read{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--accent2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;}
  .brainp-facs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;margin-top:8px;}
  .brainp-fac{display:flex;flex-direction:column;align-items:stretch;gap:3px;font-size:12px;color:var(--ink2);cursor:pointer;}
  .brainp-fac input[type=range]{width:100%;min-width:0;accent-color:var(--accent);}
  .brainp-fac-cap{text-transform:capitalize;color:var(--ink2);font-variant-numeric:tabular-nums;}
  .brainp-fac-val{min-width:34px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;}
  .bm-modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:16px;overflow:auto;}
  .bm-modal-box{max-width:min(94vw,460px);width:100%;max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.55);padding:16px;}
  /* settings: clear backdrop + soft shadow so live colour changes aren't obscured by a dark layer */
  .bm-modal.set-overlay{background:transparent;}
  .bm-modal.set-overlay .bm-modal-box{box-shadow:0 4px 16px rgba(0,0,0,.32);}
  .bm-modal-msg{font-size:14px;color:var(--ink);margin-bottom:10px;white-space:pre-wrap;}
  /* AiCC-style sectioned character editor: a wide box whose body scrolls, with a pinned button row */
  .bm-modal-box.wide{max-width:min(96vw,600px);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;}
  .bm-sections{overflow:auto;flex:1;min-height:0;padding:2px 2px 26px;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 26px),transparent);}
  .bm-sections::-webkit-scrollbar{width:8px;} .bm-sections::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .bm-sec{margin-top:13px;} .bm-sec:first-child{margin-top:2px;}
  .bm-sec-label{font:600 11px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px;opacity:.9;}
  .bm-sec-label .h{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink2);opacity:.85;}
  .bm-sec input,.bm-sec select,.bm-sec textarea{width:100%;}
  .bm-sec textarea{resize:vertical;min-height:48px;}
  .bm-sec .pair{display:flex;gap:8px;} .bm-sec .pair>div{flex:1;min-width:0;}
  .bm-modal-input{width:100%;}
  .bm-modal-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
  .foresee-res:not(:empty){margin-top:12px;border-top:1px solid var(--line);padding-top:10px;}
  .foresee-verdict{font-weight:600;font-size:14px;border-radius:8px;padding:6px 10px;margin-bottom:8px;}
  .foresee-verdict.good{color:var(--ok);background:rgba(127,176,105,.14);}
  .foresee-verdict.bad{color:var(--danger);background:rgba(217,139,106,.14);}
  .foresee-verdict.mixed{color:var(--accent2);background:rgba(201,161,107,.14);}
  .foresee-li{font-size:13px;line-height:1.5;color:var(--ink2);margin:2px 0;}
  .foresee-li.ok{color:var(--ink);}
  .foresee-li.risk{color:var(--danger);}
</style>
