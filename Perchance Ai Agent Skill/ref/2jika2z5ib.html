    g.player.yaw = 0;
  }

  function buildAddonMap(g, addBox, def) {
    const T = THREE, C = CANNON;

    // Ground color from map def (default to grass green)
    const groundColor = def.groundColor != null ? def.groundColor : 0x6a7a3a;

    // Box shapes
    if (def.boxes) {
      for (const b of def.boxes) {
        addBox(b.x, b.y, b.z, b.w, b.h, b.d, b.color);
      }
    }

    // Ramps (rotated boxes)
    if (def.ramps) {
      for (const r of def.ramps) {
        const rm = new T.Mesh(new T.BoxGeometry(r.w, r.h, r.d), new T.MeshStandardMaterial({ color: r.color, roughness: 0.8 }));
        rm.position.set(r.x, r.y, r.z);
        rm.rotation.x = r.rotX || 0;
        rm.castShadow = true; rm.receiveShadow = true;
        g.scene.add(rm);
        g.colliders.push({ min: { x: r.x - r.w / 2, y: r.y - r.h * 2, z: r.z - r.d / 2 }, max: { x: r.x + r.w / 2, y: r.y + r.h * 2, z: r.z + r.d / 2 } });
        const rb = new C.Body({ type: C.Body.STATIC, shape: new C.Box(new C.Vec3(r.w / 2, r.h / 2, r.d / 2)) });
        rb.position.set(r.x, r.y, r.z);
        rb.quaternion.setFromAxisAngle(new C.Vec3(1, 0, 0), -(r.rotX || 0));
        g.world.addBody(rb);
      }
    }

    // Cones (roofs, decorations)
    if (def.cones) {
      for (const c of def.cones) {
        const cm = new T.Mesh(new T.ConeGeometry(c.r, c.h, c.segments || 4), new T.MeshStandardMaterial({ color: c.color, roughness: 0.6 }));
        cm.position.set(c.x, c.y, c.z);
        if (c.rotY) cm.rotation.y = c.rotY;
        cm.castShadow = true;
        g.scene.add(cm);
        g.colliders.push({ min: { x: c.x - c.r, y: c.y - c.h / 2, z: c.z - c.r }, max: { x: c.x + c.r, y: c.y + c.h / 2, z: c.z + c.r } });
      }
    }

    // Cylinders (beacons, pillars)
    if (def.cylinders) {
      for (const c of def.cylinders) {
        const mat = new T.MeshStandardMaterial({
          color: c.color,
          emissive: c.emissive != null ? c.emissive : 0,
          emissiveIntensity: c.emissiveIntensity || 0,
          roughness: 0.5,
        });
        const cm = new T.Mesh(new T.CylinderGeometry(c.r, c.r, c.h, c.segments || 16), mat);
        cm.position.set(c.x, c.y, c.z);
        g.scene.add(cm);
        if (c.light) {
          const pl = new T.PointLight(c.light, c.lightIntensity || 2, c.lightRange || 15);
          pl.position.set(c.x, c.y, c.z);
          g.scene.add(pl);
        }
      }
    }

    // Beacons (emissive cylinder + point light)
    if (def.beacons) {
      for (const b of def.beacons) {
        const mat = new T.MeshStandardMaterial({ color: b.color, emissive: b.color, emissiveIntensity: b.emissiveIntensity || 1.5 });
        const beacon = new T.Mesh(new T.CylinderGeometry(b.r || 0.25, b.r || 0.25, b.h || 6, b.segments || 16), mat);
        beacon.position.set(b.x, b.y, b.z);
        g.scene.add(beacon);
        const pl = new T.PointLight(b.color, b.lightIntensity || 2, b.lightRange || 15);
        pl.position.set(b.x, b.y, b.z);
        g.scene.add(pl);
      }
    }

    // Staircases (spiral steps around a center)
    if (def.stairs) {
      for (const s of def.stairs) {
        const count = s.count || 8;
        const baseY = s.baseY || 1;
        const stepY = s.stepY || 2;
        const radius = s.radius || 2.5;
        const stepW = s.stepW || 2;
        const stepH = s.stepH || 0.5;
        const stepD = s.stepD || 1;
        const color = s.color || 0x7a8a6a;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + (s.startAngle || 0);
          addBox(Math.cos(angle) * radius, baseY + i * stepY, Math.sin(angle) * radius, stepW, stepH, stepD, color);
        }
      }
    }

    // Set player spawn
    if (def.spawn) {
      g.player.pos.set(def.spawn[0], def.spawn[1], def.spawn[2]);
      g.player.yaw = def.spawnYaw || 0;
    }
  }

  function buildWorld(g) {
    const T = THREE, C = CANNON;
    g.scene = new T.Scene();
    g.scene.background = new T.Color(0x8fb4d4);
    g.scene.fog = new T.Fog(0x8fb4d4, g.bspData ? 200 : 100, g.bspData ? 2000 : 500);
    g.camera = new T.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, g.bspData ? 5000 : 1000);
    g.renderer = new T.WebGLRenderer({ antialias: true });
    g.renderer.setSize(window.innerWidth, window.innerHeight);
    g.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    g.renderer.shadowMap.enabled = true;
    g.renderer.shadowMap.type = T.PCFSoftShadowMap;
    g.renderer.outputColorSpace = T.SRGBColorSpace;
    gameRenderer = g.renderer; gameScene = g.scene; gameCamera = g.camera;

    // Environment map for PBR
    const pmrem = new T.PMREMGenerator(g.renderer);
    const ec = document.createElement("canvas");
    ec.width = 512; ec.height = 256;
    const ex = ec.getContext("2d");
    const eg = ex.createLinearGradient(0, 0, 0, 256);
    eg.addColorStop(0, "#4a7aaa"); eg.addColorStop(0.4, "#8fb4d4");
    eg.addColorStop(0.6, "#7a9a6a"); eg.addColorStop(1, "#3a4838");
    ex.fillStyle = eg; ex.fillRect(0, 0, 512, 256);
    const etex = new T.CanvasTexture(ec);
    etex.mapping = T.EquirectangularReflectionMapping;
    g.scene.environment = pmrem.fromEquirectangular(etex).texture;
    etex.dispose(); pmrem.dispose();

    // Generate textures
    g.textures = {
      crate: makeCrateTexture(),
      barrel: makeBarrelTexture(),
      ball: makeBallTexture(),
      plank: makePlankTexture(),
    };

    // Physics world
    g.world = new C.World({ gravity: new C.Vec3(0, -20, 0) });
    g.world.broadphase = new C.SAPBroadphase(g.world);
    g.world.allowSleep = true;
    g.killY = -50; // overwritten after BSP colliders are built
    g.world.solver.iterations = 10;
    g.world.defaultContactMaterial.friction = 0.4;
    g.world.defaultContactMaterial.restitution = 0.25;

    // Lights
    const sun = new T.DirectionalLight(0xfff4e0, 1.3);
    sun.position.set(60, 100, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 300;
    sun.shadow.bias = -0.0005;
    g.scene.add(sun);
    g.scene.add(new T.AmbientLight(0x8fa8c0, 0.5));
    g.scene.add(new T.HemisphereLight(0xbfd8ff, 0x55603a, 0.4));

    if (g.bspData) {
      const pmrem = new T.PMREMGenerator(g.renderer);
      g.scene.environment = pmrem.fromScene(new T.Scene(), 0.04).texture;
    }

    // Ground + structures
    g.colliders = [];
    if (g.bspData) {
      // BSP map: build geometry from parsed brushes
      // (No y=0 safety plane — BSP floors are often far below y=0, e.g. gm_construct at y≈-312,
      //  and a Plane half-space at y=0 would engulf the spawn and fling the player up to y=0.)
      buildBSPGeometry(g, g.bspData);
      // Set player spawn from BSP entities
      if (g.playerSpawn) {
        g.player.pos.copy(g.playerSpawn);
        if (g.playerSpawnYaw) g.player.yaw = g.playerSpawnYaw;
        // If spawn is inside a brush, nudge player up above it
        for (let attempt = 0; attempt < 50; attempt++) {
          let inside = false;
          for (const col of g.colliders) {
            if (g.player.pos.x > col.min.x && g.player.pos.x < col.max.x &&
                g.player.pos.z > col.min.z && g.player.pos.z < col.max.z &&
                g.player.pos.y - g.player.height < col.max.y && g.player.pos.y > col.min.y) {
              g.player.pos.y = col.max.y + g.player.height + 0.1;
              inside = true;
              break;
            }
          }
          if (!inside) break;
        }
      }
      // Set kill plane below the lowest BSP collider so props don't get culled above the floor
      if (g.colliders.length) {
        g.killY = Math.min(...g.colliders.map(c => c.min.y)) - 100;
      }
    } else {
      // Procedural map
      const isBaseplate = g.mapName === "pm_baseplate";
      const isBhop = g.mapName === "pm_bhop_practice";
      const isCity = g.mapName === "pm_generalcity";
      const addonDef = addonMapGeoms[g.mapName];
      const isAddon = !!addonDef;
      const groundColor = isBaseplate ? 0x8a8a8a : isCity ? 0x3a3a3e : isAddon && addonDef.groundColor != null ? addonDef.groundColor : 0x6a7a3a;
      const groundGeo = new T.PlaneGeometry(500, 500);
      const groundMat = new T.MeshStandardMaterial({ color: groundColor, roughness: 0.95 });
      const ground = new T.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      g.scene.add(ground);

      // Grass — instanced blades scattered on the ground (not on baseplate)
      if (!isBaseplate && !isCity && !(isAddon && addonDef.noGrass)) {
        const grassGeo = new T.PlaneGeometry(0.06, 0.35);
        grassGeo.translate(0, 0.175, 0);
        const grassMat = new T.MeshStandardMaterial({
          color: 0x4a7a2a, roughness: 1, side: T.DoubleSide,
          alphaTest: 0.5, transparent: true
        });
        const GRASS_COUNT = 8000;
        const GRASS_RANGE = 200;
        const grassMesh = new T.InstancedMesh(grassGeo, grassMat, GRASS_COUNT);
        const dummy = new T.Object3D();
        const color = new T.Color();
        for (let i = 0; i < GRASS_COUNT; i++) {
          const gx = (Math.random() - 0.5) * GRASS_RANGE * 2;
          const gz = (Math.random() - 0.5) * GRASS_RANGE * 2;
          dummy.position.set(gx, 0, gz);
          dummy.rotation.y = Math.random() * Math.PI * 2;
          const s = 0.7 + Math.random() * 0.6;
          dummy.scale.set(s, s, s);
          dummy.updateMatrix();
          grassMesh.setMatrixAt(i, dummy.matrix);
          const v = 0.3 + Math.random() * 0.4;
          color.setRGB(v * 0.5, v, v * 0.3);
          grassMesh.setColorAt(i, color);
        }
        grassMesh.instanceMatrix.needsUpdate = true;
        if (grassMesh.instanceColor) grassMesh.instanceColor.needsUpdate = true;
        grassMesh.receiveShadow = false;
        grassMesh.castShadow = false;
        // Wind animation via shader injection
        grassMat.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = { value: 0 };
          g.grassUniforms = shader.uniforms;
          shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader.replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             #ifdef USE_INSTANCING
               vec3 wPos = (instanceMatrix * vec4(transformed, 1.0)).xyz;
               float wind = sin(uTime * 1.5 + wPos.x * 0.3 + wPos.z * 0.3) * 0.12 * transformed.y;
               transformed.x += wind;
               transformed.z += wind * 0.5;
             #endif`
          );
        };
        g.scene.add(grassMesh);
        g.grassMesh = grassMesh;
      }

      // Ground physics
      const groundBody = new C.Body({ type: C.Body.STATIC, shape: new C.Plane() });
      groundBody.quaternion.setFromAxisAngle(new C.Vec3(1, 0, 0), -Math.PI / 2);
      g.world.addBody(groundBody);
      // Ground AABB for projectile collision
      g.colliders.push({ min: { x: -500, y: -1, z: -500 }, max: { x: 500, y: 0, z: 500 } });

      // Structures
      const addBox = (x, y, z, w, h, d, color) => {
        const mat = new T.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.1 });
        const mesh = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true; mesh.receiveShadow = true;
        g.scene.add(mesh);
        g.colliders.push({ min: { x: x - w / 2, y: y - h / 2, z: z - d / 2 }, max: { x: x + w / 2, y: y + h / 2, z: z + d / 2 } });
        const body = new C.Body({ type: C.Body.STATIC, shape: new C.Box(new C.Vec3(w / 2, h / 2, d / 2)) });
        body.position.set(x, y, z);
        g.world.addBody(body);
      };
      if (isBaseplate) {
        addBox(0, 50, -250, 500, 100, 2, 0x6a6a6a);
        addBox(0, 50, 250, 500, 100, 2, 0x6a6a6a);
        addBox(-250, 50, 0, 2, 100, 500, 0x6a6a6a);
        addBox(250, 50, 0, 2, 100, 500, 0x6a6a6a);
      } else if (isBhop) {
        buildBhopCourse(g, addBox);
      } else if (isCity) {
        buildGeneralCity(g, addBox);
      } else if (isAddon) {
        buildAddonMap(g, addBox, addonDef);
      } else {
        addBox(0, 5, -30, 40, 10, 2, 0x6a6a6a);
        addBox(-25, 2.5, -10, 2, 5, 40, 0x7a6a5a);
        addBox(25, 2.5, -10, 2, 5, 40, 0x7a6a5a);
        addBox(10, 1.5, 10, 8, 3, 8, 0x8a7a4a);
        addBox(-15, 0.75, 15, 6, 1.5, 6, 0x6a5a8a);
        addBox(20, 3, 25, 10, 6, 10, 0x5a6a7a);
        addBox(0, 4, 40, 30, 8, 2, 0x6a6a6a);
        for (let i = 0; i < 10; i++) addBox(-40, 0.5 + i * 0.8, 30, 8, 1 + i * 0.8, 2, 0x8a8a6a);
        addBox(40, 1, -20, 4, 2, 4, 0x7a5a5a);
        addBox(-40, 2, -25, 6, 4, 6, 0x5a7a7a);
      }
    }

    // Player kinematic body (for prop collision)
    g.playerBody = new C.Body({ type: C.Body.KINEMATIC, shape: new C.Sphere(0.4) });
    g.playerBody.position.set(g.player.pos.x, g.player.pos.y, g.player.pos.z);
    g.world.addBody(g.playerBody);

    // Seed props (skip on bhop map)
    if (g.mapName !== "pm_bhop_practice") {
      spawnProp3D(g, 0, 8, 5, SPAWN_CATEGORIES[0].items[0]);
      spawnProp3D(g, 2, 10, 5, SPAWN_CATEGORIES[0].items[3]);
      spawnProp3D(g, -2, 12, 5, SPAWN_CATEGORIES[0].items[4]);
    }
  }

  function makePropMesh(g, item) {
    const T = THREE;
    const sz = item.size || 1;
    let mesh, radius, halfExtents;
    if (item.shape === "ball") {
      radius = 0.7 * sz;
      const mat = new T.MeshStandardMaterial({ map: g.textures.ball, roughness: 0.65, metalness: 0.05, color: item.color || 0xffffff });
      mesh = new T.Mesh(new T.SphereGeometry(radius, 24, 18), mat);
    } else if (item.shape === "barrel") {
      radius = 0.55 * sz;
      const sideMat = new T.MeshStandardMaterial({ map: g.textures.barrel, roughness: 0.35, metalness: 0.65, color: item.color || 0xffffff });
      const capMat = new T.MeshStandardMaterial({ color: item.color ? item.color : 0x3a3a3e, roughness: 0.5, metalness: 0.7 });
      const grp = new T.Group();
      const h = 1.5 * sz;
      const body = new T.Mesh(new T.CylinderGeometry(radius, radius, h, 24, 1, true), sideMat);
      grp.add(body);
      const capGeo = new T.CircleGeometry(radius, 24);
      const topCap = new T.Mesh(capGeo, capMat);
      topCap.rotation.x = -Math.PI / 2; topCap.position.y = h / 2;
      grp.add(topCap);
      const botCap = new T.Mesh(capGeo, capMat);
      botCap.rotation.x = Math.PI / 2; botCap.position.y = -h / 2;
      grp.add(botCap);
      const rimMat = new T.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.4, metalness: 0.8 });
      const rimGeo = new T.TorusGeometry(radius * 1.02, 0.035, 8, 24);
      const tr = new T.Mesh(rimGeo, rimMat);
      tr.rotation.x = Math.PI / 2; tr.position.y = h / 2; grp.add(tr);
      const br = new T.Mesh(rimGeo, rimMat);
      br.rotation.x = Math.PI / 2; br.position.y = -h / 2; grp.add(br);
      grp.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      mesh = grp;
      halfExtents = { x: radius, y: h / 2, z: radius };
    } else if (item.shape === "plank") {
      const mat = new T.MeshStandardMaterial({ map: g.textures.plank, roughness: 0.8, metalness: 0.05, color: item.color || 0xffffff });
      const w = 3 * sz, h = 0.2, d = 0.8 * sz;
      mesh = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
      radius = w / 2;
      halfExtents = { x: w / 2, y: h / 2, z: d / 2 };
    } else { // box
      const mat = new T.MeshStandardMaterial({ map: g.textures.crate, roughness: 0.75, metalness: 0.1, color: item.color || 0xffffff });
      const s = item.tall ? 1.2 : 1.2 * sz;
      const w = item.tall ? 0.8 * sz : s;
      const h = item.tall ? 3.0 * sz : s;
      const d = item.tall ? 0.8 * sz : s;
      mesh = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
      radius = Math.max(w, h, d) / 2;
      halfExtents = { x: w / 2, y: h / 2, z: d / 2 };
    }
    mesh.castShadow = true; mesh.receiveShadow = true;
    return { mesh, radius, halfExtents, shape: item.shape };
  }

  function spawnProp3D(g, x, y, z, item) {
    const C = CANNON;
    const p = makePropMesh(g, item);
    p.mesh.position.set(x, y, z);
    let shape;
    if (p.shape === "ball") {
      shape = new C.Sphere(p.radius);
    } else {
      const he = p.halfExtents;
      shape = new C.Box(new C.Vec3(he.x, he.y, he.z));
    }
    const mass = item.mass || 4;
    p.body = new C.Body({ mass, shape });
    p.body.position.set(x, y, z);
    p.body.linearDamping = 0.05;
    p.body.angularDamping = 0.08;
    // Breakable setup
    if (item.breakable) {
      p.breakable = item.breakable;
      p.maxHp = item.hp || 20;
      p.hp = p.maxHp;
      p.fragCount = item.fragCount || 8;
      p.fragColor = item.color || 0xffffff;
      p.lastImpact = 0;
    }
    // Collision listener for impact sounds + breakable damage
    p.body.addEventListener("collide", (e) => {
      const now = performance.now();
      const v = e.contact.getImpactVelocityAlongNormal();
      const absV = Math.abs(v);
      if (absV < 1.5) return;
      // Throttle per-prop impact sound (avoid machine-gun on settling)
      if (now - (p.lastImpactSound || 0) < 120) return;
      p.lastImpactSound = now;
      const pos = p.mesh.position;
      const mat = p.breakable || (item.shape === "barrel" ? "metal" : "wood");
      playImpactSound(pos, absV, mat);
      // Impact particles for strong hits
      if (absV > 6) spawnImpactParticles(g, pos, mat, Math.min(8, Math.floor(absV / 3)));
      // Damage breakables from impact
      if (p.breakable && absV > 4) {
        const dmg = Math.floor(absV * 1.2);
        if (dmg > 0) damageBreakable(g, p, dmg, pos);
      }
    });
    g.world.addBody(p.body);
    g.scene.add(p.mesh);
    g.props.push(p);
    // Multiplayer: assign ownership + notify
    if (MP.connected && MP.roomId) {
      p.mpId = mpNextPropId++;
      p.mpOwner = MP.myPid;
      const q = p.mesh.quaternion;
      MP.socket.send(JSON.stringify({
        t: MP_TYPE_PROPSPAWN, propId: p.mpId, pid: MP.myPid,
        item: { name: item.name, shape: item.shape, size: item.size, mass: item.mass, color: item.color, breakable: item.breakable, hp: item.hp, tall: item.tall },
        x: p.mesh.position.x, y: p.mesh.position.y, z: p.mesh.position.z,
        qx: q.x, qy: q.y, qz: q.z, qw: q.w,
      }));
    }
    if (g.props.length > 80) {
      const old = g.props.shift();
      if (old.mpId && MP.connected && MP.socket) {
        MP.socket.send(JSON.stringify({ t: MP_TYPE_PROPREMOVE, propId: old.mpId }));
      }
      g.scene.remove(old.mesh);
      old.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      g.world.removeBody(old.body);
    }
    return p;
  }

  function removeProp3D(g, prop) {
    if (g.grabbed === prop) g.grabbed = null;
    const i = g.props.indexOf(prop);
    if (i >= 0) {
      if (prop.mpId && MP.connected && MP.socket) {
        MP.socket.send(JSON.stringify({ t: MP_TYPE_PROPREMOVE, propId: prop.mpId }));
      }
      g.props.splice(i, 1);
      // Restore body type if it was kinematic (being grabbed)
      if (prop.body && prop.body._prevType !== undefined) {
        prop.body.type = prop.body._prevType;
        prop.body.mass = prop.body._prevMass || 4;
        prop.body.updateMassProperties();
      }
      g.scene.remove(prop.mesh);
      // Clean up decals attached to this prop
      for (const d of decalPool) {
        if (d.active && d.attachedProp === prop) {
          d.active = false; d.mesh.visible = false; d.isAttached = false; d.attachedProp = null;
        }
      }
      prop.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      g.world.removeBody(prop.body);
      // Clean up toolgun-attached visuals
      if (prop.thrusterMesh) { prop.mesh.remove(prop.thrusterMesh); prop.thrusterMesh = null; }
      if (prop.balloonMesh) { g.scene.remove(prop.balloonMesh); prop.balloonMesh = null; }
      if (prop.hoverballMesh) { g.scene.remove(prop.hoverballMesh); prop.hoverballMesh = null; }
      if (prop.attachedLight) { prop.mesh.remove(prop.attachedLight); prop.attachedLight = null; }
      if (prop.trailLine) { g.scene.remove(prop.trailLine); prop.trailLine = null; prop.trailPoints = null; }
      if (prop.ropes) { for (const r of prop.ropes) { if (r.line) g.scene.remove(r.line); try { g.world.removeConstraint(r.c); } catch(e){} } prop.ropes = []; }
    }
  }

  // ---- Breakable system ----
  function damageBreakable(g, prop, dmg, hitPos) {
    if (!prop.breakable || prop.broken) return;
    prop.hp -= dmg;
    // Visual crack/darken feedback
    prop.mesh.traverse(o => {
      if (o.isMesh && o.material && o.material.color) {
        const t = 1 - (prop.hp / prop.maxHp);
        const orig = prop.fragColor || 0xffffff;
        const r = ((orig >> 16) & 0xff) / 255;
        const gg = ((orig >> 8) & 0xff) / 255;
        const b = (orig & 0xff) / 255;
        const f = 1 - t * 0.5;
        o.material.color.setRGB(r * f, gg * f, b * f);
      }
    });
    if (prop.hp <= 0) {
      breakProp(g, prop, hitPos);
    }
  }

  function breakProp(g, prop, hitPos) {
    if (prop.broken) return;
    prop.broken = true;
    const pos = hitPos ? hitPos.clone() : prop.mesh.position.clone();
    const mat = prop.breakable;
    playBreakSound(pos, mat);
    // Spawn fragments
    const count = prop.fragCount || 8;
    const baseColor = prop.fragColor || 0xffffff;
    const box = new THREE.Box3().setFromObject(prop.mesh);
    const size = new THREE.Vector3(); box.getSize(size);
    for (let i = 0; i < count; i++) {
      const fragSize = Math.max(0.06, size.x * (0.15 + Math.random() * 0.25));
      let geo;
      if (mat === "glass") {
        // Sharp shards — tetrahedral-ish
        geo = new THREE.TetrahedronGeometry(fragSize);
      } else if (mat === "concrete") {
        geo = new THREE.DodecahedronGeometry(fragSize, 0);
      } else {
        // Wood splinters — small boxes
        geo = new THREE.BoxGeometry(fragSize, fragSize * 0.3, fragSize * 1.5);
      }
      const fmat = new THREE.MeshStandardMaterial({
        color: baseColor,
        roughness: mat === "glass" ? 0.1 : 0.85,
        metalness: mat === "glass" ? 0.0 : 0.05,
        transparent: mat === "glass",
        opacity: mat === "glass" ? 0.65 : 1.0,
        flatShading: true,
      });
      const frag = new THREE.Mesh(geo, fmat);
      const off = new THREE.Vector3(
        (Math.random() - 0.5) * size.x,
        (Math.random() - 0.5) * size.y,
        (Math.random() - 0.5) * size.z
      );
      frag.position.copy(prop.mesh.position).add(off);
      frag.quaternion.setFromEuler(new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI));
      frag.castShadow = true;
      g.scene.add(frag);
      // Physics body
      const C = CANNON;
      const fshape = new C.Box(new C.Vec3(fragSize*0.6, fragSize*0.4, fragSize*0.8));
      const fbody = new C.Body({ mass: 0.3, shape: fshape });
      fbody.position.set(frag.position.x, frag.position.y, frag.position.z);
      fbody.quaternion.set(frag.quaternion.x, frag.quaternion.y, frag.quaternion.z, frag.quaternion.w);
      // Outward burst velocity
      const dir = off.clone().normalize();
      const burst = 4 + Math.random() * 5;
      fbody.velocity.set(dir.x * burst + (Math.random()-0.5)*2, dir.y * burst + 2 + Math.random()*3, dir.z * burst + (Math.random()-0.5)*2);
      fbody.angularVelocity.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
      fbody.linearDamping = 0.1;
      fbody.angularDamping = 0.1;
      g.world.addBody(fbody);
      g.props.push({ mesh: frag, body: fbody, radius: fragSize, shape: "box", isFragment: true, fragLife: 12 });
      // Trim prop cap
      if (g.props.length > 100) {
        const old = g.props.shift();
        g.scene.remove(old.mesh);
        if (old.mesh.geometry) old.mesh.geometry.dispose();
        if (old.mesh.material) old.mesh.material.dispose();
        g.world.removeBody(old.body);
      }
    }
    // Particle burst
    spawnImpactParticles(g, pos, mat, count + 4, true);
    // Glass: brief flash
    if (mat === "glass") {
      const flash = new THREE.PointLight(0xccddff, 2, 6);
      flash.position.copy(pos);
      g.scene.add(flash);
      setTimeout(() => g.scene.remove(flash), 80);
    }
    removeProp3D(g, prop);
  }

  // ---- Impact/break particle system ----
  const particlePool = [];

  // ---- Decal system (impact marks, blood splatters, scorch marks) ----
  const decalPool = [];
  const MAX_DECALS = 80;
  function spawnDecal(g, pos, normal, type) {
    const T = THREE;
    let color, size;
    if (type === "blood") { color = 0x6a0a0a; size = 0.18 + Math.random() * 0.1; }
    else if (type === "scorch") { color = 0x1a1a1a; size = 0.4 + Math.random() * 0.2; }
    else if (type === "metal") { color = 0x3a3a3a; size = 0.07 + Math.random() * 0.04; }
    else if (type === "concrete") { color = 0x6a6a6a; size = 0.1 + Math.random() * 0.05; }
    else { color = 0x4a3a1a; size = 0.09 + Math.random() * 0.04; } // wood
    let d = decalPool.find(d => !d.active);
    let mesh;
    if (d) {
      mesh = d.mesh;
      d.active = true;
    } else {
      mesh = new T.Mesh(
        new T.CircleGeometry(1, 10),
        new T.MeshBasicMaterial({ color, transparent: true, opacity: 1, depthWrite: false, side: T.DoubleSide, polygonOffset: true, polygonOffsetFactor: -4 })
      );
      mesh.renderOrder = 2;
      d = { mesh, active: true, life: 0, maxLife: 1, g };
      decalPool.push(d);
      g.scene.add(mesh);
      if (decalPool.length > MAX_DECALS) {
        const old = decalPool.shift();
        if (old.g && old.g.scene) old.g.scene.remove(old.mesh);
        old.mesh.geometry.dispose();
        old.mesh.material.dispose();
      }
    }
    mesh.material.color.setHex(color);
    mesh.material.opacity = type === "blood" ? 0.9 : 1;
    mesh.userData.baseOpacity = mesh.material.opacity;
    mesh.scale.setScalar(size);
    // Position slightly in front of the surface along the normal
    mesh.position.copy(pos).add(normal.clone().multiplyScalar(0.02));
    // Orient: CircleGeometry faces +Z, so we want +Z to point along the normal
    mesh.lookAt(mesh.position.clone().add(normal));
    mesh.visible = true;
    d.life = 0;
    d.maxLife = type === "scorch" ? 30 : type === "blood" ? 25 : 20;
    d.fadeStart = d.maxLife * 0.7;
  }

  function updateDecals(dt) {
    for (const d of decalPool) {
      if (!d.active) continue;
      d.life += dt;
      if (d.life >= d.maxLife) {
        d.active = false;
        d.mesh.visible = false;
        d.isAttached = false;
        d.attachedProp = null;
        continue;
      }
      if (d.life > d.fadeStart) {
        const t = (d.life - d.fadeStart) / (d.maxLife - d.fadeStart);
        const baseOpacity = d.mesh.userData.baseOpacity || 1;
        d.mesh.material.opacity = baseOpacity * (1 - t);
      }
    }
  }

  // Spawn a decal parented to a prop so it follows the prop's movement/rotation
  function spawnPropDecal(g, prop, worldPos, worldNormal, type) {
    spawnDecal(g, worldPos, worldNormal, type);
    let d = decalPool[decalPool.length - 1];
    if (!d || !d.active) {
      // fallback: find the most recently activated
      const active = decalPool.filter(x => x.active);
      d = active[active.length - 1];
    }
    if (d && d.mesh && d.mesh.parent === g.scene) {
      g.scene.remove(d.mesh);
      // Convert position to prop-local space
      const localPos = prop.mesh.worldToLocal(worldPos.clone());
      d.mesh.position.copy(localPos);
      // Adjust rotation to prop's rotation
      const localNormal = worldNormal.clone().applyQuaternion(prop.mesh.quaternion.clone().invert());
      d.mesh.lookAt(localPos.clone().add(localNormal));
      prop.mesh.add(d.mesh);
      d.attachedProp = prop;
      d.isAttached = true;
    }
  }

  // Spawn blood particles + blood decal
  function spawnBlood(g, pos, dir) {
    spawnImpactParticles(g, pos, "blood", 8);
    // Blood decal on nearby surface behind the hit
    for (const col of g.colliders) {
      const t = rayAABB(pos, dir, col);
      if (t && t < 3) {
        const hitPos = pos.clone().add(dir.clone().multiplyScalar(t));
        const normal = new THREE.Vector3(0, 0, 0);
        // Approximate surface normal from AABB face
        const cx = (col.min.x + col.max.x) / 2, cy = (col.min.y + col.max.y) / 2, cz = (col.min.z + col.max.z) / 2;
        const dx = hitPos.x - cx, dy = hitPos.y - cy, dz = hitPos.z - cz;
        const sx = col.max.x - col.min.x, sy = col.max.y - col.min.y, sz = col.max.z - col.min.z;
        const rx = dx / sx, ry = dy / sy, rz = dz / sz;
        if (Math.abs(rx) > Math.abs(ry) && Math.abs(rx) > Math.abs(rz)) normal.set(Math.sign(rx), 0, 0);
        else if (Math.abs(ry) > Math.abs(rz)) normal.set(0, Math.sign(ry), 0);
        else normal.set(0, 0, Math.sign(rz));
        spawnDecal(g, hitPos, normal, "blood");
        break;
      }
    }
  }
  function spawnImpactParticles(g, pos, mat, count, isBreak) {
    const T = THREE;
    let color, size, gravity;
    if (mat === "glass") { color = 0xb0d8ff; size = 0.05; gravity = 14; }
    else if (mat === "metal") { color = 0xffaa44; size = 0.04; gravity = 10; }
    else if (mat === "concrete") { color = 0xa0a0a0; size = 0.07; gravity = 16; }
    else if (mat === "blood") { color = 0x8a0a0a; size = 0.045; gravity = 12; }
    else { color = 0xc89a5a; size = 0.06; gravity = 14; } // wood
    for (let i = 0; i < count; i++) {
      let p = particlePool.find(p => !p.active);
      let mesh;
      if (p) { mesh = p.mesh; p.active = true; }
      else {
        mesh = new T.Mesh(
          new T.SphereGeometry(size, 4, 3),
          new T.MeshBasicMaterial({ color, transparent: true })
        );
        p = { mesh, active: true, vel: new T.Vector3(), life: 0, maxLife: 1 };
        particlePool.push(p);
        g.scene.add(mesh);
      }
      mesh.material.color.setHex(color);
      mesh.material.opacity = 1;
      mesh.material.transparent = true;
      mesh.scale.setScalar(isBreak ? 0.8 + Math.random() * 1.2 : 0.5 + Math.random() * 0.8);
      mesh.position.copy(pos);
      mesh.visible = true;
      const speed = isBreak ? 3 + Math.random() * 5 : 1.5 + Math.random() * 3;
      p.vel.set(
        (Math.random() - 0.5) * speed * 2,
        Math.random() * speed + (isBreak ? 1 : 0.5),
        (Math.random() - 0.5) * speed * 2
      );
      p.life = 0;
      p.maxLife = isBreak ? 0.8 + Math.random() * 0.6 : 0.4 + Math.random() * 0.3;
      p.gravity = gravity;
      p.g = g;
    }
  }

  function updateParticles(dt) {
    for (const p of particlePool) {
      if (!p.active) continue;
      p.life += dt;
      if (p.life >= p.maxLife) {
        p.active = false;
        p.mesh.visible = false;
        continue;
      }
      p.vel.y -= (p.gravity || 14) * dt;
      p.mesh.position.x += p.vel.x * dt;
      p.mesh.position.y += p.vel.y * dt;
      p.mesh.position.z += p.vel.z * dt;
      const t = p.life / p.maxLife;
      p.mesh.material.opacity = 1 - t;
      p.mesh.scale.setScalar((1 - t * 0.5) * (p.mesh.scale.x > 0 ? 1 : 1));
    }
  }

  // ==================== NPC SYSTEM ====================
  // Shared material cache per NPC build to reduce draw-call overhead
  function npcMats(def) {
    const T = THREE;
    return {
      cloth: new T.MeshStandardMaterial({ color: def.color, roughness: 0.85, metalness: 0.1 }),
      clothDark: new T.MeshStandardMaterial({ color: new T.Color(def.color).multiplyScalar(0.6), roughness: 0.85, metalness: 0.1 }),
      skin: new T.MeshStandardMaterial({ color: def.skinColor, roughness: 0.7, metalness: 0.05 }),
      dark: new T.MeshStandardMaterial({ color: 0x1a1a1e, roughness: 0.6, metalness: 0.3 }),
      eye: new T.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 }),
    };
  }

  function buildNPCMesh(type) {
    const T = THREE;
    const def = NPC_TYPES.find(t => t.id === type);
    const g = new T.Group();
    const M = npcMats(def);
    const clothMat = M.cloth, clothDarkMat = M.clothDark, skinMat = M.skin, darkMat = M.dark, eyeMat = M.eye;

    if (type === "headcrab") {
      const body = new T.Mesh(new T.SphereGeometry(0.35, 16, 12), skinMat);
      body.scale.y = 0.55; body.position.y = 0.35; g.add(body);
      // Mouth/teeth
      const mouth = new T.Mesh(new T.SphereGeometry(0.12, 10, 6, 0, Math.PI*2, 0, Math.PI*0.4), new T.MeshStandardMaterial({ color: 0x3a1a1a, roughness: 0.8 }));
      mouth.position.set(0, 0.25, 0.28); mouth.rotation.x = -0.3;
      g.add(mouth);
      const eyeMat2 = new T.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 });
      for (const sx of [-0.12, 0.12]) {
        const eye = new T.Mesh(new T.SphereGeometry(0.06, 8, 6), eyeMat2);
        eye.position.set(sx, 0.4, 0.25); g.add(eye);
      }
      for (let i = 0; i < 4; i++) {
        const ang = (i / 3) * Math.PI * 0.7 - Math.PI * 0.35;
        for (const side of [-1, 1]) {
          const leg = new T.Mesh(new T.CylinderGeometry(0.03, 0.015, 0.35, 6), darkMat);
          leg.position.set(Math.cos(ang) * 0.28, 0.18, Math.sin(ang) * 0.28);
          leg.rotation.z = Math.cos(ang) * 0.5;
          leg.rotation.x = Math.sin(ang) * 0.5;
          g.add(leg);
        }
      }
      g.userData.parts = {};
      g.userData.radius = 0.4;
      g.userData.height = 0.5;
      g.userData.isHeadcrab = true;
      return g;
    }

    // ---- Antlion: insectoid quadruped ----
    if (type === "antlion") {
      const bugMat = new T.MeshStandardMaterial({ color: def.color, roughness: 0.5, metalness: 0.2 });
      const bugDarkMat = new T.MeshStandardMaterial({ color: new T.Color(def.color).multiplyScalar(0.6), roughness: 0.5, metalness: 0.3 });
      // Body — 3 segmented spheres
      const seg1 = new T.Mesh(new T.SphereGeometry(0.28, 12, 8), bugMat);
      seg1.scale.set(1, 0.7, 1.4); seg1.position.set(0, 0.5, 0.1); g.add(seg1);
      const seg2 = new T.Mesh(new T.SphereGeometry(0.22, 12, 8), bugMat);
      seg2.scale.set(1, 0.65, 1.3); seg2.position.set(0, 0.48, -0.2); g.add(seg2);
      const seg3 = new T.Mesh(new T.SphereGeometry(0.18, 12, 8), bugMat);
      seg3.scale.set(1, 0.6, 1.2); seg3.position.set(0, 0.46, -0.45); g.add(seg3);
      // Head
      const bugHead = new T.Mesh(new T.SphereGeometry(0.18, 12, 8), bugDarkMat);
      bugHead.scale.set(0.8, 0.7, 1); bugHead.position.set(0, 0.55, 0.5);
      g.add(bugHead);
      // Mandibles
      for (const sx of [-0.06, 0.06]) {
        const mand = new T.Mesh(new T.ConeGeometry(0.03, 0.18, 6), darkMat);
        mand.position.set(sx, 0.48, 0.68);
        mand.rotation.x = Math.PI / 2;
        mand.rotation.z = sx > 0 ? 0.3 : -0.3;
        g.add(mand);
      }
      // Eyes (3 pairs)
      const antEyeMat = new T.MeshStandardMaterial({ color: 0xff8800, emissive: 0xff6600, emissiveIntensity: 1.8 });
      for (const sx of [-0.1, 0.1]) {
        for (let i = 0; i < 3; i++) {
          const eye = new T.Mesh(new T.SphereGeometry(0.025, 8, 6), antEyeMat);
          eye.position.set(sx, 0.6 + i * 0.04, 0.5);
          g.add(eye);
        }
      }
      // Wings (folded translucent)
      const wingMat = new T.MeshStandardMaterial({ color: 0xd4c890, roughness: 0.3, transparent: true, opacity: 0.5, side: T.DoubleSide });
      for (const sx of [-1, 1]) {
        const wing = new T.Mesh(new T.PlaneGeometry(0.35, 0.25), wingMat);
        wing.position.set(sx * 0.22, 0.62, 0.05);
        wing.rotation.y = sx * 0.6;
        wing.rotation.z = sx * 0.2;
        g.add(wing);
      }
      // 6 legs
      for (let i = 0; i < 3; i++) {
        const zOff = 0.15 - i * 0.2;
        for (const sx of [-1, 1]) {
          const upperLeg = new T.Mesh(new T.CylinderGeometry(0.03, 0.02, 0.3, 6), darkMat);
          upperLeg.position.set(sx * 0.22, 0.3, zOff);
          upperLeg.rotation.z = sx * 0.7;
          g.add(upperLeg);
          const lowerLeg = new T.Mesh(new T.CylinderGeometry(0.018, 0.012, 0.3, 6), darkMat);
          lowerLeg.position.set(sx * 0.35, 0.05, zOff);
          lowerLeg.rotation.z = sx * 0.4;
          g.add(lowerLeg);
          const foot = new T.Mesh(new T.SphereGeometry(0.025, 6, 4), darkMat);
          foot.position.set(sx * 0.4, -0.08, zOff);
          g.add(foot);
        }
      }
      g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      g.userData.parts = {};
      g.userData.radius = 0.4;
      g.userData.height = 0.8;
      g.userData.isAntlion = true;
      return g;
    }

    // ---- Humanoid NPCs ----
    // A pivot group for the upper body so it stays separate from leg rotation
    const upper = new T.Group();
    upper.position.y = 0.9;
    g.add(upper);

    // Torso — tapered cylinder (wider at shoulders, narrower at waist)
    const torso = new T.Mesh(new T.CylinderGeometry(0.22, 0.18, 0.65, 14), clothMat);
    torso.position.y = 0.35;
    upper.add(torso);
    // Hips block
    const hips = new T.Mesh(new T.BoxGeometry(0.3, 0.14, 0.18), clothDarkMat);
    hips.position.y = 0.02;
    upper.add(hips);

    // Type-specific torso details
    if (type === "combine") {
      const armorMat = new T.MeshStandardMaterial({ color: 0x2a3a4a, roughness: 0.5, metalness: 0.4 });
      const armor = new T.Mesh(new T.SphereGeometry(0.24, 12, 8, 0, Math.PI*2, 0, Math.PI*0.5), armorMat);
      armor.position.y = 0.45; armor.scale.y = 0.7;
      upper.add(armor);
      // Chest plate
      const chestPlate = new T.Mesh(new T.BoxGeometry(0.28, 0.15, 0.06), armorMat);
      chestPlate.position.set(0, 0.42, 0.15);
      upper.add(chestPlate);
      // Belt
      const belt = new T.Mesh(new T.CylinderGeometry(0.19, 0.19, 0.06, 14), darkMat);
      belt.position.y = 0.1;
      upper.add(belt);
      // Shoulder pads
      for (const sx of [-1, 1]) {
        const pad = new T.Mesh(new T.SphereGeometry(0.12, 10, 8), armorMat);
        pad.position.set(sx * 0.22, 0.58, 0); pad.scale.set(1, 0.6, 1.2);
        upper.add(pad);
      }
    }
    if (type === "rebel") {
      const vestMat = new T.MeshStandardMaterial({ color: 0x2a3a2a, roughness: 0.7, metalness: 0.2 });
      const vest = new T.Mesh(new T.CylinderGeometry(0.21, 0.19, 0.4, 12, 1, true), vestMat);
      vest.position.y = 0.35; vest.material.side = T.DoubleSide;
      upper.add(vest);
      // Backpack
      const pack = new T.Mesh(new T.BoxGeometry(0.2, 0.25, 0.12), new T.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.8 }));
      pack.position.set(0, 0.35, -0.18);
      upper.add(pack);
      // Strap
      const strap = new T.Mesh(new T.BoxGeometry(0.06, 0.5, 0.04), darkMat);
      strap.position.set(0.15, 0.4, 0.08); strap.rotation.z = 0.2;
      upper.add(strap);
    }
    if (type === "zombie") {
      // Hunched posture — zombies lean forward
      upper.rotation.x = 0.35;
      // Torn shirt — ripped open in front to expose ribcage
      const shirtMat = new T.MeshStandardMaterial({ color: 0x3a4a2a, roughness: 0.95, side: T.DoubleSide });
      const shirtBack = new T.Mesh(new T.CylinderGeometry(0.23, 0.18, 0.55, 10, 1, true, Math.PI * 0.3, Math.PI * 1.4), shirtMat);
      shirtBack.position.y = 0.35;
      upper.add(shirtBack);
      // Shirt collar remnants around neck
      const collar = new T.Mesh(new T.CylinderGeometry(0.2, 0.22, 0.08, 10, 1, true, 0, Math.PI * 1.6), shirtMat);
      collar.position.y = 0.62;
      upper.add(collar);
      // Open ribcage — exposed ribs and sternum
      const ribMat = new T.MeshStandardMaterial({ color: 0xc8a890, roughness: 0.6 });
      const fleshMat = new T.MeshStandardMaterial({ color: 0x6a2a1a, roughness: 0.8 });
      // Inner chest cavity (dark red flesh)
      const cavity = new T.Mesh(new T.SphereGeometry(0.1, 10, 8), fleshMat);
      cavity.position.set(0, 0.4, 0.12); cavity.scale.set(1, 1.2, 0.4);
      upper.add(cavity);
      // Sternum plate (top of ribcage)
      const sternum = new T.Mesh(new T.BoxGeometry(0.06, 0.12, 0.02), ribMat);
      sternum.position.set(0, 0.52, 0.16);
      upper.add(sternum);
      // Ribs — curved bones on both sides of open chest
      for (const sx of [-1, 1]) {
        for (let i = 0; i < 5; i++) {
          const rib = new T.Mesh(new T.TorusGeometry(0.06 + i * 0.01, 0.008, 4, 8, Math.PI * 0.8), ribMat);
          rib.position.set(sx * 0.08, 0.5 - i * 0.07, 0.14);
          rib.rotation.y = sx * Math.PI / 2;
          rib.rotation.x = 0.2;
          upper.add(rib);
        }
      }
      // Blood stains on shirt remnants
      const bloodMat = new T.MeshStandardMaterial({ color: 0x6a1a0a, roughness: 0.7, transparent: true, opacity: 0.8 });
      const blood1 = new T.Mesh(new T.SphereGeometry(0.06, 8, 6), bloodMat);
      blood1.position.set(0.05, 0.45, 0.16); blood1.scale.set(1.5, 1.2, 0.2);
      upper.add(blood1);
      const blood2 = new T.Mesh(new T.SphereGeometry(0.05, 8, 6), bloodMat);
      blood2.position.set(-0.06, 0.3, 0.15); blood2.scale.set(1.2, 1, 0.2);
      upper.add(blood2);
    }
    if (type === "citizen") {
      // Simple shirt collar
      const collar = new T.Mesh(new T.CylinderGeometry(0.18, 0.2, 0.06, 12), clothDarkMat);
      collar.position.y = 0.62;
      upper.add(collar);
    }

    // Shoulders
    const shoulderL = new T.Mesh(new T.SphereGeometry(0.1, 10, 8), clothMat);
    shoulderL.position.set(-0.24, 0.6, 0);
    upper.add(shoulderL);
    const shoulderR = new T.Mesh(new T.SphereGeometry(0.1, 10, 8), clothMat);
    shoulderR.position.set(0.24, 0.6, 0);
    upper.add(shoulderR);

    // Neck
    const neck = new T.Mesh(new T.CylinderGeometry(0.06, 0.07, 0.08, 8), skinMat);
    neck.position.y = 0.72;
    upper.add(neck);

    // Head — sphere with jaw
    const head = new T.Mesh(new T.SphereGeometry(0.16, 18, 14), skinMat);
    head.scale.set(0.9, 1.05, 0.95);
    head.position.y = 0.85;
    upper.add(head);
    // Jaw / chin
    const jaw = new T.Mesh(new T.SphereGeometry(0.1, 10, 8, 0, Math.PI*2, Math.PI*0.5, Math.PI*0.3), skinMat);
    jaw.position.set(0, 0.78, 0.04); jaw.scale.set(1, 0.6, 1.1);
    upper.add(jaw);
    // Nose
    const nose = new T.Mesh(new T.ConeGeometry(0.02, 0.05, 6), skinMat);
    nose.position.set(0, 0.84, 0.16); nose.rotation.x = Math.PI / 2;
    upper.add(nose);

    // Head details per type
    if (type === "combine") {
      const helmetMat = new T.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.4, metalness: 0.5 });
      const helmet = new T.Mesh(new T.SphereGeometry(0.17, 14, 10, 0, Math.PI*2, 0, Math.PI*0.65), helmetMat);
      helmet.position.y = 0.88;
      upper.add(helmet);
      // Glowing visor — single elongated shape
      const visorMat = new T.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff3300, emissiveIntensity: 2.5, roughness: 0.2 });
      const visor = new T.Mesh(new T.BoxGeometry(0.22, 0.04, 0.08), visorMat);
      visor.position.set(0, 0.87, 0.13);
      upper.add(visor);
      // Air filter canister on side
      for (const sx of [-1, 1]) {
        const filt = new T.Mesh(new T.CylinderGeometry(0.04, 0.04, 0.1, 8), helmetMat);
        filt.position.set(sx * 0.14, 0.82, 0.04);
        upper.add(filt);
      }
    } else if (type === "zombie") {
      // Head tilted back slightly (headcrab controls it)
      head.rotation.x = -0.15;
      // Blood-stained face — dark red patches on skin
      const faceBlood = new T.Mesh(new T.SphereGeometry(0.17, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.6),
        new T.MeshStandardMaterial({ color: 0x5a1a08, roughness: 0.8, transparent: true, opacity: 0.6 }));
      faceBlood.position.set(0, 0.86, 0.02); faceBlood.scale.set(0.95, 1, 1);
      upper.add(faceBlood);
      // Closed/dark eye sockets (zombie is controlled)
      for (const sx of [-0.06, 0.06]) {
        const socket = new T.Mesh(new T.SphereGeometry(0.035, 8, 6), new T.MeshStandardMaterial({ color: 0x1a0a0a, roughness: 1 }));
        socket.position.set(sx, 0.88, 0.13);
        upper.add(socket);
      }
      // Mouth agape
      const mouth = new T.Mesh(new T.BoxGeometry(0.06, 0.03, 0.01), new T.MeshStandardMaterial({ color: 0x2a0808, roughness: 0.8 }));
      mouth.position.set(0, 0.8, 0.16);
      upper.add(mouth);
      const teethMat = new T.MeshStandardMaterial({ color: 0xaa9a7a, roughness: 0.7 });
      for (let i = 0; i < 5; i++) {
        const t = new T.Mesh(new T.BoxGeometry(0.018, 0.02, 0.01), teethMat);
        t.position.set(-0.04 + i * 0.02, 0.805, 0.165);
        upper.add(t);
      }

      // ---- HEADCRAB on top of head ----
      const hcBody = new T.Mesh(new T.SphereGeometry(0.14, 14, 10), skinMat);
      hcBody.scale.set(1.1, 0.55, 1.3);
      hcBody.position.set(0, 0.98, 0.01);
      hcBody.rotation.x = -0.1;
      upper.add(hcBody);
      // Headcrab legs wrapping around the head
      const hcLegMat = new T.MeshStandardMaterial({ color: new T.Color(def.skinColor).multiplyScalar(0.7), roughness: 0.8 });
      for (let i = 0; i < 4; i++) {
        const ang = (i / 3) * Math.PI * 0.7 - Math.PI * 0.35;
        for (const side of [-1, 1]) {
          const leg = new T.Mesh(new T.CylinderGeometry(0.012, 0.008, 0.14, 6), hcLegMat);
          leg.position.set(Math.cos(ang) * 0.1, 0.92, Math.sin(ang) * 0.1 + 0.01);
          leg.rotation.z = Math.cos(ang) * 0.6;
          leg.rotation.x = Math.sin(ang) * 0.6;
          upper.add(leg);
        }
      }
      // Headcrab eyes (glowing red, facing forward)
      const hcEyeMat = new T.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2.5 });
      for (const sx of [-0.05, 0.05]) {
        const hcEye = new T.Mesh(new T.SphereGeometry(0.022, 8, 6), hcEyeMat);
        hcEye.position.set(sx, 1.0, 0.1);
        upper.add(hcEye);
      }
      // Blood drip from where headcrab meets head
      const dripMat = new T.MeshStandardMaterial({ color: 0x5a1a08, roughness: 0.7 });
      for (let i = 0; i < 3; i++) {
        const drip = new T.Mesh(new T.CylinderGeometry(0.008, 0.005, 0.04 + i * 0.02, 6), dripMat);
        drip.position.set(-0.05 + i * 0.05, 0.93, 0.12 - i * 0.02);
        upper.add(drip);
      }
    } else {
      // Normal eyes
      const eyeWhiteMat = new T.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3 });
      for (const sx of [-0.06, 0.06]) {
        const eyeWhite = new T.Mesh(new T.SphereGeometry(0.028, 8, 6), eyeWhiteMat);
        eyeWhite.position.set(sx, 0.86, 0.14);
        upper.add(eyeWhite);
        const pupil = new T.Mesh(new T.SphereGeometry(0.014, 6, 6), eyeMat);
        pupil.position.set(sx, 0.86, 0.16);
        upper.add(pupil);
      }
      // Eyebrows
      const browMat = new T.MeshStandardMaterial({ color: type === "rebel" ? 0x3a2a1a : 0x5a4a3a, roughness: 0.9 });
      for (const sx of [-0.06, 0.06]) {
        const brow = new T.Mesh(new T.BoxGeometry(0.05, 0.01, 0.01), browMat);
        brow.position.set(sx, 0.91, 0.14);
        upper.add(brow);
      }
      // Hair (simple cap)
      const hairColor = type === "rebel" ? 0x4a3a2a : 0x5a4a3a;
      const hair = new T.Mesh(new T.SphereGeometry(0.165, 12, 8, 0, Math.PI*2, 0, Math.PI*0.55), new T.MeshStandardMaterial({ color: hairColor, roughness: 0.9 }));
      hair.position.y = 0.9;
      upper.add(hair);
      // Ears
      for (const sx of [-1, 1]) {
        const ear = new T.Mesh(new T.SphereGeometry(0.03, 8, 6), skinMat);
        ear.scale.set(0.5, 1, 0.6);
        ear.position.set(sx * 0.14, 0.84, 0);
        upper.add(ear);
      }
    }

    // Arms — upper + lower segments with elbow joint
    function buildArm(side) {
      const armG = new T.Group();
      armG.position.set(side * 0.24, 0.6, 0);
      // Shoulder cap
      const shCap = new T.Mesh(new T.SphereGeometry(0.07, 8, 6), clothMat);
      shCap.position.y = 0;
      armG.add(shCap);
      // Upper arm
      const upperArm = new T.Mesh(new T.CylinderGeometry(0.05, 0.045, 0.3, 8), clothMat);
      upperArm.position.y = -0.15;
      armG.add(upperArm);
      // Elbow joint
      const elbow = new T.Mesh(new T.SphereGeometry(0.05, 8, 6), clothMat);
      elbow.position.y = -0.3;
      armG.add(elbow);
      // Forearm
      const forearm = new T.Mesh(new T.CylinderGeometry(0.045, 0.04, 0.3, 8), skinMat);
      forearm.position.y = -0.45;
      armG.add(forearm);
      // Wrist
      const wrist = new T.Mesh(new T.SphereGeometry(0.04, 8, 6), skinMat);
      wrist.position.y = -0.6;
      armG.add(wrist);
      // Hand — slightly boxy
      const hand = new T.Mesh(new T.BoxGeometry(0.07, 0.06, 0.04), skinMat);
      hand.position.y = -0.66;
      armG.add(hand);
      upper.add(armG);
      return armG;
    }
    const armL = buildArm(-1);
    const armR = buildArm(1);

    // Zombie: blood-stained hands/arms (raised zombie pose)
    if (type === "zombie") {
      // Arms raised forward in classic zombie pose
      armL.rotation.x = -1.2;
      armR.rotation.x = -1.2;
      armL.rotation.z = 0.15;
      armR.rotation.z = -0.15;
      // Blood on hands
      const bloodMat = new T.MeshStandardMaterial({ color: 0x5a1a08, roughness: 0.7 });
      for (const arm of [armL, armR]) {
        const bloodHand = new T.Mesh(new T.SphereGeometry(0.05, 8, 6), bloodMat);
        bloodHand.position.y = -0.68; bloodHand.scale.set(1, 0.8, 1);
        arm.add(bloodHand);
        // Blood streaks down forearm
        for (let i = 0; i < 2; i++) {
          const streak = new T.Mesh(new T.CylinderGeometry(0.008, 0.004, 0.12, 6), bloodMat);
          streak.position.set((i - 0.5) * 0.03, -0.5, 0.02);
          arm.add(streak);
        }
      }
    }

    // Legs — upper + lower segments with knee joint
    function buildLeg(side) {
      const legG = new T.Group();
      legG.position.set(side * 0.1, 0, 0);
      // Upper leg
      const upperLeg = new T.Mesh(new T.CylinderGeometry(0.07, 0.06, 0.35, 8), clothDarkMat);
      upperLeg.position.y = -0.175;
      legG.add(upperLeg);
      // Knee
      const knee = new T.Mesh(new T.SphereGeometry(0.06, 8, 6), darkMat);
      knee.position.y = -0.35;
      legG.add(knee);
      // Lower leg
      const lowerLeg = new T.Mesh(new T.CylinderGeometry(0.06, 0.045, 0.35, 8), darkMat);
      lowerLeg.position.y = -0.525;
      legG.add(lowerLeg);
      // Ankle
      const ankle = new T.Mesh(new T.SphereGeometry(0.045, 8, 6), darkMat);
      ankle.position.y = -0.7;
      legG.add(ankle);
      // Foot
      const foot = new T.Mesh(new T.BoxGeometry(0.12, 0.05, 0.22), darkMat);
      foot.position.set(0, -0.74, 0.04);
      legG.add(foot);
      g.add(legG);
      return legG;
    }
    const legL = buildLeg(-1);
    const legR = buildLeg(1);

    // Weapon for rebels/combine
    if (def.behavior === "ranged") {
      const gunMat = new T.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.4, metalness: 0.6 });
      const gun = new T.Mesh(new T.BoxGeometry(0.06, 0.1, 0.4), gunMat);
      gun.position.set(0.24, 0.45, 0.2);
      upper.add(gun);
      const barrel = new T.Mesh(new T.CylinderGeometry(0.015, 0.015, 0.15, 8), gunMat);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(0.24, 0.48, 0.38);
      upper.add(barrel);
    }

    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    g.userData.parts = { armL, armR, legL, legR, head, torso, upper };
    g.userData.radius = 0.4;
    g.userData.height = 1.8;
    return g;
  }

  function spawnNPC3D(g, x, y, z, npcType) {
    const C = CANNON;
    const def = NPC_TYPES.find(t => t.id === npcType);
    const mesh = buildNPCMesh(npcType);
    mesh.position.set(x, y, z);
    const isHeadcrab = npcType === "headcrab";
    const isAntlion = npcType === "antlion";
    const w = 0.45, h = isHeadcrab ? 0.5 : (isAntlion ? 0.8 : 1.8), d = isAntlion ? 0.6 : 0.3;
    const shape = new C.Box(new C.Vec3(w/2, h/2, d/2));
    const mass = isHeadcrab ? 10 : (isAntlion ? 25 : 70);
    const body = new C.Body({ mass, shape });
    body.position.set(x, y + h/2, z);
    body.linearDamping = 0.1;
    body.angularDamping = 0.95; // keep upright
    body.fixedRotation = true; // don't fall over
    g.world.addBody(body);
    g.scene.add(mesh);
    const npc = {
      mesh, body, type: npcType, def,
      hp: def.hp, maxHp: def.hp,
      state: "idle", stateTime: 0,
      wanderTarget: null, wanderTimer: 0,
      attackTimer: 0,
      walkPhase: 0,
      alive: true,
      radius: 0.5,
      isNPC: true,
      halfExtents: { x: w/2, y: h/2, z: d/2 },
      hitFlash: 0,
      lastDamageDir: new THREE.Vector3(0, 0, 1),
    };
    g.npcs.push(npc);
    // Multiplayer: broadcast NPC spawn
    if (MP.connected && MP.roomId) {
      npc.mpId = mpNextPropId++;
      npc.mpOwner = MP.myPid;
      MP.socket.send(JSON.stringify({ t: MP_TYPE_NPCSPAWN, npcId: npc.mpId, pid: MP.myPid, npcType, x, y, z }));
    }
    // Ragdoll NPC types spawn as a corpse — immediately ragdolled
    if (npcType.startsWith("ragdoll")) {
      npc.alive = false;
      npc.state = "dead";
      npc.deathTime = performance.now();
      createRagdoll(g, npc);
    }
    if (g.npcs.length > 30) {
      const old = g.npcs.shift();
      removeNPC(g, old);
    }
    return npc;
  }

  function removeNPC(g, npc) {
    if (g.grabbed === npc) g.grabbed = null;
    const i = g.npcs.indexOf(npc);
    if (i >= 0) {
      // Multiplayer: broadcast NPC removal
      if (npc.mpId && MP.connected && MP.socket) {
        MP.socket.send(JSON.stringify({ t: MP_TYPE_NPCKILL, npcId: npc.mpId }));
      }
      g.npcs.splice(i, 1);
      g.scene.remove(npc.mesh);
      npc.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
      g.world.removeBody(npc.body);
      // Clean up ragdoll bodies, meshes, and constraints
      if (npc.ragdollBodies) {
        for (const rb of npc.ragdollBodies) g.world.removeBody(rb);
        npc.ragdollBodies = null;
      }
      if (npc.ragdollMeshes) {
        for (const rm of npc.ragdollMeshes) {
          g.scene.remove(rm);
          rm.traverse(o => { if (o.geometry) o.geometry.dispose(); });
        }
        npc.ragdollMeshes = null;
      }
      if (npc.ragdollConstraints) {
        for (const c of npc.ragdollConstraints) g.world.removeConstraint(c);
        npc.ragdollConstraints = null;
      }
    }
  }

  function damageNPC(g, npc, dmg, knockDir) {
    if (!npc.alive) return;
    npc.hp -= dmg;
    npc.hitFlash = 0.15;
    if (knockDir) npc.lastDamageDir = knockDir.clone();
    npc.body.wakeUp();
    if (knockDir) {
      npc.body.velocity.x += knockDir.x * dmg * 1.2;
      npc.body.velocity.y += dmg * 0.5 + 2;
      npc.body.velocity.z += knockDir.z * dmg * 1.2;
    }
    // Blood particles + decal
    const bloodPos = npc.mesh.position.clone(); bloodPos.y += 1;
    const bloodDir = knockDir ? knockDir.clone() : new THREE.Vector3(0, 1, 0);
    spawnBlood(g, bloodPos, bloodDir);
    // Type-specific pain sounds
    if (npc.type === "zombie") playSound("zombie_pain", { volume: 0.35, pitch: 0.9 + Math.random() * 0.2 });
    // Hostile NPCs that are alerted start chasing; citizens flee
    if (npc.def.behavior === "flee") {
      npc.state = "flee"; npc.stateTime = 0;
    } else if (npc.def.hostile) {
      npc.state = "chase"; npc.stateTime = 0;
    }
    if (npc.hp <= 0) killNPC(g, npc);
  }

  function killNPC(g, npc) {
    if (!npc.alive) return;
    npc.alive = false;
    npc.state = "dead";
    npc.deathTime = performance.now();
    if (npc.type === "zombie") playSound("zombie_die", { volume: 0.45 });
    spawnImpactParticles(g, npc.mesh.position.clone(), "wood", 6);
    // Extra blood burst on death
    const deathPos = npc.mesh.position.clone(); deathPos.y += 1;
    spawnImpactParticles(g, deathPos, "blood", 12);
    const downDir = new THREE.Vector3(0, -1, 0);
    spawnBlood(g, deathPos, downDir);
    createRagdoll(g, npc);
  }

  // Builds an articulated ragdoll from the NPC's mesh: 11 bodies for humanoids
  // (head, chest, hips, 2 upper arms, 2 forearms, 2 thighs, 2 shins) connected
  // by ConeTwistConstraints. Small creatures get a single tumbling body.
  function createRagdoll(g, npc) {
    const C = CANNON;
    const T = THREE;
    const pos = npc.body.position.clone();
    const knockDir = npc.lastDamageDir || new T.Vector3(0, 0, 1);
    const def = npc.def;
    const M = npcMats(def);
    const clothMat = M.cloth, clothDarkMat = M.clothDark, skinMat = M.skin, darkMat = M.dark;

    // Remove the main physics body — ragdoll parts replace it
    g.world.removeBody(npc.body);
    npc.mesh.visible = false;

    const bodies = [];
    const meshes = [];
    const constraints = [];

    function makePart(shape, px, py, pz, mass, mesh) {
      const body = new C.Body({ mass, shape });
      body.position.set(px, py, pz);
      body.linearDamping = 0.04;
      body.angularDamping = 0.04;
      body.allowSleep = true;
      g.world.addBody(body);
      bodies.push(body);
      mesh.castShadow = true;
      g.scene.add(mesh);
      meshes.push(mesh);
      return { body, mesh };
    }

    function connect(a, b, ax, ay, az, bx, by, bz, axisA, axisB, angle, twist) {
      const c = new C.ConeTwistConstraint(a.body, b.body, {
        pivotA: new C.Vec3(ax, ay, az),
        pivotB: new C.Vec3(bx, by, bz),
        axisA: new C.Vec3(...(axisA || [0, 1, 0])),
        axisB: new C.Vec3(...(axisB || [0, 1, 0])),
        angle: angle != null ? angle : Math.PI / 3,
        twistAngle: twist != null ? twist : Math.PI / 4,
      });
      g.world.addConstraint(c);
      constraints.push(c);
      return c;
    }

    const isSmall = npc.type === "headcrab" || npc.type === "antlion";

    if (isSmall) {
      // Single-body ragdoll for small creatures
      const sz = npc.type === "headcrab" ? 0.3 : 0.35;
      const shape = new C.Sphere(sz);
      const mesh = npc.type === "headcrab"
        ? new T.Mesh(new T.SphereGeometry(0.35, 16, 12), skinMat)
        : new T.Mesh(new T.SphereGeometry(0.3, 12, 8), new T.MeshStandardMaterial({ color: def.color, roughness: 0.5, metalness: 0.2 }));
      if (npc.type === "headcrab") mesh.scale.y = 0.55;
      const p = makePart(shape, pos.x, pos.y, pos.z, 8, mesh);
    } else {
      // Articulated humanoid ragdoll — 11 bodies
      // Reference positions (relative to npc feet at pos)
      const headY = pos.y + 0.75;
      const chestY = pos.y + 0.55;
      const hipY = pos.y + 0.3;
      const uArmY = pos.y + 0.6, foreY = pos.y + 0.35;
      const thighY = pos.y + 0.15, shinY = pos.y - 0.15;
      const armX = 0.22, legX = 0.1;

      // Head
      const head = makePart(new C.Sphere(0.16), pos.x, headY, pos.z, 4,
        new T.Mesh(new T.SphereGeometry(0.16, 16, 12), skinMat));

      // Chest (upper torso)
      const chest = makePart(new C.Box(new C.Vec3(0.13, 0.18, 0.08)), pos.x, chestY, pos.z, 10,
        new T.Mesh(new T.CylinderGeometry(0.22, 0.18, 0.45, 12), clothMat));

      // Hips (lower torso)
      const hips = makePart(new C.Box(new C.Vec3(0.1, 0.08, 0.07)), pos.x, hipY, pos.z, 8,
        new T.Mesh(new T.BoxGeometry(0.3, 0.14, 0.18), clothDarkMat));

      // Upper arms (2)
      const uArmL = makePart(new C.Box(new C.Vec3(0.04, 0.15, 0.04)), pos.x - armX, uArmY, pos.z, 3,
        armMesh(clothMat, -1));
      const uArmR = makePart(new C.Box(new C.Vec3(0.04, 0.15, 0.04)), pos.x + armX, uArmY, pos.z, 3,
        armMesh(clothMat, 1));

      // Forearms (2)
      const foreL = makePart(new C.Box(new C.Vec3(0.035, 0.15, 0.035)), pos.x - armX, foreY, pos.z, 2,
        foreMesh(skinMat));
      const foreR = makePart(new C.Box(new C.Vec3(0.035, 0.15, 0.035)), pos.x + armX, foreY, pos.z, 2,
        foreMesh(skinMat));

      // Thighs (2)
      const thighL = makePart(new C.Box(new C.Vec3(0.05, 0.18, 0.05)), pos.x - legX, thighY, pos.z, 5,
        legMesh(clothDarkMat));
      const thighR = makePart(new C.Box(new C.Vec3(0.05, 0.18, 0.05)), pos.x + legX, thighY, pos.z, 5,
        legMesh(clothDarkMat));

      // Shins (2)
      const shinL = makePart(new C.Box(new C.Vec3(0.045, 0.18, 0.045)), pos.x - legX, shinY, pos.z, 4,
        shinMesh(darkMat));
      const shinR = makePart(new C.Box(new C.Vec3(0.045, 0.18, 0.045)), pos.x + legX, shinY, pos.z, 4,
        shinMesh(darkMat));

      // ---- Constraints (joints) ----
      // Neck: head -> chest
      connect(head, chest, 0, -0.16, 0, 0, 0.18, 0, [0, 1, 0], [0, 1, 0], Math.PI/4, Math.PI/6);
      // Spine: chest -> hips
      connect(chest, hips, 0, -0.18, 0, 0, 0.08, 0, [0, 1, 0], [0, 1, 0], Math.PI/8, Math.PI/8);
      // Shoulders: upper arm -> chest
      connect(uArmL, chest, 0, 0.08, 0, -0.13, 0.15, 0, [0, 1, 0], [0, 1, 0], Math.PI/2, Math.PI/4);
      connect(uArmR, chest, 0, 0.08, 0, 0.13, 0.15, 0, [0, 1, 0], [0, 1, 0], Math.PI/2, Math.PI/4);
      // Elbows: forearm -> upper arm
      connect(foreL, uArmL, 0, 0.08, 0, 0, -0.08, 0, [0, 1, 0], [0, 1, 0], Math.PI/6, Math.PI/12);
      connect(foreR, uArmR, 0, 0.08, 0, 0, -0.08, 0, [0, 1, 0], [0, 1, 0], Math.PI/6, Math.PI/12);
      // Hips: thigh -> hips
      connect(thighL, hips, 0, 0.09, 0, -0.1, -0.08, 0, [0, 1, 0], [0, 1, 0], Math.PI/3, Math.PI/6);
      connect(thighR, hips, 0, 0.09, 0, 0.1, -0.08, 0, [0, 1, 0], [0, 1, 0], Math.PI/3, Math.PI/6);
      // Knees: shin -> thigh
      connect(shinL, thighL, 0, 0.09, 0, 0, -0.09, 0, [0, 1, 0], [0, 1, 0], Math.PI/8, Math.PI/12);
      connect(shinR, thighR, 0, 0.09, 0, 0, -0.09, 0, [0, 1, 0], [0, 1, 0], Math.PI/8, Math.PI/12);

      // Apply death impulse to all parts
      const ix = knockDir.x * 6, iy = 2 + knockDir.y * 3, iz = knockDir.z * 6;
      for (const b of bodies) {
        b.velocity.set(ix + (Math.random() - 0.5) * 2, iy + Math.random() * 2, iz + (Math.random() - 0.5) * 2);
        b.angularVelocity.set((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 4);
        b.wakeUp();
      }
    }

    npc.ragdollBodies = bodies;
    npc.ragdollMeshes = meshes;
    npc.ragdollConstraints = constraints;
  }

  // Mesh builders for ragdoll limbs (visual only, synced to physics each frame)
  function armMesh(mat, side) {
    const T = THREE;
    const grp = new T.Group();
    const upper = new T.Mesh(new T.CylinderGeometry(0.05, 0.045, 0.3, 8), mat);
    upper.position.y = -0.08;
    grp.add(upper);
    const shCap = new T.Mesh(new T.SphereGeometry(0.07, 8, 6), mat);
    shCap.position.y = 0.02;
    grp.add(shCap);
    return grp;
  }
  function foreMesh(mat) {
    const T = THREE;
    const grp = new T.Group();
    const fore = new T.Mesh(new T.CylinderGeometry(0.045, 0.04, 0.3, 8), mat);
    fore.position.y = -0.08;
    grp.add(fore);
    const hand = new T.Mesh(new T.BoxGeometry(0.07, 0.06, 0.04), mat);
    hand.position.y = -0.26;
    grp.add(hand);
    return grp;
  }
  function legMesh(mat) {
    const T = THREE;
    const grp = new T.Group();
    const upper = new T.Mesh(new T.CylinderGeometry(0.07, 0.06, 0.35, 8), mat);
    upper.position.y = -0.1;
    grp.add(upper);
    const hip = new T.Mesh(new T.SphereGeometry(0.07, 8, 6), mat);
    hip.position.y = 0.04;
    grp.add(hip);
    return grp;
  }
  function shinMesh(mat) {
    const T = THREE;
    const grp = new T.Group();
    const lower = new T.Mesh(new T.CylinderGeometry(0.06, 0.045, 0.35, 8), mat);
    lower.position.y = -0.1;
    grp.add(lower);
    const foot = new T.Mesh(new T.BoxGeometry(0.12, 0.05, 0.22), mat);
    foot.position.set(0, -0.3, 0.04);
    grp.add(foot);
    return grp;
  }

  function updateRagdoll(g, npc) {
    if (!npc.ragdollBodies) return;
    for (let i = 0; i < npc.ragdollBodies.length; i++) {
      npc.ragdollMeshes[i].position.copy(npc.ragdollBodies[i].position);
      npc.ragdollMeshes[i].quaternion.copy(npc.ragdollBodies[i].quaternion);
    }
  }

  function findGroundHeight(g, x, z) {
    let bestY = null;
    for (const col of g.colliders) {
      if (x > col.min.x && x < col.max.x && z > col.min.z && z < col.max.z) {
        if (bestY === null || col.max.y > bestY) bestY = col.max.y;
      }
    }
    return bestY;
  }

  function updateNPCs(g, dt) {
    const playerPos = g.player.pos;
    const now = performance.now();
    for (let i = g.npcs.length - 1; i >= 0; i--) {
      const npc = g.npcs[i];
      const def = npc.def;

      // Sync mesh to body (position only — rotation is controlled by facing logic)
      npc.mesh.position.copy(npc.body.position);
      if (npc.alive) {
        // Keep mesh upright; facing handled below
        npc.mesh.quaternion.set(0, 0, 0, 1);
      } else {
        // Dead: sync ragdoll parts if present
        if (npc.ragdollBodies) {
          updateRagdoll(g, npc);
        } else {
          npc.mesh.quaternion.copy(npc.body.quaternion);
        }
      }

      // Hit flash
      if (npc.hitFlash > 0) {
        npc.hitFlash -= dt;
        const intensity = Math.max(0, npc.hitFlash / 0.15);
        npc.mesh.traverse(o => {
          if (o.isMesh && o.material && o.material.emissive) {
            o.material.emissive.setRGB(intensity, 0, 0);
            o.material.emissiveIntensity = intensity * 2;
          }
        });
      }

      // Dead NPCs: fade and remove after 15s (unless permanent ragdoll)
      if (!npc.alive) {
        if (npc.type.startsWith("ragdoll")) continue; // permanent — never fades
        if (now - npc.deathTime > 15000) {
          // Fade out
          const age = (now - npc.deathTime - 15000) / 1000;
          npc.mesh.traverse(o => {
            if (o.isMesh && o.material) {
              o.material.transparent = true;
              o.material.opacity = Math.max(0, 1 - age);
            }
          });
          // Fade ragdoll meshes too
          if (npc.ragdollMeshes) {
            for (const rm of npc.ragdollMeshes) {
              rm.traverse(o => {
                if (o.isMesh && o.material) {
                  o.material.transparent = true;
                  o.material.opacity = Math.max(0, 1 - age);
                }
              });
            }
          }
          if (age > 1) { removeNPC(g, npc); continue; }
        }
        continue;
      }

      // Skip AI if grabbed by physgun
      if (g.grabbed === npc) {
        npc.body.velocity.set(0, 0, 0);
        continue;
      }

      const distToPlayer = npc.body.position.distanceTo(playerPos);
      const flatDir = new THREE.Vector3(
        playerPos.x - npc.body.position.x,
        0,
        playerPos.z - npc.body.position.z
      );
      const flatDist = flatDir.length();
      if (flatDist > 0.01) flatDir.normalize();

      npc.stateTime += dt;
      npc.attackTimer -= dt;

      // --- State machine ---
      if (def.hostile && flatDist < 40 && npc.state === "idle") {
        npc.state = "chase"; npc.stateTime = 0;
        if (npc.type === "zombie") playSound("zombie_alert", { volume: 0.4 });
      }

      // Zombie idle moans
      if (npc.type === "zombie" && npc.state === "idle") {
        npc.moanTimer = (npc.moanTimer || 0) - dt;
        if (npc.moanTimer <= 0) {
          playSound("zombie_idle", { volume: 0.2, pitch: 0.85 + Math.random() * 0.3 });
          npc.moanTimer = 4 + Math.random() * 6;
        }
      }

      if (npc.state === "idle") {
        // Pick wander target occasionally
        npc.wanderTimer -= dt;
        if (npc.wanderTimer <= 0 || !npc.wanderTarget) {
          npc.wanderTimer = 3 + Math.random() * 4;
          const ang = Math.random() * Math.PI * 2;
          const r = 5 + Math.random() * 15;
          npc.wanderTarget = new THREE.Vector3(
            npc.body.position.x + Math.cos(ang) * r,
            npc.body.position.y,
            npc.body.position.z + Math.sin(ang) * r
          );
        }
        if (npc.wanderTarget) {
          const wd = new THREE.Vector3(
            npc.wanderTarget.x - npc.body.position.x, 0,
            npc.wanderTarget.z - npc.body.position.z
          );
          if (wd.length() > 1) {
            wd.normalize();
            moveNPC(npc, wd, def.speed * 0.5, dt);
          }
        }
      } else if (npc.state === "flee") {
        // Run away from player
        if (flatDist > 0.1) {
          const fleeDir = flatDir.clone().negate();
          moveNPC(npc, fleeDir, def.speed, dt);
        }
        // Stop fleeing after a while if far enough
        if (distToPlayer > 30 && npc.stateTime > 5) {
          npc.state = "idle"; npc.stateTime = 0; npc.wanderTimer = 0;
        }
      } else if (npc.state === "chase") {
        if (def.behavior === "ranged") {
          // Keep distance, shoot
          if (flatDist > def.attackRange * 0.6) {
            moveNPC(npc, flatDir, def.speed, dt);
          } else if (flatDist < def.attackRange * 0.3) {
            moveNPC(npc, flatDir.clone().negate(), def.speed * 0.7, dt);
          }
          // Shoot
          if (flatDist < def.attackRange && npc.attackTimer <= 0) {
            npcAttack(g, npc, flatDir, flatDist);
            npc.attackTimer = def.attackCd;
          }
        } else if (def.behavior === "melee") {
          // Charge at player
          if (flatDist > def.attackRange) {
            moveNPC(npc, flatDir, def.speed, dt);
          } else if (npc.attackTimer <= 0) {
            npcAttack(g, npc, flatDir, flatDist);
            npc.attackTimer = def.attackCd;
          }
        } else if (def.behavior === "jumper") {
          // Headcrab: approach then jump
          if (flatDist > def.attackRange) {
            moveNPC(npc, flatDir, def.speed, dt);
          } else if (npc.attackTimer <= 0) {
            // Jump at player
            npc.body.velocity.y = 8;
            npc.body.velocity.x = flatDir.x * 6;
            npc.body.velocity.z = flatDir.z * 6;
            npc.attackTimer = def.attackCd;
          }
        }
        // Give up if too far
        if (distToPlayer > 60) { npc.state = "idle"; npc.stateTime = 0; }
      }

      // Walking animation
      if (npc.body.velocity.length() > 0.5) {
        npc.walkPhase += dt * 8;
        const parts = npc.mesh.userData.parts;
        if (parts && parts.legL) {
          const swing = Math.sin(npc.walkPhase) * 0.4;
          parts.legL.rotation.x = swing;
          parts.legR.rotation.x = -swing;
          parts.armL.rotation.x = -swing * 0.7;
          parts.armR.rotation.x = swing * 0.7;
        }
      }

      // Face movement/player direction
      let faceDir = null;
      if (npc.state === "chase" || npc.state === "flee") faceDir = flatDir;
      else if (npc.wanderTarget) {
        const wd = new THREE.Vector3(
          npc.wanderTarget.x - npc.body.position.x, 0,
          npc.wanderTarget.z - npc.body.position.z
        );
        if (wd.length() > 0.5) faceDir = wd.clone().normalize();
      }
      if (faceDir && npc.state !== "dead") {
        const targetAngle = Math.atan2(flatDir.x, flatDir.z);
        const currentAngle = npc.mesh.rotation.y;
        let diff = targetAngle - currentAngle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        npc.mesh.rotation.y += diff * Math.min(1, dt * 8);
      }

      // Remove if fallen below kill plane
      if (npc.body.position.y < g.killY) { removeNPC(g, npc); continue; }
    }
  }

  function moveNPC(npc, dir, speed, dt) {
    const v = npc.body.velocity;
    const desiredX = dir.x * speed;
    const desiredZ = dir.z * speed;
    // Smooth toward desired velocity
    v.x += (desiredX - v.x) * Math.min(1, dt * 8);
    v.z += (desiredZ - v.z) * Math.min(1, dt * 8);
    npc.body.wakeUp();
  }

  function npcAttack(g, npc, dir, dist) {
    const def = npc.def;
    if (def.behavior === "ranged") {
      const hitChance = Math.max(0.2, 1 - dist / def.attackRange);
      spawnTracer(g, npc.body.position, g.player.pos);
      playSound(npc.type === "combine" ? "ar2_fire" : "smg1_fire", { volume: 0.15, pitch: 0.9 + Math.random() * 0.2 });
      if (Math.random() < hitChance) {
        damagePlayer(g, def.damage);
      }
    } else {
      // Melee — must be close
      if (npc.type === "zombie") {
        playSound(Math.random() < 0.5 ? "zombie_attack" : "zombie_claw_miss", { volume: 0.4 });
      }
      if (dist < def.attackRange + 0.5) {
        damagePlayer(g, def.damage);
        if (npc.type === "zombie") playSound("zombie_claw_hit", { volume: 0.35 });
        // Knockback
        g.player.vel.x += dir.x * 5;
        g.player.vel.z += dir.z * 5;
        g.player.vel.y += 3;
      }
    }
  }

  function damagePlayer(g, dmg) {
    const p = g.player;
    p.hp = Math.max(0, p.hp - dmg);
    p.lastDamageTime = performance.now();
    const he = document.getElementById("hudHealth");
    if (he) he.textContent = p.hp;
    // Red flash
    const flash = document.getElementById("dmgFlash");
    if (flash) { flash.style.opacity = "0.6"; setTimeout(() => { if (flash) flash.style.opacity = "0"; }, 100); }
    if (p.hp <= 0) {
      // Respawn
      p.hp = 100;
      if (he) he.textContent = p.hp;
      if (g.playerSpawn) p.pos.copy(g.playerSpawn);
      else p.pos.set(0, 5, 20);
      p.vel.set(0, 0, 0);
      consoleLog("You died! Respawned.", "err");
    }
  }

  // Simple tracer line for NPC gunfire
  let tracerPool = [];
  function spawnTracer(g, from, to) {
    const T = THREE;
    const geo = new T.BufferGeometry().setFromPoints([
      new T.Vector3(from.x, from.y, from.z),
      new T.Vector3(to.x, to.y, to.z)
    ]);
    const mat = new T.LineBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.8 });
    const line = new T.Line(geo, mat);
    g.scene.add(line);
    tracerPool.push({ line, mat, time: performance.now() });
  }

  function updateTracers(g, dt) {
    const now = performance.now();
    for (let i = tracerPool.length - 1; i >= 0; i--) {
      const t = tracerPool[i];
      const age = (now - t.time) / 1000;
      if (age > 0.1) {
        g.scene.remove(t.line);
        t.line.geometry.dispose();
        t.mat.dispose();
        tracerPool.splice(i, 1);
      } else {
        t.mat.opacity = 0.8 * (1 - age / 0.1);
      }
    }
  }

  function buildHudBar() {
