  // ==================== BSP PARSER ====================
  const BSP_SCALE = 0.0254;

  // LZMA decompression for compressed BSP lumps
  async function decompressLZMA(lumpData) {
    const lzma1 = await import('https://esm.sh/lzma1@0.3.0');
    const view = new DataView(lumpData.buffer, lumpData.byteOffset, lumpData.byteLength);
    // Source BSP LZMA header: "LZMA"(4) + actualSize(4) + lzmaSize(4) + probByte(1) + dictSize(4) = 17 bytes
    const actualSize = view.getInt32(4, true);
    const probByte = lumpData[12];
    const dictSize = view.getInt32(13, true);
    const compressed = lumpData.subarray(17);
    // Build standard LZMA format: propByte(1) + dictSize(4) + uncompressedSize(8) + data
    const stdBuf = new Uint8Array(13 + compressed.length);
    stdBuf[0] = probByte;
    new DataView(stdBuf.buffer).setUint32(1, dictSize, true);
    // 8-byte uncompressed size (low 32 bits, then high 32 bits = 0)
    new DataView(stdBuf.buffer).setUint32(5, actualSize, true);
    new DataView(stdBuf.buffer).setUint32(9, 0, true);
    stdBuf.set(compressed, 13);
    return lzma1.decompress(stdBuf);
  }

  async function parseBSP(file) {
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);
    const u8 = new Uint8Array(buf);

    const magic = String.fromCharCode(u8[0], u8[1], u8[2], u8[3]);
    if (magic !== 'VBSP') throw new Error('Not a VBSP file (got: ' + magic + ')');
    const version = view.getInt32(4, true);

    // Read 64 lump headers: offset(4) + length(4) + version(4) + fourCC(4) = 16 bytes
    const lumps = [];
    for (let i = 0; i < 64; i++) {
      const off = 8 + i * 16;
      const fourCC = String.fromCharCode(u8[off+12], u8[off+13], u8[off+14], u8[off+15]);
      lumps.push({
        offset: view.getInt32(off, true),
        length: view.getInt32(off + 4, true),
        version: view.getInt32(off + 8, true),
        fourCC: fourCC,
        compressed: fourCC === 'LZMA',
      });
    }

    // Get lump data, decompressing if needed
    const lumpCache = {};
    async function getLumpData(i) {
      if (lumpCache[i]) return lumpCache[i];
      const l = lumps[i];
      if (l.length === 0) return new Uint8Array(0);
      let data = u8.subarray(l.offset, l.offset + l.length);
      if (l.compressed) {
        data = await decompressLZMA(data);
      }
      lumpCache[i] = data;
      return data;
    }

    async function lumpView(i) {
      const data = await getLumpData(i);
      return new DataView(data.buffer, data.byteOffset, data.byteLength);
    }

    // --- Planes (Lump 1): {float[3] normal, float dist, int type} = 20 bytes ---
    const pd = await lumpView(1);
    const planes = [];
    const numPlanes = Math.floor(pd.byteLength / 20);
    for (let i = 0; i < numPlanes; i++) {
      const o = i * 20;
      planes.push({
        n: [pd.getFloat32(o, true), pd.getFloat32(o + 4, true), pd.getFloat32(o + 8, true)],
        d: pd.getFloat32(o + 12, true),
      });
    }

    // --- Vertices (Lump 3): {float[3] point} = 12 bytes ---
    const vd = await lumpView(3);
    const vertices = [];
    const numVerts = Math.floor(vd.byteLength / 12);
    for (let i = 0; i < numVerts; i++) {
      const o = i * 12;
      vertices.push([vd.getFloat32(o, true), vd.getFloat32(o + 4, true), vd.getFloat32(o + 8, true)]);
    }

    // --- Edges (Lump 12): {uint16 v[2]} = 4 bytes ---
    const ed = await lumpView(12);
    const edges = [];
    const numEdges = Math.floor(ed.byteLength / 4);
    for (let i = 0; i < numEdges; i++) {
      const o = i * 4;
      edges.push([ed.getUint16(o, true), ed.getUint16(o + 2, true)]);
    }

    // --- Surfedges (Lump 13): {int32 e} = 4 bytes ---
    const sed = await lumpView(13);
    const surfedges = [];
    const numSurfedges = Math.floor(sed.byteLength / 4);
    for (let i = 0; i < numSurfedges; i++) {
      surfedges.push(sed.getInt32(i * 4, true));
    }

    // --- Faces (Lump 7): 56 bytes each ---
    const fd = await lumpView(7);
    const faces = [];
    const numFaces = Math.floor(fd.byteLength / 56);
    for (let i = 0; i < numFaces; i++) {
      const o = i * 56;
      faces.push({
        pnum: fd.getUint16(o, true),
        side: fd.getInt8(o + 2),
        onnode: fd.getInt8(o + 3),
        fstedge: fd.getInt32(o + 4, true),
        numedge: fd.getInt16(o + 8, true),
        texinfo: fd.getInt16(o + 10, true),
        dispInfo: fd.getInt16(o + 12, true),
      });
    }

    // --- Brushes (Lump 18): {int firstside, int numsides, int contents} = 12 bytes ---
    const bd = await lumpView(18);
    const brushes = [];
    const numBrushes = Math.floor(bd.byteLength / 12);
    for (let i = 0; i < numBrushes; i++) {
      const o = i * 12;
      brushes.push({
        firstside: bd.getInt32(o, true),
        numsides: bd.getInt32(o + 4, true),
        contents: bd.getInt32(o + 8, true),
      });
    }

    // --- Brush sides (Lump 19): {uint16 planenum, int16 texinfo, int16 dispinfo, int16 bevel} = 8 bytes ---
    const sd = await lumpView(19);
    const brushSides = [];
    const numSides = Math.floor(sd.byteLength / 8);
    for (let i = 0; i < numSides; i++) {
      const o = i * 8;
      brushSides.push({
        planenum: sd.getUint16(o, true),
        texinfo: sd.getInt16(o + 2, true),
      });
    }

    // --- Texinfo (Lump 6): 72 bytes each ---
    const td6 = await lumpView(6);
    const texinfos = [];
    const numTexinfo = Math.floor(td6.byteLength / 72);
    for (let i = 0; i < numTexinfo; i++) {
      const o = i * 72;
      const sv = [td6.getFloat32(o,true), td6.getFloat32(o+4,true), td6.getFloat32(o+8,true), td6.getFloat32(o+12,true)];
      const tv = [td6.getFloat32(o+16,true), td6.getFloat32(o+20,true), td6.getFloat32(o+24,true), td6.getFloat32(o+28,true)];
      const texdataIdx = td6.getInt32(o + 68, true);
      texinfos.push({ sv, tv, texdata: texdataIdx });
    }

    // --- Texdata (Lump 2): 32 bytes each ---
    const td2 = await lumpView(2);
    const texdatas = [];
    const numTexdata = Math.floor(td2.byteLength / 32);
    for (let i = 0; i < numTexdata; i++) {
      const o = i * 32;
      texdatas.push({
        nameID: td2.getInt32(o + 12, true),
        width: td2.getInt32(o + 16, true),
        height: td2.getInt32(o + 20, true),
      });
    }

    // --- Texdata String Table (Lump 44): array of int32 ---
    const td44 = await lumpView(44);
    const stringTable = [];
    const numStrings = Math.floor(td44.byteLength / 4);
    for (let i = 0; i < numStrings; i++) stringTable.push(td44.getInt32(i * 4, true));

    // --- Texdata String Data (Lump 43): null-terminated strings ---
    const td43Data = await getLumpData(43);
    function readTexName(stringTableID) {
      if (stringTableID < 0 || stringTableID >= stringTable.length) return null;
      const offset = stringTable[stringTableID];
      let end = offset;
      while (end < td43Data.length && td43Data[end] !== 0) end++;
      return new TextDecoder().decode(td43Data.subarray(offset, end));
    }

    function normalizeTexName(rawName) {
      if (!rawName) return null;
      let name = rawName.toLowerCase();
      // Strip "maps/<mapname>/" prefix (per-instance patch textures)
      const mapsMatch = name.match(/^maps\/[^/]+\/(.+)$/);
      if (mapsMatch) name = mapsMatch[1];
      // Strip trailing coordinate suffix like "_0_992_-12736" (3 underscore-separated numbers)
      name = name.replace(/_(-?\d+)_(-?\d+)_(-?\d+)$/, '');
      return name;
    }

    function resolveTexture(texinfoIdx) {
      const ti = texinfoIdx >= 0 && texinfoIdx < texinfos.length ? texinfos[texinfoIdx] : null;
      if (!ti) return { name: null, sv: [1,0,0,0], tv: [0,1,0,0], width: 512, height: 512 };
      const td = ti.texdata >= 0 && ti.texdata < texdatas.length ? texdatas[ti.texdata] : null;
      const rawName = td ? readTexName(td.nameID) : null;
      return {
        name: normalizeTexName(rawName),
        sv: ti.sv, tv: ti.tv,
        width: (td && td.width > 0) ? td.width : 512,
        height: (td && td.height > 0) ? td.height : 512,
      };
    }

    // --- Entities (Lump 0) ---
    const td0Data = await getLumpData(0);
    const entText = new TextDecoder().decode(td0Data);
    const entities = parseEntities(entText);

    // --- Build face windings (vertex lists) ---
    const faceVerts = [];
    for (const face of faces) {
      if (face.numedge < 3 || face.dispInfo >= 0) { faceVerts.push(null); continue; }
      const verts = [];
      for (let i = 0; i < face.numedge; i++) {
        const se = surfedges[face.fstedge + i];
        if (se === undefined) break;
        const edgeIdx = Math.abs(se);
        if (edgeIdx >= edges.length) break;
        const edge = edges[edgeIdx];
        const vi = se >= 0 ? edge[0] : edge[1];
        if (vi < vertices.length) verts.push(vertices[vi]);
      }
      faceVerts.push(verts.length >= 3 ? verts : null);
    }

    // --- Build brush AABBs for collision ---
    const brushColliders = [];
    const SKIP_BRUSH_TEX = /^(tools\/toolsskybox|skybox|tools\/toolstrigger|trigger|tools\/toolshint|tools\/toolsskip|tools\/toolsoccluder|tools\/toolsareaportal|tools\/toolsblocklos|tools\/toolsblocklight)/i;
    // Debug: collect all brush side texture names
    const brushTexDebug = {};
    for (const brush of brushes) {
      if (!(brush.contents & 0x1)) continue; // CONTENTS_SOLID
      const sides = [];
      let isSkybox = false;
      for (let s = 0; s < brush.numsides; s++) {
        const si = brushSides[brush.firstside + s];
        if (!si || si.planenum >= planes.length) continue;
        // Check texture name — skip skybox/tool brushes
        if (si.texinfo >= 0 && si.texinfo < texinfos.length) {
          const td = texinfos[si.texinfo].texdata >= 0 && texinfos[si.texinfo].texdata < texdatas.length ? texdatas[texinfos[si.texinfo].texdata] : null;
          const texName = td ? normalizeTexName(readTexName(td.nameID)) : null;
          if (texName) brushTexDebug[texName] = (brushTexDebug[texName] || 0) + 1;
          if (texName && SKIP_BRUSH_TEX.test(texName)) { isSkybox = true; break; }
        }
        sides.push(planes[si.planenum]);
      }
      if (isSkybox) continue;
      if (sides.length < 4) continue;
      // Intersect planes to find AABB
      let minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
      for (let i = 0; i < sides.length; i++) {
        for (let j = i+1; j < sides.length; j++) {
          for (let k = j+1; k < sides.length; k++) {
            const v = intersectPlanes3(sides[i], sides[j], sides[k]);
            if (!v) continue;
            let ok = true;
            for (let p = 0; p < sides.length; p++) {
              const pl = sides[p];
              if (pl.n[0]*v[0] + pl.n[1]*v[1] + pl.n[2]*v[2] - pl.d > 0.01) { ok = false; break; }
            }
            if (!ok) continue;
            if (v[0]<minX) minX=v[0]; if (v[0]>maxX) maxX=v[0];
            if (v[1]<minY) minY=v[1]; if (v[1]>maxY) maxY=v[1];
            if (v[2]<minZ) minZ=v[2]; if (v[2]>maxZ) maxZ=v[2];
          }
        }
      }
      if (minX === Infinity) continue;
      // Skip absurdly large brushes (likely skybox or map bounds)
      const sx = maxX - minX, sy = maxY - minY, sz = maxZ - minZ;
      if (sx > 8192 || sy > 8192 || sz > 8192) continue;
      // Collect actual brush vertices for convex collision (slopes)
      const brushVerts = [];
      for (let i = 0; i < sides.length; i++) {
        for (let j = i+1; j < sides.length; j++) {
          for (let k = j+1; k < sides.length; k++) {
            const v = intersectPlanes3(sides[i], sides[j], sides[k]);
            if (!v) continue;
            let ok = true;
            for (let p = 0; p < sides.length; p++) {
              const pl = sides[p];
              if (pl.n[0]*v[0] + pl.n[1]*v[1] + pl.n[2]*v[2] - pl.d > 0.01) { ok = false; break; }
            }
            if (!ok) continue;
            // Deduplicate
            const dup = brushVerts.some(bv => Math.abs(bv[0]-v[0])<0.01 && Math.abs(bv[1]-v[1])<0.01 && Math.abs(bv[2]-v[2])<0.01);
            if (!dup) brushVerts.push(v);
          }
        }
      }
      // Detect if brush has sloped planes (non-axis-aligned)
      let hasSlope = false;
      for (const s of sides) {
        const n = s.n;
        const isAxisAligned = (Math.abs(Math.abs(n[0])-1)<0.01 && Math.abs(n[1])<0.01 && Math.abs(n[2])<0.01) ||
                             (Math.abs(n[1])-1<0.01 && Math.abs(n[0])<0.01 && Math.abs(n[2])<0.01) ||
                             (Math.abs(Math.abs(n[2])-1)<0.01 && Math.abs(n[0])<0.01 && Math.abs(n[1])<0.01);
        if (!isAxisAligned) { hasSlope = true; break; }
      }
      brushColliders.push({ min: [minX,minY,minZ], max: [maxX,maxY,maxZ], verts: brushVerts.length >= 4 ? brushVerts : null, hasSlope, planes: sides });
    }
    console.log("[BSP] Brush colliders:", brushColliders.length, "sizes:", brushColliders.map(c => `[${Math.round(c.max[0]-c.min[0])},${Math.round(c.max[1]-c.min[1])},${Math.round(c.max[2]-c.min[2])}]`).slice(0, 20));
    console.log("[BSP] Brush texture names:", brushTexDebug);

    // --- Collect texture names ---
    const allTexNames = new Set();
    for (const face of faces) {
      if (face.texinfo < 0) continue;
      const tex = resolveTexture(face.texinfo);
      if (tex.name) allTexNames.add(tex.name);
    }

    return {
      faces, faceVerts, planes, vertices, edges, surfedges,
      texinfos, resolveTexture,
      brushColliders, entities, textureNames: [...allTexNames].sort(),
      numPlanes, numBrushes, numFaces, numVerts: numVerts,
      compressed: lumps.some(l => l.compressed),
    };
  }

  function intersectPlanes3(p1, p2, p3) {
    const a = p1.n, b = p2.n, c = p3.n;
    const det = a[0]*(b[1]*c[2]-b[2]*c[1]) - a[1]*(b[0]*c[2]-b[2]*c[0]) + a[2]*(b[0]*c[1]-b[1]*c[0]);
    if (Math.abs(det) < 1e-6) return null;
    const inv = 1 / det;
    const x = ((b[1]*c[2]-b[2]*c[1])*p1.d - (a[1]*c[2]-a[2]*c[1])*p2.d + (a[1]*b[2]-a[2]*b[1])*p3.d) * inv;
    const y = (-(b[0]*c[2]-b[2]*c[0])*p1.d + (a[0]*c[2]-a[2]*c[0])*p2.d - (a[0]*b[2]-a[2]*b[0])*p3.d) * inv;
    const z = ((b[0]*c[1]-b[1]*c[0])*p1.d - (a[0]*c[1]-a[1]*c[0])*p2.d + (a[0]*b[1]-a[1]*b[0])*p3.d) * inv;
    return [x, y, z];
  }

  // Build convex hull faces from vertices + planes (for sloped brush collision)
  function computeConvexFaces(verts, planes) {
    if (verts.length < 4) return null;
    const faces = [];
    const eps = 0.01;
    for (const pl of planes) {
      // Find all vertices on this plane
      const onPlane = [];
      for (let i = 0; i < verts.length; i++) {
        const dist = pl.n[0] * verts[i].x + pl.n[1] * verts[i].y + pl.n[2] * verts[i].z - pl.d;
        if (Math.abs(dist) < eps) onPlane.push(i);
      }
      if (onPlane.length < 3) continue;
      // Sort vertices CCW around the plane normal (project onto 2D)
      const n = new CANNON.Vec3(pl.n[0], pl.n[1], pl.n[2]);
      n.normalize();
      // Pick two tangent vectors
      const up = Math.abs(n.y) < 0.9 ? new CANNON.Vec3(0, 1, 0) : new CANNON.Vec3(1, 0, 0);
      const right = new CANNON.Vec3();
      n.cross(up, right);
      right.normalize();
      const realUp = new CANNON.Vec3();
      right.cross(n, realUp);
      realUp.normalize();
      // Compute centroid
      const cx = onPlane.reduce((s, i) => s + verts[i].x, 0) / onPlane.length;
      const cy = onPlane.reduce((s, i) => s + verts[i].y, 0) / onPlane.length;
      const cz = onPlane.reduce((s, i) => s + verts[i].z, 0) / onPlane.length;
      // Sort by angle
      const sorted = onPlane.map(i => {
        const v = verts[i];
        const dx = v.x - cx, dy = v.y - cy, dz = v.z - cz;
        const u = dx * right.x + dy * right.y + dz * right.z;
        const w = dx * realUp.x + dy * realUp.y + dz * realUp.z;
        return { i, angle: Math.atan2(w, u) };
      }).sort((a, b) => a.angle - b.angle);
      // Ensure CCW winding for outward-facing normal
      // Check first triangle's normal direction
      if (sorted.length >= 3) {
        const v0 = verts[sorted[0].i], v1 = verts[sorted[1].i], v2 = verts[sorted[2].i];
        const e1 = { x: v1.x - v0.x, y: v1.y - v0.y, z: v1.z - v0.z };
        const e2 = { x: v2.x - v0.x, y: v2.y - v0.y, z: v2.z - v0.z };
        const crossX = e1.y * e2.z - e1.z * e2.y;
        const crossY = e1.z * e2.x - e1.x * e2.z;
        const crossZ = e1.x * e2.y - e1.y * e2.x;
        const dot = crossX * n.x + crossY * n.y + crossZ * n.z;
        if (dot < 0) sorted.reverse();
      }
      faces.push(sorted.map(s => s.i));
    }
    return faces.length > 0 ? faces : null;
  }

  function parseEntities(text) {
    const entities = [];
    let pos = 0;
    while (pos < text.length) {
      const start = text.indexOf('{', pos);
      if (start < 0) break;
      const end = text.indexOf('}', start);
      if (end < 0) break;
      const block = text.substring(start + 1, end);
      const ent = {};
      const re = /"([^"]+)"\s+"([^"]*)"/g;
      let m;
      while ((m = re.exec(block)) !== null) ent[m[1]] = m[2];
      entities.push(ent);
      pos = end + 1;
    }
    return entities;
  }

  let _emoTex = null;
  function getEmoTexture() {
    if (_emoTex) return _emoTex;
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const x = c.getContext('2d');
    // Bright magenta/black checker — the iconic Source "missing texture" look
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
      x.fillStyle = (i+j)%2===0 ? '#ff00ff' : '#000000';
      x.fillRect(i*16, j*16, 16, 16);
    }
    // Diagonal "MISSING" text so it's obviously a placeholder, not a real texture
    x.save();
    x.translate(64, 64);
    x.rotate(-Math.PI/4);
    x.font = 'bold 18px monospace';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillStyle = '#000';
    x.fillText('MISSING', 1, 1);
    x.fillStyle = '#fff';
    x.fillText('MISSING', 0, 0);
    x.restore();
    _emoTex = new THREE.CanvasTexture(c);
    _emoTex.wrapS = _emoTex.wrapT = THREE.RepeatWrapping;
    return _emoTex;
  }

  let bspMissingTextures = new Set();
  let bspTexLogEl = null;

  // Tool textures to skip (invisible/non-rendered)
  const BSP_SKIP_TEXTURES = /^(tools\/|skybox|nodraw|invisible|clip|hint|skip|trigger|occluder)/i;

  function buildBSPGeometry(g, bsp) {
    const T = THREE, C = CANNON;
    bspMissingTextures = new Set();
    const kvTex = g.kvTextures || {};
    const groups = {};
    const groupSurfaces = {};

    for (let fi = 0; fi < bsp.faces.length; fi++) {
      const face = bsp.faces[fi];
      const verts = bsp.faceVerts[fi];
      if (!verts || verts.length < 3) continue;

      const tex = bsp.resolveTexture(face.texinfo);
      const texName = tex.name || "__default";
      if (tex.name && BSP_SKIP_TEXTURES.test(tex.name)) continue;

      // Track missing textures
      const texUrl = BSP_TEXTURES[texName] || kvTex[texName];
      if (!texUrl && texName !== "__default") {
        bspMissingTextures.add(texName);
        const plane = bsp.planes[face.pnum];
        if (plane) {
          const ny = face.side ? -plane.n[1] : plane.n[1];
          const surfType = ny > 0.7 ? "floor" : ny < -0.7 ? "ceiling" : "wall";
          if (!groupSurfaces[texName]) groupSurfaces[texName] = new Set();
          groupSurfaces[texName].add(surfType);
        }
      }

      if (!groups[texName]) groups[texName] = { positions: [], normals: [], uvs: [] };
      const grp = groups[texName];

      // Face normal (Source → Three.js transform: x, z, -y)
      const plane = bsp.planes[face.pnum];
      if (!plane) continue;
      let nx = plane.n[0], ny = plane.n[1], nz = plane.n[2];
      if (face.side) { nx = -nx; ny = -ny; nz = -nz; }
      const tnx = nx, tny = nz, tnz = -ny;
      const nLen = Math.sqrt(tnx*tnx + tny*tny + tnz*tnz) || 1;
      const fnx = tnx/nLen, fny = tny/nLen, fnz = tnz/nLen;

      // Transform vertices and keep originals for UVs
      const tv = verts.map(bspTransform);
      const nv = new T.Vector3(fnx, fny, fnz);
      const up = Math.abs(nv.y) < 0.9 ? new T.Vector3(0,1,0) : new T.Vector3(1,0,0);
      const right = new T.Vector3().crossVectors(nv, up).normalize();
      const realUp = new T.Vector3().crossVectors(right, nv).normalize();
      const centroid = new T.Vector3();
      for (const v of tv) centroid.add(new T.Vector3(v[0], v[1], v[2]));
      centroid.divideScalar(tv.length);

      const sorted = tv.map((v, i) => {
        const dv = new T.Vector3(v[0]-centroid.x, v[1]-centroid.y, v[2]-centroid.z);
        return { v, orig: verts[i], angle: Math.atan2(dv.dot(realUp), dv.dot(right)) };
      }).sort((a, b) => a.angle - b.angle);

      const sv = tex.sv, tvv = tex.tv;
      const tw = tex.width || 512, th = tex.height || 512;

      for (let i = 1; i < sorted.length - 1; i++) {
        const a = sorted[0], b = sorted[i], c = sorted[i+1];
        grp.positions.push(a.v[0], a.v[1], a.v[2], b.v[0], b.v[1], b.v[2], c.v[0], c.v[1], c.v[2]);
        grp.normals.push(fnx, fny, fnz, fnx, fny, fnz, fnx, fny, fnz);
        for (const pt of [a, b, c]) {
          const o = pt.orig;
          grp.uvs.push(
            (o[0]*sv[0] + o[1]*sv[1] + o[2]*sv[2] + sv[3]) / tw,
            (o[0]*tvv[0] + o[1]*tvv[1] + o[2]*tvv[2] + tvv[3]) / th
          );
        }
      }
    }

    // Create meshes per texture group — use indexed geometry for smooth normals
    const loader = new T.TextureLoader();
    const emoTex = getEmoTexture();
    for (const [texName, data] of Object.entries(groups)) {
      if (data.positions.length === 0) continue;
      const geo = new T.BufferGeometry();
      // Build indexed geometry: deduplicate vertices so computeVertexNormals can smooth
      const posArr = data.positions;
      const uvArr = data.uvs;
      const uniqueVerts = [];
      const indexMap = new Map();
      const indices = [];
      for (let i = 0; i < posArr.length; i += 3) {
        const key = posArr[i].toFixed(4) + "," + posArr[i+1].toFixed(4) + "," + posArr[i+2].toFixed(4);
        let idx = indexMap.get(key);
        if (idx === undefined) {
          idx = uniqueVerts.length / 3;
          uniqueVerts.push(posArr[i], posArr[i+1], posArr[i+2]);
          indexMap.set(key, idx);
        }
        indices.push(idx);
      }
      // Build UV array matching unique vertices (use first occurrence's UV)
      const uniqueUVs = new Array(uniqueVerts.length / 3 * 2);
      const uvFilled = new Array(uniqueVerts.length / 3).fill(false);
      for (let i = 0, vi = 0; vi < indices.length; vi++, i += 2) {
        const vIdx = indices[vi];
        if (!uvFilled[vIdx]) {
          uniqueUVs[vIdx * 2] = uvArr[i];
          uniqueUVs[vIdx * 2 + 1] = uvArr[i + 1];
          uvFilled[vIdx] = true;
        }
      }
      geo.setAttribute('position', new T.Float32BufferAttribute(uniqueVerts, 3));
      geo.setAttribute('uv', new T.Float32BufferAttribute(uniqueUVs, 2));
      geo.setIndex(indices);
      // Smooth normals: computeVertexNormals averages normals across shared vertices
      geo.computeVertexNormals();
      const texUrl = BSP_TEXTURES[texName] || kvTex[texName];
      const mat = new T.MeshStandardMaterial({ roughness: 0.85, metalness: 0.05, side: T.DoubleSide, flatShading: false });
      if (texUrl) {
        loader.load(texUrl, (tex) => { tex.wrapS = tex.wrapT = T.RepeatWrapping; tex.colorSpace = T.SRGBColorSpace; mat.map = tex; mat.needsUpdate = true; });
      } else {
        mat.map = emoTex;
        mat.color.set(texName === "__default" ? 0xffffff : 0xffffff);
      }
      const mesh = new T.Mesh(geo, mat);
      mesh.receiveShadow = true;
      mesh.castShadow = true;
      g.scene.add(mesh);
    }

    // Collision: AABB for axis-aligned brushes, ConvexPolyhedron for sloped brushes
    let convexCount = 0, boxCount = 0;
    for (const c of bsp.brushColliders) {
      const tv0 = bspTransform(c.min), tv1 = bspTransform(c.max);
      const minX = Math.min(tv0[0], tv1[0]), maxX = Math.max(tv0[0], tv1[0]);
      const minY = Math.min(tv0[1], tv1[1]), maxY = Math.max(tv0[1], tv1[1]);
      const minZ = Math.min(tv0[2], tv1[2]), maxZ = Math.max(tv0[2], tv1[2]);
      const w = maxX-minX, h = maxY-minY, d = maxZ-minZ;
      if (w < 0.01 || h < 0.01 || d < 0.01) continue;
      // Always add AABB for player collision (fast, reliable)
      g.colliders.push({ min: { x: minX, y: minY, z: minZ }, max: { x: maxX, y: maxY, z: maxZ } });
      // For sloped brushes, also add a ConvexPolyhedron for prop physics
      if (c.hasSlope && c.verts && c.verts.length >= 4) {
        try {
          const verts = c.verts.map(v => {
            const t = bspTransform(v);
            return new C.Vec3(t[0] - (minX+maxX)/2, t[1] - (minY+maxY)/2, t[2] - (minZ+maxZ)/2);
          });
          // Build faces by finding which vertex triplets are on the same plane
          // Simple approach: use convex hull from vertices
          const faces = computeConvexFaces(verts, c.planes);
          if (faces && faces.length > 0) {
            const shape = new C.ConvexPolyhedron({ vertices: verts, faces: faces });
            const body = new C.Body({ type: C.Body.STATIC, shape });
            body.position.set((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2);
            g.world.addBody(body);
            convexCount++;
          } else {
            const body = new C.Body({ type: C.Body.STATIC, shape: new C.Box(new C.Vec3(w/2, h/2, d/2)) });
            body.position.set((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2);
            g.world.addBody(body);
            boxCount++;
          }
        } catch(e) {
          const body = new C.Body({ type: C.Body.STATIC, shape: new C.Box(new C.Vec3(w/2, h/2, d/2)) });
          body.position.set((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2);
          g.world.addBody(body);
          boxCount++;
        }
      } else {
        const body = new C.Body({ type: C.Body.STATIC, shape: new C.Box(new C.Vec3(w/2, h/2, d/2)) });
        body.position.set((minX+maxX)/2, (minY+maxY)/2, (minZ+maxZ)/2);
        g.world.addBody(body);
        boxCount++;
      }
    }
    console.log("[BSP] Collision: " + boxCount + " boxes, " + convexCount + " convex polyhedra (slopes)");

    showBSPTextureLog(bspMissingTextures, groupSurfaces, g.mapName);

    // Spawn point
    // Find all spawn point candidates
    const spawnTypes = ['info_player_start', 'info_player_deathmatch', 'info_player_terrorist', 'info_player_counterterrorist', 'gmod_player_start'];
    const spawnEnts = bsp.entities.filter(e => spawnTypes.includes(e.classname) && e.origin);
    console.log("[BSP] Spawn entities found:", spawnEnts.length, spawnEnts.map(e => e.classname + " @ " + e.origin));
    if (spawnEnts.length > 0) {
      const spawnEnt = spawnEnts[0];
      const parts = spawnEnt.origin.split(' ').map(Number);
      g.playerSpawn = new T.Vector3(parts[0]*BSP_SCALE, parts[2]*BSP_SCALE + 1.7, -parts[1]*BSP_SCALE);
      if (spawnEnt.angles) {
        const ang = spawnEnt.angles.split(' ').map(Number);
        g.playerSpawnYaw = -ang[1] * Math.PI / 180;
      }
      console.log("[BSP] Player spawn set to:", g.playerSpawn, "yaw:", g.playerSpawnYaw);
    } else {
      console.warn("[BSP] No spawn entity found! Entities:", bsp.entities.filter(e => e.classname).map(e => e.classname).slice(0, 20));
    }
  }

  function showBSPTextureLog(missing, surfaces, mapName) {
    if (bspTexLogEl) { bspTexLogEl.remove(); bspTexLogEl = null; }
    if (missing.size === 0) return;
    const el = document.createElement("div");
    el.className = "bsp-texlog";
    el.innerHTML = '<div class="bsp-texlog-header"><span>⚠ Missing Textures (' + missing.size + ')</span><span style="cursor:pointer;font-size:14px;" id="bspTexLogClose">×</span></div>';
    const list = document.createElement("div");
    const sortedMissing = [...missing].sort();
    for (const name of sortedMissing) {
      const surfTypes = surfaces[name] ? [...surfaces[name]].join("/") : "wall";
      const item = document.createElement("div");
      item.className = "bsp-texlog-item";
      const nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = name;
      const surfEl = document.createElement("span");
      surfEl.style.cssText = "font-size:11px;color:#888;margin-left:8px;";
      surfEl.textContent = surfTypes;
      item.appendChild(nameEl);
      item.appendChild(surfEl);
      list.appendChild(item);
    }
    const combinedPrompt = sortedMissing.map(name => {
      const surfTypes = surfaces[name] ? [...surfaces[name]].join("/") : "wall";
      return `Generate a seamless tileable PBR albedo texture for the Source engine BSP texture "${name}" from map "${mapName}". This texture appears on ${surfTypes} surfaces. Make it 512x512, photorealistic, seamlessly tileable.`;
    }).join("\n");
    const copyAllBtn = document.createElement("button");
    copyAllBtn.className = "copy";
    copyAllBtn.textContent = "Copy Prompt (All " + sortedMissing.length + ")";
    copyAllBtn.style.cssText = "width:100%;margin-top:8px;padding:8px;font-size:13px;";
    copyAllBtn.onclick = () => {
      navigator.clipboard.writeText(combinedPrompt).then(() => {
        copyAllBtn.textContent = "✓ Copied All Prompts";
        copyAllBtn.classList.add("copied");
        setTimeout(() => { copyAllBtn.textContent = "Copy Prompt (All " + sortedMissing.length + ")"; copyAllBtn.classList.remove("copied"); }, 1500);
      });
    };
    el.appendChild(list);
    el.appendChild(copyAllBtn);
    document.getElementById("root").appendChild(el);
    bspTexLogEl = el;
    document.getElementById("bspTexLogClose").onclick = () => { el.remove(); bspTexLogEl = null; };
  }

  function buildGeneralCity(g, addBox) {
    const T = THREE;
    const C_ROAD = 0x3a3a3e, C_SIDEWALK = 0x8a8a8e, C_GLASS = 0x6a9aaa;
    const buildingColors = [0x6a7a8a, 0x7a6a5a, 0x5a6a6a, 0x8a8a7a, 0x4a5a6a, 0x9a5a4a];

    const BLOCK = 60, ROAD = 12, GRID = 4;
    const TOTAL = GRID * BLOCK + (GRID + 1) * ROAD;
    const HALF = TOTAL / 2;

    // Road surface — one plane
    const roadGeo = new T.PlaneGeometry(TOTAL, TOTAL);
    roadGeo.rotateX(-Math.PI / 2);
    roadGeo.translate(0, 0.02, 0);
    const roadMesh = new T.Mesh(roadGeo, new T.MeshStandardMaterial({ color: C_ROAD, roughness: 0.95 }));
    roadMesh.receiveShadow = true;
    g.scene.add(roadMesh);

    // Collect all static box geometries to merge into one mesh
    const mergeGeos = [];
    const mergeColors = [];
    const tmpBox = new T.BoxGeometry(1, 1, 1);
    const colorObj = new T.Color();

    const addMergeBox = (x, y, z, w, h, d, color, isCollider = true) => {
      const geo = tmpBox.clone();
      geo.scale(w, h, d);
      geo.translate(x, y, z);
      mergeGeos.push(geo);
      colorObj.setHex(color);
      const count = geo.attributes.position.count;
      const arr = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        arr[i * 3] = colorObj.r;
        arr[i * 3 + 1] = colorObj.g;
        arr[i * 3 + 2] = colorObj.b;
      }
      mergeColors.push(arr);
      if (isCollider) {
        g.colliders.push({ min: { x: x - w / 2, y: y - h / 2, z: z - d / 2 }, max: { x: x + w / 2, y: y + h / 2, z: z + d / 2 } });
        const body = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)) });
        body.position.set(x, y, z);
        g.world.addBody(body);
      }
    };

    // Road markings — merged into the same geometry as buildings (yellow)
    const C_LINE = 0xffd040;
    for (let i = 0; i <= GRID; i++) {
      const pos = -HALF + i * (BLOCK + ROAD) + ROAD / 2;
      for (let d = -HALF; d < HALF; d += 6) {
        addMergeBox(d + 1.5, 0.03, pos, 3, 0.02, 0.2, C_LINE, false);
        addMergeBox(pos, 0.03, d + 1.5, 0.2, 0.02, 3, C_LINE, false);
      }
    }

    // Sidewalks + buildings
    for (let bx = 0; bx < GRID; bx++) {
      for (let bz = 0; bz < GRID; bz++) {
        const cx = -HALF + ROAD + bx * (BLOCK + ROAD) + BLOCK / 2;
        const cz = -HALF + ROAD + bz * (BLOCK + ROAD) + BLOCK / 2;

        addMergeBox(cx, 0.3, cz, BLOCK + 4, 0.6, BLOCK + 4, C_SIDEWALK);

        const subdivs = 1 + Math.floor(Math.random() * 3);
        const sub = BLOCK / subdivs;
        for (let sx = 0; sx < subdivs; sx++) {
          for (let sz = 0; sz < subdivs; sz++) {
            if (Math.random() < 0.15) continue;
            const bcx = cx - BLOCK / 2 + sub * (sx + 0.5);
            const bcz = cz - BLOCK / 2 + sub * (sz + 0.5);
            const bw = sub - 3 + Math.random() * 2;
            const bd = sub - 3 + Math.random() * 2;
            const distFromCenter = Math.sqrt(bcx * bcx + bcz * bcz);
            const heightMult = Math.max(0.3, 1 - distFromCenter / (HALF * 0.8));
            const bh = (8 + Math.random() * 40) * heightMult;
            const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
            addMergeBox(bcx, bh / 2 + 0.6, bcz, bw, bh, bd, color);

            if (bh > 20 && Math.random() < 0.5) {
              addMergeBox(bcx, bh + 0.6 + 1, bcz, bw * 0.4, 2 + Math.random() * 4, bd * 0.4, 0x4a5a6a);
            }
            if (Math.random() < 0.3 && bh > 12) {
              const dir = sx > subdivs / 2 ? 1 : -1;
              addMergeBox(bcx + dir * (bw / 2 + 0.1), bh / 2 + 0.6, bcz, 0.3, bh * 0.8, bd * 0.8, C_GLASS);
            }
          }
        }
      }
    }

    // Street light poles (no point lights — just emissive lamp heads)
    for (let i = 0; i <= GRID; i++) {
      for (let j = 0; j <= GRID; j++) {
        const lx = -HALF + i * (BLOCK + ROAD) + ROAD / 2;
        const lz = -HALF + j * (BLOCK + ROAD) + ROAD / 2;
        addMergeBox(lx + 5, 3, lz + 5, 0.2, 6, 0.2, 0x444444);
        addMergeBox(lx + 5, 6.2, lz + 5, 0.6, 0.3, 0.6, 0xffcc66);
      }
    }

    // Boundary walls
    addMergeBox(0, 1, -HALF - 1, TOTAL, 2, 2, C_ROAD);
    addMergeBox(0, 1, HALF + 1, TOTAL, 2, 2, C_ROAD);
    addMergeBox(-HALF - 1, 1, 0, 2, 2, TOTAL, C_ROAD);
    addMergeBox(HALF + 1, 1, 0, 2, 2, TOTAL, C_ROAD);

    // Parked cars
    const carColors = [0xaa3333, 0x3333aa, 0x33aa33, 0xaaaa33, 0xaa33aa, 0x333333];
    for (let i = 0; i < 12; i++) {
      const onH = Math.random() < 0.5;
      const ri = Math.floor(Math.random() * (GRID + 1));
      const rp = -HALF + ri * (BLOCK + ROAD) + ROAD / 2;
      const al = -HALF + 10 + Math.random() * (TOTAL - 20);
      const off = Math.random() < 0.5 ? 3 : -3;
      addMergeBox(onH ? al : rp + off, 0.8, onH ? rp + off : al, onH ? 4 : 2, 1.2, onH ? 2 : 4, carColors[i % carColors.length]);
    }

    // Dumpsters
    for (let i = 0; i < 8; i++) {
      const bx = Math.floor(Math.random() * GRID);
      const bz = Math.floor(Math.random() * GRID);
      const cx = -HALF + ROAD + bx * (BLOCK + ROAD) + BLOCK / 2 + (Math.random() - 0.5) * 20;
      const cz = -HALF + ROAD + bz * (BLOCK + ROAD) + BLOCK / 2 + (Math.random() - 0.5) * 20;
      addMergeBox(cx, 0.8, cz, 3, 1.6, 1.5, 0x2a5a3a);
    }

    // Merge everything into one geometry with vertex colors
    const merged = BufferGeometryUtils.mergeGeometries(mergeGeos, false);
    // Combine color arrays
    const allColors = new Float32Array(merged.attributes.position.count * 3);
    let offset = 0;
    for (const c of mergeColors) { allColors.set(c, offset); offset += c.length; }
    merged.setAttribute('color', new T.Float32BufferAttribute(allColors, 3));
    merged.computeVertexNormals();

    const mergeMat = new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0.05 });
    const mergeMesh = new T.Mesh(merged, mergeMat);
    mergeMesh.receiveShadow = true;
    mergeMesh.castShadow = true;
    g.scene.add(mergeMesh);

    // Boundary walls (use addBox for simplicity — they're also colliders)
    addBox(0, 1, -HALF - 1, TOTAL, 2, 2, C_ROAD);
    addBox(0, 1, HALF + 1, TOTAL, 2, 2, C_ROAD);
    addBox(-HALF - 1, 1, 0, 2, 2, TOTAL, C_ROAD);
    addBox(HALF + 1, 1, 0, 2, 2, TOTAL, C_ROAD);

    // Emissive lamp heads — a few glow sprites for atmosphere (cheap)
    const glowMat = new T.MeshBasicMaterial({ color: 0xffcc66, transparent: true, opacity: 0.8 });
    for (let i = 0; i <= GRID; i += 2) {
      for (let j = 0; j <= GRID; j += 2) {
        const lx = -HALF + i * (BLOCK + ROAD) + ROAD / 2 + 5;
        const lz = -HALF + j * (BLOCK + ROAD) + ROAD / 2 + 5;
        const glow = new T.Mesh(new T.SphereGeometry(0.4, 6, 4), glowMat);
        glow.position.set(lx, 6.2, lz);
        g.scene.add(glow);
      }
    }

    g.playerSpawn = new T.Vector3(0, 1.7, 0);
    g.playerSpawnYaw = 0;
  }

  function buildBhopCourse(g, addBox) {
    const T = THREE;
    // Colors
    const C_PLATFORM = 0x4a7a9a;
    const C_RAMP = 0x6a9a7a;
    const C_OBSTACLE = 0x9a6a4a;
    const C_WALL = 0x5a5a5e;
    const C_GOAL = 0x6ada6a;
    const C_START = 0x6a8aaa;

    // Start platform
    addBox(0, 0.5, 0, 12, 1, 12, C_START);

    // Stage 1: straight bhop platforms (decreasing size, increasing gap)
    const plats1 = [
      { x: 0, z: -10, w: 5, h: 1, d: 5, y: 0.5 },
      { x: 0, z: -16, w: 4, h: 1, d: 4, y: 1.0 },
      { x: 0, z: -22, w: 3.5, h: 1, d: 3.5, y: 1.5 },
      { x: 0, z: -28, w: 3, h: 1, d: 3, y: 2.0 },
      { x: 0, z: -34, w: 2.5, h: 1, d: 2.5, y: 2.5 },
      { x: 0, z: -40, w: 2.5, h: 1, d: 2.5, y: 3.0 },

    // Stage 2: ramp up
    const ramp = new T.Mesh(new T.BoxGeometry(4, 0.5, 8), new T.MeshStandardMaterial({ color: C_RAMP, roughness: 0.8 }));

    g.colliders.push({
      min: { x: -2, y: 3.0, z: -52 },
      max: { x: 2, y: 5.5, z: -44 }
    });
    const rampBody = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Box(new CANNON.Vec3(2, 0.25, 4)) });
    rampBody.position.set(0, 4.25, -48);
    rampBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), 0.25);
    g.world.addBody(rampBody);

    // Stage 3: zigzag platforms
    const zigs = [
      { x: 5, z: -56, y: 5.5, w: 3, d: 3 },
      { x: -5, z: -62, y: 5.5, w: 3, d: 3 },
      { x: 5, z: -68, y: 5.5, w: 3, d: 3 },
      { x: -5, z: -74, y: 5.5, w: 3, d: 3 },
    ];
    for (const p of zigs) addBox(p.x, p.y, p.z, p.w, 1, p.d, C_PLATFORM);

    // Stage 4: narrow beam
    addBox(0, 5.5, -82, 1.5, 1, 6, C_OBSTACLE);

    // Stage 5: ascending steps
    for (let i = 0; i < 6; i++) {
      addBox(0, 5.5 + i * 0.8, -88 - i * 4, 4, 1, 3, C_PLATFORM);
    }

    // Stage 6: gap jump with pillars
    const pillars = [
      { x: 0, z: -100, y: 10.3 },
      { x: 0, z: -106, y: 10.3 },
      { x: 0, z: -112, y: 10.3 },
    ];
    for (const p of pillars) addBox(p.x, p.y, p.z, 2, 1, 2, C_OBSTACLE);

    // Stage 7: wall obstacles (dodge left/right)
    addBox(0, 11.5, -120, 8, 2, 1, C_WALL);
    addBox(-3, 11.5, -120, 2, 2, 1, C_WALL); // gap on right
    addBox(0, 11.5, -126, 8, 2, 1, C_WALL);
    addBox(3, 11.5, -126, 2, 2, 1, C_WALL); // gap on left
    addBox(0, 11.5, -132, 8, 2, 1, C_WALL);
    addBox(-3, 11.5, -132, 2, 2, 1, C_WALL); // gap on right

    // Stage 8: final ramp down to goal
    const ramp2 = new T.Mesh(new T.BoxGeometry(4, 0.5, 8), new T.MeshStandardMaterial({ color: C_RAMP, roughness: 0.8 }));
    ramp2.position.set(0, 10.75, -140);
    ramp2.rotation.x = 0.25;
    ramp2.castShadow = true; ramp2.receiveShadow = true;
    g.scene.add(ramp2);
    g.colliders.push({
      min: { x: -2, y: 9.5, z: -144 },
      max: { x: 2, y: 12.0, z: -136 }
    });
    const ramp2Body = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Box(new CANNON.Vec3(2, 0.25, 4)) });
    ramp2Body.position.set(0, 10.75, -140);
    ramp2Body.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -0.25);
    g.world.addBody(ramp2Body);

    const beacon = new T.Mesh(new T.CylinderGeometry(0.3, 0.3, 8, 16), beaconMat);
    beacon.position.set(0, 13, -150);
    g.scene.add(beacon);
    const beaconLight = new T.PointLight(0x6ada6a, 3, 20);
    beaconLight.position.set(0, 13, -150);
    g.scene.add(beaconLight);

    // Side walls (visual boundaries)

    addBox(15, 5, -75, 1, 10, 160, C_WALL);

    // Set player spawn at start
