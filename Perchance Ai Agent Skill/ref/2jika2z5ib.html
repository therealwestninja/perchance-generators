  function buildCustomViewmodel(w) {
    if (!w) return null;
    const T = THREE;
    const g = new T.Group();
    const spec = w.viewmodel || {};
    const parts = [];

    const matBody = new T.MeshStandardMaterial({ color: spec.bodyColor || 0x2a2a2e, roughness: 0.4, metalness: 0.7 });
    const matAccent = new T.MeshStandardMaterial({ color: spec.accentColor || 0x4a4a52, roughness: 0.5, metalness: 0.6 });
    const matDark = new T.MeshStandardMaterial({ color: 0x141418, roughness: 0.7, metalness: 0.3 });
    const matGrip = new T.MeshStandardMaterial({ color: 0x1e1e22, roughness: 0.8, metalness: 0.1 });
    const matGlow = spec.glowColor != null
      ? new T.MeshStandardMaterial({ color: spec.glowColor, emissive: spec.glowColor, emissiveIntensity: 2.0, roughness: 0.2, metalness: 0.1 })
      : null;

    function addPart(geo, mat, pos, rot) {
      const m = new T.Mesh(geo, mat);
      if (pos) m.position.set(pos[0], pos[1], pos[2]);
      if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
      g.add(m);
      return m;
    }

    if (spec.parts && Array.isArray(spec.parts)) {
      for (const p of spec.parts) {
        let geo;
        const s = p.size || [0.05, 0.05, 0.2];
        if (p.shape === "cylinder" || p.shape === "cyl") {
          geo = new T.CylinderGeometry(Math.max(0.001, s[0]), Math.max(0.001, s[0]), Math.max(0.001, s[1]), 12);
        } else if (p.shape === "sphere" || p.shape === "ball") {
          geo = new T.SphereGeometry(Math.max(0.001, s[0]), 12, 8);
        } else if (p.shape === "torus") {
          geo = new T.TorusGeometry(Math.max(0.001, s[0]), Math.max(0.001, s[1]||0.005), 8, 16);
        } else {
          geo = new T.BoxGeometry(Math.max(0.001, s[0]), Math.max(0.001, s[1]), Math.max(0.001, s[2]));
        }
        const mat = p.glow && matGlow ? matGlow : (p.material === "accent" ? matAccent : p.material === "dark" ? matDark : p.material === "grip" ? matGrip : matBody);
        const m = addPart(geo, mat, p.pos, p.rot);
        if (p.name) parts.push({ name: p.name, mesh: m });
      }
    } else {
      const wt = w.type;
      if (wt === "hitscan" || wt === "shotgun") {
        const bodyLen = wt === "shotgun" ? 0.35 : 0.28;
        const bodyW = wt === "shotgun" ? 0.06 : 0.045;
        addPart(new T.BoxGeometry(bodyW, bodyW * 0.7, bodyLen), matBody, [0, 0, -bodyLen/2 - 0.05]);
        addPart(new T.CylinderGeometry(bodyW*0.4, bodyW*0.4, bodyLen*0.8, 10), matDark, [0, bodyW*0.2, -bodyLen/2 - 0.05], [Math.PI/2, 0, 0]);
        const gripH = 0.1;
        addPart(new T.BoxGeometry(bodyW*0.8, gripH, bodyW*0.6), matGrip, [0, -gripH/2 - bodyW*0.3, 0.02], [0.3, 0, 0]);
        addPart(new T.BoxGeometry(bodyW*0.3, bodyW*0.3, bodyW*0.3), matDark, [0, -bodyW*0.2, 0.06]);
        addPart(new T.CylinderGeometry(bodyW*0.35, bodyW*0.45, 0.04, 10), matAccent, [0, 0, -bodyLen - 0.07], [Math.PI/2, 0, 0]);
        if (matGlow) {
          const glow = addPart(new T.SphereGeometry(0.008, 8, 6), matGlow, [0, 0.02, -bodyLen - 0.09]);
          parts.push({ name: "glow", mesh: glow });
        }
        if (wt === "shotgun") {
          addPart(new T.CylinderGeometry(0.02, 0.02, 0.15, 8), matDark, [0, bodyW*0.15, -bodyLen - 0.1], [Math.PI/2, 0, 0]);
          addPart(new T.BoxGeometry(bodyW*0.9, 0.06, 0.15), matGrip, [0, -0.02, -0.12]);
        }
      } else if (wt === "melee") {
        addPart(new T.BoxGeometry(0.025, 0.025, 0.4), matBody, [0, 0, -0.2]);
        addPart(new T.BoxGeometry(0.06, 0.025, 0.15), matAccent, [0, 0, -0.42]);
        addPart(new T.CylinderGeometry(0.015, 0.015, 0.12, 8), matGrip, [0, 0, 0.06], [Math.PI/2, 0, 0]);
      } else if (wt === "projectile" || wt === "thrown") {
        addPart(new T.CylinderGeometry(0.03, 0.04, 0.25, 12), matBody, [0, 0, -0.12], [Math.PI/2, 0, 0]);
        addPart(new T.CylinderGeometry(0.025, 0.035, 0.06, 10), matAccent, [0, 0, 0.02], [Math.PI/2, 0, 0]);
        addPart(new T.BoxGeometry(0.04, 0.08, 0.04), matGrip, [0, -0.05, 0.02], [0.3, 0, 0]);
        if (matGlow) {
          const glow = addPart(new T.SphereGeometry(0.01, 8, 6), matGlow, [0, 0, -0.26]);
          parts.push({ name: "glow", mesh: glow });
        }
      } else {
        addPart(new T.BoxGeometry(0.05, 0.05, 0.2), matBody, [0, 0, -0.1]);
        addPart(new T.BoxGeometry(0.04, 0.1, 0.04), matGrip, [0, -0.06, 0.02], [0.3, 0, 0]);
        if (matGlow) {
          const glow = addPart(new T.SphereGeometry(0.01, 8, 6), matGlow, [0, 0, -0.22]);
          parts.push({ name: "glow", mesh: glow });
        }
      }
    }

    g.position.set(spec.pos ? spec.pos[0] : 0.1, spec.pos ? spec.pos[1] : -0.12, spec.pos ? spec.pos[2] : -0.25);
    g.rotation.set(spec.rot ? spec.rot[0] : 0, spec.rot ? spec.rot[1] : -0.05, spec.rot ? spec.rot[2] : 0);
    g.userData.basePos = g.position.clone();
    g.userData.baseRot = g.rotation.clone();
    g.userData.parts = {};
    for (const p of parts) g.userData.parts[p.name] = p.mesh;
    g.userData.muzzle = new T.Vector3(0, 0, -0.3);
    viewScene.add(g);
    return g;
  }

  function buildViewScene() {
    const T = THREE;
    viewScene = new T.Scene();
    viewCamera = new T.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 10);
    const key = new T.DirectionalLight(0xfff0e0, 1.8);
    key.position.set(0.5, 1, 1);
    viewScene.add(key);
    const fill = new T.DirectionalLight(0x88aaff, 0.6);
    fill.position.set(-1, 0.3, 0.5);
    viewScene.add(fill);
    const rim = new T.DirectionalLight(0xffaa66, 0.4);
    rim.position.set(0, 0.5, -1);
    viewScene.add(rim);
    viewScene.add(new T.AmbientLight(0x556677, 0.5));
    viewModels.physgun = buildGravityGun();
    viewModels.realphysgun = buildPhysgun();
    viewModels.crowbar = buildCrowbar();
    viewModels.pistol = buildPistol();
    viewModels["357"] = build357();
    viewModels.smg1 = buildSMG1();
    viewModels.ar2 = buildAR2();
    viewModels.shotgun = buildShotgun();
    viewModels.crossbow = buildCrossbow();
    viewModels.rpg = buildRPG();
    viewModels.grenade = buildGrenade();
    viewModels.toolgun = buildToolGun();
    // Build procedural viewmodels for custom weapons (no MDL)
    for (const w of WEAPONS) {
      if (!viewModels[w.id] && !customViewmodels[w.id]) {
        const vm = buildCustomViewmodel(w);
        if (vm) viewModels[w.id] = vm;
      }
    }
    muzzleFlash = new T.Mesh(
      new T.SphereGeometry(0.08, 8, 6),
      new T.MeshBasicMaterial({ color: 0xffdd66, transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false })
    );
    muzzleFlash.visible = false;
    viewScene.add(muzzleFlash);
    showViewModel(WEAPONS[currentWeapon].id);
  }

  function showViewModel(id) {
    for (const wid in viewModels) viewModels[wid].visible = false;
    for (const wid in customViewmodels) customViewmodels[wid].wrapper.visible = false;
    if (customViewmodels[id]) {
      customViewmodels[id].wrapper.visible = true;
    } else if (viewModels[id]) {
      viewModels[id].visible = true;
    }
    weaponSwitchTime = performance.now();
    outlineCache = {};
  }

  function metalMat(color, rough, metal) { return new THREE.MeshStandardMaterial({ color, roughness: rough||0.4, metalness: metal||0.7 }); }
  function plasticMat(color, rough) { return new THREE.MeshStandardMaterial({ color, roughness: rough||0.6, metalness: 0.1 }); }
  function darkMat() { return metalMat(0x1a1a1e, 0.5, 0.6); }

  function buildGravityGun(palette) {
    const pal = palette || {
      body: 0xd97a2e, bodyDark: 0xa85a1e, darkMetal: 0x2a2a2e, steel: 0x88888c,
      black: 0x141418, grip: 0x1e1e22, vent: 0x1a1a1e,
      coilColor: 0x66ddff, coilEmissive: 0x3399ff, glowColor: 0x66bbff,
      coilEmissiveIntensity: 1.5, glowEmissiveIntensity: 2.5,
    };
    const g = new THREE.Group();

    // ---- Materials ----
    const copperMat = plasticMat(pal.body, 0.45);
    const darkCopperMat = plasticMat(pal.bodyDark, 0.5);
    const darkMetalMat = metalMat(pal.darkMetal, 0.35, 0.85);
    const steelMat = metalMat(pal.steel, 0.25, 0.9);
    const blackMat = plasticMat(pal.black, 0.7);
    const gripMat = plasticMat(pal.grip, 0.8);
    const coilMat = new THREE.MeshStandardMaterial({ color: pal.coilColor, emissive: pal.coilEmissive, emissiveIntensity: pal.coilEmissiveIntensity, roughness: 0.2, metalness: 0.3 });
    const glowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: pal.glowColor, emissiveIntensity: pal.glowEmissiveIntensity, roughness: 0.1, metalness: 0 });
    const ventMat = metalMat(pal.vent, 0.6, 0.5);

    // ---- Back housing (cylindrical section behind body) ----
    const backHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.1, 16), darkMetalMat);
    backHousing.rotation.x = Math.PI/2;
    backHousing.position.set(0, -0.01, 0.02);
    g.add(backHousing);
    // Back cap
    const backCap = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.035, 0.02, 16), blackMat);
    backCap.rotation.x = Math.PI/2;
    backCap.position.set(0, -0.01, 0.07);
    g.add(backCap);
    // Back coil ring (glowing)
    const backCoil = new THREE.Mesh(new THREE.TorusGeometry(0.04, 0.006, 8, 24), coilMat);
    backCoil.position.set(0, -0.01, 0.0);
    g.add(backCoil);

    // ---- Main body (tapered cylinder, copper) ----
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.055, 0.2, 16), copperMat);
    body.rotation.x = Math.PI/2;
    body.position.set(0, -0.01, -0.08);
    g.add(body);
    // Body rib band
    const bodyRib = new THREE.Mesh(new THREE.CylinderGeometry(0.056, 0.056, 0.02, 16), darkCopperMat);
    bodyRib.rotation.x = Math.PI/2;
    bodyRib.position.set(0, -0.01, -0.04);
    g.add(bodyRib);
    // Body panel details (two side panels)
    for (const side of [-1, 1]) {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.03, 0.1), darkCopperMat);
      panel.position.set(side * 0.05, -0.01, -0.08);
      g.add(panel);
    }

    // ---- Vents on top of body ----
    for (let i = 0; i < 4; i++) {
      const vent = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.004, 0.008), ventMat);
      vent.position.set(0, 0.048, -0.02 - i * 0.015);
      g.add(vent);
    }

    // ---- Front emitter housing (flared cone) ----
    const emitterHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.045, 0.06, 16), darkMetalMat);
    emitterHousing.rotation.x = Math.PI/2;
    emitterHousing.position.set(0, -0.01, -0.21);
    g.add(emitterHousing);
    // Emitter ring (the distinctive dark ring)
    const emitterRing = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.008, 8, 20), blackMat);
    emitterRing.position.set(0, -0.01, -0.24);
    g.add(emitterRing);

    // ---- Inner coil (glowing cyan ring between prongs) ----
    const coil = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.01, 12, 24), coilMat);
    coil.position.set(0, -0.01, -0.26);
    g.add(coil);
    // Inner glow disc
    const glowDisc = new THREE.Mesh(new THREE.CircleGeometry(0.03, 16),
      new THREE.MeshBasicMaterial({ color: 0x66bbff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }));
    glowDisc.position.set(0, -0.01, -0.265);
    g.add(glowDisc);

    // ---- Three prongs (the iconic claw) ----
    // Each prong: extends forward, then curves inward at the tip
    const prongs = [];
    for (let i = 0; i < 3; i++) {
      const ang = (i / 3) * Math.PI * 2 + Math.PI / 6; // offset so one prong is on top
      const px = Math.cos(ang) * 0.05;
      const py = Math.sin(ang) * 0.05 + -0.01;
      const prongGroup = new THREE.Group();

      // Main prong shaft — tapered cylinder pointing forward
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.01, 0.1, 8), steelMat);
      shaft.rotation.x = Math.PI/2;
      shaft.position.set(0, 0, -0.05);
      prongGroup.add(shaft);

      // Curved tip (bends inward toward center)
      const tipSeg = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.007, 0.04, 8), steelMat);
      tipSeg.position.set(0, 0.005, -0.11);
      tipSeg.rotation.x = Math.PI/2 - 0.5; // curve inward
      prongGroup.add(tipSeg);

      // Prong tip cap (small rounded)
      const tipCap = new THREE.Mesh(new THREE.SphereGeometry(0.006, 8, 6), darkMetalMat);
      tipCap.position.set(0, 0.012, -0.13);
      prongGroup.add(tipCap);

      // Base mount (connects prong to emitter housing)
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.014, 0.02), darkMetalMat);
      base.position.set(0, 0, 0.01);
      prongGroup.add(base);

      prongGroup.position.set(px, py, -0.24);
      prongGroup.userData.baseAng = ang;
      prongGroup.userData.basePos = prongGroup.position.clone();
      g.add(prongGroup);
      prongs.push(prongGroup);
    }

    // ---- Handle (pistol grip, angled down and back) ----
    const handle = new THREE.Group();
    const handleMain = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.14, 0.045), gripMat);
    handleMain.position.set(0, -0.07, 0);
    handle.add(handleMain);
    // Grip texture (horizontal ridges)
    for (let i = 0; i < 5; i++) {
      const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.042, 0.003, 0.047), blackMat);
      ridge.position.set(0, -0.02 - i * 0.02, 0);
      handle.add(ridge);
    }
    // Trigger
    const trigger = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.02, 0.012), darkMetalMat);
    trigger.position.set(0, -0.03, 0.02);
    handle.add(trigger);
    handle.position.set(0, -0.04, 0.0);
    handle.rotation.x = 0.35;
    g.add(handle);

    // ---- Trigger guard ----
    const guard = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.005, 6, 12, Math.PI), darkMetalMat);
    guard.position.set(0, -0.05, 0.01);
    guard.rotation.x = Math.PI;
    g.add(guard);

    // ---- Central glowing tip (at focal point between prongs) ----
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.015, 12, 8), glowMat);
    tip.position.set(0, -0.01, -0.26);
    g.add(tip);

    // ---- Side detail cylinders (small pipes on the body sides) ----
    for (const side of [-1, 1]) {
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.12, 8), steelMat);
      pipe.rotation.x = Math.PI/2;
      pipe.position.set(side * 0.048, -0.025, -0.08);
      g.add(pipe);
      // Pipe end caps
      for (const z of [-0.13, -0.03]) {
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.008, 8), darkMetalMat);
        cap.rotation.x = Math.PI/2;
        cap.position.set(side * 0.048, -0.025, z);
        g.add(cap);
      }
    }

    // ---- Positioning ----
    g.position.set(0.16, -0.14, -0.3);
    g.rotation.y = -0.08;
    g.rotation.x = 0.02;
    g.userData.basePos = g.position.clone();
    g.userData.baseRot = g.rotation.clone();
    g.userData.parts = { coil, tip, body, prongs, backCoil, glowDisc, emitterRing };
    viewScene.add(g);
    return g;
  }

  function buildPhysgun() {
    const pal = {
      body: 0x1a1a2e, bodyDark: 0x0d0d18, darkMetal: 0x222228, steel: 0x4a4a52,
      black: 0x0a0a0e, grip: 0x12121a, vent: 0x1a1a1e,
      coilColor: 0x66ffff, coilEmissive: 0x00ddff, glowColor: 0x66ffff,
      coilEmissiveIntensity: 2.5, glowEmissiveIntensity: 4.0,

    return buildGravityGun(pal);

  function buildCrowbar() {
    const g = new THREE.Group();
    const redMat = metalMat(0xb8302a, 0.35, 0.6);
    const darkRedMat = metalMat(0x8a2018, 0.45, 0.5);
    const steelMat = metalMat(0x888888, 0.25, 0.9);
    const rustMat = new THREE.MeshStandardMaterial({ color: 0x6a2818, roughness: 0.7, metalness: 0.4 });

    // Shaft — hexagonal cross section, tapering slightly
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.016, 0.55, 6), redMat);
    shaft.rotation.x = Math.PI/2;
    shaft.position.set(0, 0, -0.25);
    g.add(shaft);

    // Paint wear bands (darker red)
    for (let i = 0; i < 3; i++) {
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.0165, 0.0165, 0.015, 6), darkRedMat);
      band.rotation.x = Math.PI/2;
      band.position.set(0, 0, -0.15 - i*0.12);
      g.add(band);
    }

    // Grip area — wrapped with dark tape near the middle/bottom
    for (let i = 0; i < 8; i++) {
      const tape = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.008, 8), darkMat());
      tape.rotation.x = Math.PI/2;
      tape.position.set(0, 0, 0.0 - i*0.012);
      g.add(tape);
    }

    // Flattened chisel pry end (the end you hold/hammer with)
    const flatEnd = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.008, 0.04), steelMat);
    flatEnd.position.set(0, 0, 0.05);
    flatEnd.rotation.x = 0.1;
    g.add(flatEnd);
    // Beveled tip
    const bevel = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.004, 0.015), steelMat);
    bevel.position.set(0, -0.003, 0.075);
    bevel.rotation.x = 0.3;
    g.add(bevel);

    // Curved claw hook end — built from segments to form a proper crowbar claw
    const clawGroup = new THREE.Group();
    // The claw curves up and back
    const segments = 6;
    for (let i = 0; i < segments; i++) {
      const t = i / (segments - 1);
      const angle = t * Math.PI * 0.55; // curve from 0 to ~100 degrees
      const r = 0.05;
      const x = 0;
      const y = Math.sin(angle) * r;
      const z = -0.55 - Math.cos(angle) * r + r * 0.3;
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.025, 6), i > 3 ? steelMat : redMat);
      seg.position.set(x, y, z);
      seg.rotation.x = Math.PI/2 - angle;
      clawGroup.add(seg);
    }
    // Split fork tips (two prongs at the end of the claw)
    const tipAngle = Math.PI * 0.55;
    const r = 0.05;
    const tipZ = -0.55 - Math.cos(tipAngle) * r + r * 0.3;
    const tipY = Math.sin(tipAngle) * r;
    for (const side of [-1, 1]) {
      const prong = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.022, 0.008), steelMat);
      prong.position.set(side * 0.008, tipY + 0.01, tipZ);
      prong.rotation.x = -0.2;
      clawGroup.add(prong);
      // Flat nail-puller notch
      const notch = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.008, 0.006), darkMat());
      notch.position.set(side * 0.008, tipY + 0.018, tipZ);
      clawGroup.add(notch);
    }
    g.add(clawGroup);

    // Rust spots (small dark patches)
    for (let i = 0; i < 4; i++) {
      const rust = new THREE.Mesh(new THREE.SphereGeometry(0.006, 6, 4), rustMat);
      rust.position.set(
        (Math.random()-0.5) * 0.02,
        0.014,
        -0.1 - i * 0.1
      );
      rust.scale.set(1.5, 0.3, 1);
      g.add(rust);
    }

    g.position.set(0.18, -0.13, -0.12);
    g.rotation.set(-0.15, -0.35, 0.15);
    g.userData.basePos = g.position.clone();
    g.userData.baseRot = g.rotation.clone();
    g.userData.parts = { shaft: shaft, clawGroup: clawGroup };
    viewScene.add(g);
    return g;
  }

  function buildSMG1() {
    const g = new THREE.Group();
    const mat = metalMat(0x222226, 0.4, 0.6);
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.06, 0.28), mat);

  function switchWeapon(idx) {
    if (idx < 0 || idx >= WEAPONS.length) return;
    if (idx === currentWeapon) return;
    // Leaving camera: restore FOV/roll and un-hide HUD
    if (WEAPONS[currentWeapon].type === "camera") {
      if (game && game.camera) {
        game.camera.fov = 80;
        game.camera.roll = 0;
        game.camera.updateProjectionMatrix();
      }
      const hud = document.querySelector(".hl2-hud");
      if (hud) hud.style.display = "";
    }
    currentWeapon = idx;
    showViewModel(WEAPONS[idx].id);
    if (game) game.toolIndex = idx;
    if (typeof mpSendWeaponSwitch === "function") mpSendWeaponSwitch();
    lastFireTime = 0;
    animState.fire = 0; animState.reload = 0; animState.swinging = false;
    // Entering camera: hide HUD
    if (WEAPONS[idx].type === "camera") {
      const hud = document.querySelector(".hl2-hud");
      if (hud) hud.style.display = "none";
    }
    flashWeaponName();
    updateWeaponBar();
  }

  // HL2-style weapon cycling: highlights a pending weapon in the bar without selecting.
  // LMB confirms (plays wpn_select), RMB cancels (plays wpn_deny).
  function cycleWeapon(idx) {
    if (idx < 0 || idx >= WEAPONS.length) return;
    if (idx === pendingWeapon) return;
    pendingWeapon = idx;
    pendingWeaponTime = performance.now();
    playSound("weapon_switch");
    flashWeaponName(WEAPONS[idx].name);
    updateWeaponBar();
  }

  function confirmWeapon() {
    if (pendingWeapon >= 0 && pendingWeapon !== currentWeapon) {
      switchWeapon(pendingWeapon);
      playSound("weapon_select");
    } else if (pendingWeapon >= 0) {
      playSound("weapon_select");
    }
    pendingWeapon = -1;
    updateWeaponBar();
  }

  function cancelWeapon() {
    if (pendingWeapon >= 0) {
      playSound("weapon_deny");
      pendingWeapon = -1;
      updateWeaponBar();
    }
  }

  function silentDenyWeapon() {
    if (pendingWeapon >= 0) {
      pendingWeapon = -1;
      updateWeaponBar();
    }
  }

  function renderWeaponOutline(weaponId) {
    if (outlineCache[weaponId]) return outlineCache[weaponId];
    if (!viewModels[weaponId]) return null;
    const T = THREE;
    if (!outlineRenderer) {
      outlineRenderer = new T.WebGLRenderer({ alpha: true, antialias: true });
      outlineRenderer.setSize(140, 80);
      outlineScene = new T.Scene();
      outlineCamera = new T.PerspectiveCamera(45, 140 / 80, 0.01, 10);
    }
    while (outlineScene.children.length > 0) {
      const c = outlineScene.children[0];
      outlineScene.remove(c);
    }
    const orig = viewModels[weaponId];
    const clone = orig.clone(true);
    const orangeMat = new T.MeshBasicMaterial({ color: 0xff8800, wireframe: true, transparent: true, opacity: 0.85 });
    clone.traverse(o => {
      if (o.isMesh) { o.material = orangeMat; }
    });
    clone.position.copy(orig.userData.basePos || orig.position);
    clone.rotation.copy(orig.userData.baseRot || orig.rotation);
    outlineScene.add(clone);
    const box = new T.Box3().setFromObject(clone);
    const center = box.getCenter(new T.Vector3());
    const size = box.getSize(new T.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim / (2 * Math.tan(Math.PI / 8)) + 0.1;
    outlineCamera.position.set(center.x + dist * 0.8, center.y + size.y * 0.1, center.z + dist * 0.6);
    outlineCamera.lookAt(center);
    outlineCamera.up.set(0, 1, 0);
    outlineRenderer.clear();
    outlineRenderer.render(outlineScene, outlineCamera);
    const url = outlineRenderer.domElement.toDataURL();
    outlineCache[weaponId] = url;
    return url;
  }

  // Pressing a number key (1-6) cycles through weapons in that category
  function switchWeaponCategory(catNum) {
    const catWeapons = WEAPONS.map((w, i) => ({ w, i })).filter(x => x.w.category === catNum);
    if (catWeapons.length === 0) return;
    // If pending weapon is in this category, go to next; otherwise start from current or first
    const baseIdx = pendingWeapon >= 0 ? pendingWeapon : currentWeapon;
    const currentInCat = catWeapons.findIndex(x => x.i === baseIdx);
    let nextIdx;
    if (currentInCat >= 0) {
      nextIdx = catWeapons[(currentInCat + 1) % catWeapons.length].i;
    } else {
      nextIdx = catWeapons[0].i;
    }
    cycleWeapon(nextIdx);
  }

  function flashWeaponName(nameOverride) {
    const wn = document.getElementById("hudWepName");
    if (wn) {
      let txt;
      if (nameOverride) {
        txt = nameOverride.toUpperCase();
      } else {
        txt = WEAPONS[currentWeapon].name.toUpperCase();
      }
      wn.textContent = txt;
      wn.classList.add("show");
      clearTimeout(wn._timer);
      wn._timer = setTimeout(() => wn.classList.remove("show"), 1500);
    }
    updateToolHUD();
  }

  function updateToolHUD() {
    const hud = document.querySelector(".hl2-hud");
    if (!hud) return;
    let panel = document.getElementById("hudToolInfo");
    if (WEAPONS[currentWeapon] && WEAPONS[currentWeapon].type === "toolgun") {
      const tool = TOOL_LIST[currentTool];
      if (!panel) {
        panel = document.createElement("div");
        panel.id = "hudToolInfo";
        panel.className = "hl2-toolinfo";
        hud.appendChild(panel);
      }
      let html = '<div class="hl2-toolinfo-name">' + (tool.icon ? tool.icon + " " : "") + tool.name + '</div>';
      if (tool.desc) html += '<div class="hl2-toolinfo-desc">' + tool.desc + '</div>';
      if (tool.hints && tool.hints.length > 0) {
        html += '<div class="hl2-toolinfo-hints">';
        for (const h of tool.hints) {
          html += '<div class="hl2-toolinfo-hint"><span class="hl2-toolinfo-key">' + h.keys + '</span>: ' + h.action + '</div>';
        }
        html += '</div>';
      }
      panel.innerHTML = html;
      panel.style.display = "";
    } else if (panel) {
      panel.style.display = "none";
    }
  }

  function updateWeaponBar() {
    const bar = document.getElementById("hudWeaponBar");
    if (!bar) return;
    const curCat = WEAPONS[currentWeapon].category;
    const pendingCat = pendingWeapon >= 0 ? WEAPONS[pendingWeapon].category : -1;
    const outlineUrl = pendingWeapon >= 0 ? renderWeaponOutline(WEAPONS[pendingWeapon].id) : null;
    bar.innerHTML = WEAPON_CATEGORIES.map(cat => {
      const catWeapons = WEAPONS.filter(w => w.category === cat.num);
      const isActive = pendingWeapon >= 0 ? cat.num === pendingCat : cat.num === curCat;
      const weaponsList = catWeapons.map(w => {
        const isCur = w.id === WEAPONS[currentWeapon].id;
        const isPending = pendingWeapon >= 0 && w.id === WEAPONS[pendingWeapon].id;
        let cls = "wbar-wep";
        if (isPending) cls += " pending";
        else if (isCur) cls += " cur";
        return '<span class="' + cls + '">' + w.name + '</span>';
      }).join("");
      const outlineHtml = (pendingWeapon >= 0 && cat.num === pendingCat && outlineUrl)
        ? '<img class="wbar-outline" src="' + outlineUrl + '">' : '';
      return '<div class="wbar-slot' + (isActive ? " active" : "") + '" data-cat="' + cat.num + '">' +
        '<div class="wbar-num">' + cat.num + '</div>' +
        '<div class="wbar-info">' + weaponsList + '</div>' +
        outlineHtml +
      '</div>';
    }).join("");
    bar.querySelectorAll("[data-cat]").forEach(el => {
      el.onclick = () => switchWeaponCategory(parseInt(el.dataset.cat));
    });
  }

  // ---- Animation state ----
  let animState = { fire: 0, reload: 0, reloadStart: 0, reloadDur: 1500, reloadPending: null, grab: 0, swingStart: 0, swinging: false };

  function tryFire(now) {
    const w = WEAPONS[currentWeapon];
    if (now - lastFireTime < w.fireRate * 1000) return;
    if (animState.reload > 0) return;
    if (w.type === "physgun" || w.type === "realphysgun" || w.type === "camera" || w.type === "toolgun") return;
    if (w.clip !== Infinity && w.clip <= 0) { tryReload(); if (w.ammo <= 0) playSound(w.id + "_empty"); return; }
    lastFireTime = now;
    if (w.clip !== Infinity) w.clip--;
    // Recoil: spring-back kick (camera offset decays back to zero)
    const recoilAmount = w.type === "shotgun" ? 0.08 : w.type === "projectile" ? 0.1 : w.type === "hitscan" ? (w.damage > 25 ? 0.06 : 0.03) : 0;
    if (recoilAmount > 0 && game) {
      recoilVelPitch += recoilAmount;
      recoilVelYaw += (Math.random() - 0.5) * recoilAmount * 0.5;
      recoilOffset = 1;
      recoilRot = recoilAmount * 8;
    }
    if (w.type === "melee") { fireMelee(w); animState.swingStart = now; animState.swinging = true; }
    else if (w.type === "hitscan") { fireHitscan(w, 1); playSound(w.id + "_fire", { pitch: 0.95 + Math.random() * 0.1 }); }
    else if (w.type === "shotgun") { fireHitscan(w, w.pellets || 6); playSound(w.id + "_fire"); }
    else if (w.type === "projectile") { fireProjectile(w); playSound(w.id + "_fire"); }
    else if (w.type === "thrown") throwGrenade(w);
    animState.fire = 1;
    if (w.type !== "melee") showMuzzleFlash();
  }

  // ---- Projectiles (crossbow bolts, RPG rockets) ----
  let projectiles = [];
  function fireProjectile(w) {
    const origin = game.player.pos.clone();
    const dir = getCameraForward(game);
    const T = THREE;
    const isRocket = w.explosive;
    const geo = isRocket
      ? new T.CylinderGeometry(0.02, 0.02, 0.15, 8)
      : new T.CylinderGeometry(0.005, 0.005, 0.25, 6);
    const mat = new T.MeshStandardMaterial({ color: w.projColor, emissive: w.projColor, emissiveIntensity: 0.5, roughness: 0.4, metalness: 0.6 });
    const mesh = new T.Mesh(geo, mat);
    mesh.position.copy(origin).add(dir.clone().multiplyScalar(0.5));
    if (isRocket) {
      mesh.rotation.x = Math.PI/2;
    }
    mesh.lookAt(mesh.position.clone().add(dir));
    if (isRocket) mesh.rotateX(Math.PI/2);
    game.scene.add(mesh);
    const proj = {
      mesh, dir: dir.clone(), speed: w.projSpeed, damage: w.damage,
      explosive: !!w.explosive, explosionRadius: w.explosionRadius || 5,
      life: 4, type: isRocket ? "rocket" : "bolt",
    };
    projectiles.push(proj);
    // Rocket trail
    if (isRocket) proj.trail = true;
  }

  function throwGrenade(w) {
    const origin = game.player.pos.clone();
    const dir = getCameraForward(game);
    const T = THREE;
    const C = CANNON;
    const geo = new T.SphereGeometry(0.06, 12, 8);
    const mat = new T.MeshStandardMaterial({ color: 0x4a5a3a, roughness: 0.6, metalness: 0.4 });
    const mesh = new T.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.position.copy(origin).add(dir.clone().multiplyScalar(0.5));
    game.scene.add(mesh);
    const body = new C.Body({ mass: 1, shape: new C.Sphere(0.06) });
    body.position.copy(mesh.position);
    body.velocity.set(dir.x * 15 + game.player.vel.x, dir.y * 15 + 5, dir.z * 15 + game.player.vel.z);
    body.linearDamping = 0.1;
    body.angularDamping = 0.1;
    game.world.addBody(body);
    const grenade = {
      mesh, body, type: "grenade", fuse: w.fuseTime || 2.5,
      damage: w.damage, explosionRadius: w.explosionRadius || 6,
      isProp: true, radius: 0.08,
    };
    game.props.push(grenade);
    projectiles.push({ mesh, body, type: "grenade", grenade, life: w.fuseTime + 1 });
  }

  function updateProjectiles(g, dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      if (p.type === "grenade") {
        // Sync mesh, count down fuse
        p.mesh.position.copy(p.body.position);
        p.mesh.quaternion.copy(p.body.quaternion);
        p.grenade.fuse -= dt;
        if (p.grenade.fuse <= 0) {
          explodeAt(g, new THREE.Vector3(p.body.position.x, p.body.position.y, p.body.position.z), p.grenade.damage, p.grenade.explosionRadius);
          // Remove grenade prop
          const idx = g.props.indexOf(p.grenade);
          if (idx >= 0) g.props.splice(idx, 1);
          g.scene.remove(p.mesh);
          g.world.removeBody(p.body);
          p.mesh.geometry.dispose();
          p.mesh.material.dispose();
          projectiles.splice(i, 1);
          continue;
        }
        p.life -= dt;
        if (p.life <= 0) projectiles.splice(i, 1);
        continue;
      }
      // Bolt / rocket
      const move = p.dir.clone().multiplyScalar(p.speed * dt);
      p.mesh.position.add(move);
      p.mesh.lookAt(p.mesh.position.clone().add(p.dir));
      if (p.type === "rocket") p.mesh.rotateX(Math.PI/2);
      // Rocket trail
      if (p.trail) {
        const smoke = new THREE.Mesh(
          new THREE.SphereGeometry(0.05 + Math.random() * 0.03, 6, 4),
          new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.5 })
        );
        smoke.position.copy(p.mesh.position).sub(p.dir.clone().multiplyScalar(0.1));
        g.scene.add(smoke);
        setTimeout(() => { g.scene.remove(smoke); smoke.geometry.dispose(); smoke.material.dispose(); }, 400);
      }
      p.life -= dt;
      // Check collision with props/NPCs/world
      let hit = false;
      // World AABBs
      for (const col of g.colliders) {
        if (p.mesh.position.x > col.min.x && p.mesh.position.x < col.max.x &&
            p.mesh.position.y > col.min.y && p.mesh.position.y < col.max.y &&
            p.mesh.position.z > col.min.z && p.mesh.position.z < col.max.z) {
          hit = true;
          // Spawn impact decal on world hit
          const hitPos = p.mesh.position.clone();
          const cx = (col.min.x + col.max.x) / 2, cy = (col.min.y + col.max.y) / 2, cz = (col.min.z + col.max.z) / 2;
          const normal = new THREE.Vector3(0, 0, 0);
          const dx = hitPos.x - cx, dy = hitPos.y - cy, dz = hitPos.z - cz;
          const sx = col.max.x - col.min.x, sy = col.max.y - col.min.y, sz = col.max.z - col.min.z;
          const rx = dx / sx, ry = dy / sy, rz = dz / sz;
          if (Math.abs(rx) > Math.abs(ry) && Math.abs(rx) > Math.abs(rz)) normal.set(Math.sign(rx), 0, 0);
          else if (Math.abs(ry) > Math.abs(rz)) normal.set(0, Math.sign(ry), 0);
          else normal.set(0, 0, Math.sign(rz));
          if (p.explosive) spawnDecal(g, hitPos, normal, "scorch");
          else { spawnDecal(g, hitPos, normal, "concrete"); spawnImpactParticles(g, hitPos, "concrete", 4); }
          break;
        }
      }
      // Props
      if (!hit) {
        for (const prop of g.props) {
          if (p.mesh.position.distanceTo(prop.mesh.position) < (prop.radius || 0.5)) {
            hit = true;
            if (prop.body) {
              prop.body.wakeUp();
              prop.body.velocity.x += p.dir.x * p.damage * 0.5;
              prop.body.velocity.y += p.damage * 0.3;
              prop.body.velocity.z += p.dir.z * p.damage * 0.5;
            }
            if (prop.breakable && !prop.broken) {
              spawnImpactParticles(g, prop.mesh.position.clone(), prop.breakable, 4);
              damageBreakable(g, prop, p.damage, prop.mesh.position.clone());
            }
            break;
          }
        }
      }
      // NPCs
      if (!hit) {
        for (const npc of g.npcs) {
          if (!npc.alive) continue;
          if (p.mesh.position.distanceTo(npc.mesh.position) < (npc.radius || 0.5)) {
            damageNPC(g, npc, p.damage, p.dir);
            hit = true; break;
          }
        }
      }
      // Remote MP players
      if (!hit && MP.roomId) {
        for (const pid in MP.players) {
          const rp = MP.players[pid];
          if (!rp.mesh) continue;
          const pp = rp.mesh.position.clone();
          pp.y -= 0.5; // approximate center
          if (p.mesh.position.distanceTo(pp) < 0.6) {
            if (MP.connected && MP.socket) {
              MP.socket.send(JSON.stringify({ t: MP_TYPE_DAMAGE, targetPid: parseInt(pid), dmg: p.damage }));
            }
            spawnImpactParticles(g, p.mesh.position.clone(), "wood", 5);
            spawnBlood(g, p.mesh.position.clone(), p.dir);
            hit = true; break;
          }
        }
      }
      if (hit || p.life <= 0) {
        if (p.explosive) {
          explodeAt(g, p.mesh.position.clone(), p.damage, p.explosionRadius);
        }
        g.scene.remove(p.mesh);
        p.mesh.geometry.dispose();
        p.mesh.material.dispose();
        projectiles.splice(i, 1);
      }
    }
  }

  function explodeAt(g, pos, damage, radius) {
    playSound("explode");
    // Scorch decal — find surface below explosion
    for (const col of g.colliders) {
      if (pos.x > col.min.x - 1 && pos.x < col.max.x + 1 && pos.z > col.min.z - 1 && pos.z < col.max.z + 1) {
        if (pos.y >= col.min.y && pos.y <= col.max.y + 2) {
          const normal = new THREE.Vector3(0, 1, 0);
          if (col.min.y < 1.5) { // floor
            spawnDecal(g, new THREE.Vector3(pos.x, col.max.y + 0.01, pos.z), normal, "scorch");
          }
          break;
        }
      }
    }
    // Also try straight down ray for scorch
    const downDir = new THREE.Vector3(0, -1, 0);
    for (const col of g.colliders) {
      const t = rayAABB(pos, downDir, col);
      if (t && t < 5) {
        const hitPos = pos.clone().add(downDir.clone().multiplyScalar(t));
        spawnDecal(g, hitPos, new THREE.Vector3(0, 1, 0), "scorch");
        break;
      }
    }
    // Damage NPCs
    for (const npc of g.npcs) {
      if (!npc.alive) continue;
      const d = npc.body.position.distanceTo(pos);
      if (d < radius) {
        const dir = npc.body.position.vsub(pos).unit();
        damageNPC(g, npc, damage * (1 - d / radius), new THREE.Vector3(dir.x, dir.y, dir.z));
      }
    }
    // Damage player
    const pd = g.player.pos.distanceTo(pos);
    if (pd < radius) {
      damagePlayer(g, Math.floor(damage * 0.5 * (1 - pd / radius)));
      const knock = g.player.pos.clone().sub(pos).normalize();
      g.player.vel.x += knock.x * 15 * (1 - pd / radius);
      g.player.vel.y += 8 * (1 - pd / radius);
      g.player.vel.z += knock.z * 15 * (1 - pd / radius);
    }
    // Damage remote MP players
    if (MP.roomId) {
      for (const pid in MP.players) {
        const rp = MP.players[pid];
        if (!rp.mesh) continue;
        const d = rp.mesh.position.distanceTo(pos);
        if (d < radius && MP.connected && MP.socket) {
          MP.socket.send(JSON.stringify({ t: MP_TYPE_DAMAGE, targetPid: parseInt(pid), dmg: Math.floor(damage * 0.5 * (1 - d / radius)) }));
        }
      }
    }
    // Push props
    for (const prop of g.props) {
      if (!prop.body) continue;
      const d = prop.body.position.distanceTo(pos);
      if (d < radius && d > 0.1) {
        const dir = prop.body.position.vsub(pos).unit();
        prop.body.wakeUp();
        prop.body.velocity.x += dir.x * 30 * (1 - d / radius);
        prop.body.velocity.y += dir.y * 30 * (1 - d / radius) + 5;
        prop.body.velocity.z += dir.z * 30 * (1 - d / radius);
        if (prop.entity === "explosive" && !prop.exploded) {
          prop.health = 0;
          setTimeout(() => explodeEntity(g, prop), 80);
        }
      }
    }
    // Visual explosion
    const fireball = new THREE.Mesh(
      new THREE.SphereGeometry(1, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.9 })
    );
    fireball.position.copy(pos);
    g.scene.add(fireball);
    const light = new THREE.PointLight(0xff6600, 8, 25);
    light.position.copy(pos);
    g.scene.add(light);
    let age = 0;
    const anim = () => {
      age += 0.04;
      const s = 1 + age * 5;
      fireball.scale.set(s, s, s);
      fireball.material.opacity = Math.max(0, 0.9 - age * 2);
      light.intensity = Math.max(0, 8 - age * 12);
      if (age < 0.5) requestAnimationFrame(anim);
      else {
        g.scene.remove(fireball); g.scene.remove(light);
        fireball.geometry.dispose(); fireball.material.dispose();
      }
    };
    anim();
  }

  function fireMelee(w) {
    const origin = game.player.pos.clone();
    const dir = getCameraForward(game);
    playSound("crowbar_swing", { pitch: 0.95 + Math.random() * 0.1 });
    let hitSomething = false;
    setTimeout(() => {
      for (const prop of game.props) {
        const toProp = prop.mesh.position.clone().sub(origin);
        const dist = toProp.length();
        if (dist < 3.5) {
          const dot = toProp.normalize().dot(dir);
          if (dot > 0.6) {
            const hitPos = origin.clone().add(dir.clone().multiplyScalar(dist - (prop.radius || 0.5)));
            prop.body.wakeUp();
            prop.body.velocity.x += dir.x * 18;
            prop.body.velocity.y += 10;
            prop.body.velocity.z += dir.z * 18;
            prop.body.angularVelocity.set((Math.random()-0.5)*12, (Math.random()-0.5)*12, (Math.random()-0.5)*12);
            if (prop.breakable && !prop.broken) {
              spawnImpactParticles(game, hitPos, prop.breakable, 5);
              damageBreakable(game, prop, 30, hitPos);
            } else {
              const matType = prop.shape === "barrel" ? "metal" : "wood";
              spawnImpactParticles(game, hitPos, matType, 4);
              spawnPropDecal(game, prop, hitPos, dir.clone().negate(), matType);
            }
            hitSomething = true;
          }
        }
      }
      for (const npc of game.npcs) {
        if (!npc.alive) continue;
        const toNpc = npc.mesh.position.clone().sub(origin);
        const dist = toNpc.length();
        if (dist < 3.5) {
          const dot = toNpc.normalize().dot(dir);
          if (dot > 0.5) {
            damageNPC(game, npc, 25, dir);
            hitSomething = true;
          }
        }
      }
      // Check remote MP NPCs
      if (MP.roomId && MP.remoteNpcs) {
        for (const npcId in MP.remoteNpcs) {
          const rn = MP.remoteNpcs[npcId];
          if (!rn.mesh || !rn.mesh.parent || !rn.alive) continue;
          const npcPos = rn.mesh.position.clone();
          npcPos.y += 0.9;
          const toNpc = npcPos.clone().sub(origin);
          const dist = toNpc.length();
          if (dist < 3.5) {
            const dot = toNpc.normalize().dot(dir);
            if (dot > 0.5) {
              spawnImpactParticles(game, npcPos, "wood", 5);
              spawnBlood(game, npcPos, dir);
              if (MP.connected && MP.socket) {
                MP.socket.send(JSON.stringify({ t: MP_TYPE_NPCKILL, npcId: parseInt(npcId), dmg: 25 }));
              }
              hitSomething = true;
            }
          }
        }
      }
      // Check remote MP players
      if (MP.roomId) {
        for (const pid in MP.players) {
          const rp = MP.players[pid];
          if (!rp.mesh) continue;
          const toPlayer = rp.mesh.position.clone().sub(origin);
          const dist = toPlayer.length();
          if (dist < 3.5) {
            const dot = toPlayer.normalize().dot(dir);
            if (dot > 0.5) {
              const hitPos = rp.mesh.position.clone();
              spawnImpactParticles(game, hitPos, "wood", 5);
              spawnBlood(game, hitPos, dir);
              if (MP.connected && MP.socket) {
                MP.socket.send(JSON.stringify({ t: MP_TYPE_DAMAGE, targetPid: parseInt(pid), dmg: 25 }));
              }
              hitSomething = true;
            }
          }
        }
      }
      if (hitSomething) {
        playSound("crowbar_hit", { pitch: 0.9 + Math.random() * 0.2 });
      } else {
        playSound("crowbar_miss", { pitch: 1.0 + Math.random() * 0.15 });
        // World hit check for crowbar clang
        let bestCol = null, bestColT = 100;
        for (const col of game.colliders) {
          const t = rayAABB(origin, dir, col);
          if (t && t > 0 && t < 3.5 && t < bestColT) { bestColT = t; bestCol = col; }
        }
        if (bestCol) {
          const hitPos = origin.clone().add(dir.clone().multiplyScalar(bestColT));
          const cx = (bestCol.min.x + bestCol.max.x) / 2, cy = (bestCol.min.y + bestCol.max.y) / 2, cz = (bestCol.min.z + bestCol.max.z) / 2;
          const normal = new THREE.Vector3(0, 0, 0);
          const dx = hitPos.x - cx, dy = hitPos.y - cy, dz = hitPos.z - cz;
          const sx = bestCol.max.x - bestCol.min.x, sy = bestCol.max.y - bestCol.min.y, sz = bestCol.max.z - bestCol.min.z;
          const rx = dx / sx, ry = dy / sy, rz = dz / sz;
          if (Math.abs(rx) > Math.abs(ry) && Math.abs(rx) > Math.abs(rz)) normal.set(Math.sign(rx), 0, 0);
          else if (Math.abs(ry) > Math.abs(rz)) normal.set(0, Math.sign(ry), 0);
          else normal.set(0, 0, Math.sign(rz));
          spawnImpactParticles(game, hitPos, "concrete", 3);
          spawnDecal(game, hitPos, normal, "concrete");
          playSound("crowbar_hit", { pitch: 1.1 + Math.random() * 0.2 });
        }
      }
    }, 180);
  }

  function fireHitscan(w, pellets) {
    const origin = game.player.pos.clone();
    const baseDir = getCameraForward(game);
    for (let p = 0; p < pellets; p++) {
      const dir = baseDir.clone();
      if (w.spread > 0) {
        dir.x += (Math.random()-0.5) * w.spread;
        dir.y += (Math.random()-0.5) * w.spread;
        dir.z += (Math.random()-0.5) * w.spread;
        dir.normalize();
      }
      let bestProp = null, bestT = 100;
      for (const prop of game.props) {
        let t = -1;
        if (prop.shape === "ball") {
          const oc = origin.clone().sub(prop.mesh.position);
          const b = oc.dot(dir);
          const c = oc.dot(oc) - prop.radius * prop.radius;
          const disc = b*b - c;
          if (disc < 0) continue;
          t = -b - Math.sqrt(disc);
          if (t <= 0) t = -b + Math.sqrt(disc);
        } else if (prop.halfExtents) {
          // Ray vs oriented box: transform ray into prop's local space
          const he = prop.halfExtents;
          const invQ = new THREE.Quaternion(prop.body.quaternion.x, prop.body.quaternion.y, prop.body.quaternion.z, prop.body.quaternion.w).invert();
          const localOrigin = origin.clone().sub(prop.mesh.position).applyQuaternion(invQ);
          const localDir = dir.clone().applyQuaternion(invQ);
          let tmin = -Infinity, tmax = Infinity;
          for (let ax = 0; ax < 3; ax++) {
            const o = ax === 0 ? localOrigin.x : ax === 1 ? localOrigin.y : localOrigin.z;
            const d = ax === 0 ? localDir.x : ax === 1 ? localDir.y : localDir.z;
            const h = ax === 0 ? he.x : ax === 1 ? he.y : he.z;
            if (Math.abs(d) < 1e-8) {
              if (Math.abs(o) > h) { tmin = Infinity; break; }
            } else {
              let t1 = (-h - o) / d, t2 = (h - o) / d;
              if (t1 > t2) [t1, t2] = [t2, t1];
              if (t1 > tmin) tmin = t1;
              if (t2 < tmax) tmax = t2;
              if (tmin > tmax) { tmin = Infinity; break; }
            }
          }
          if (tmin === Infinity || tmax < 0) continue;
          t = tmin > 0 ? tmin : tmax;
        } else { continue; }
        if (t > 0 && t < bestT) { bestT = t; bestProp = prop; }
      }
      // Also check NPCs
      let bestMpPid = -1;
      for (const npc of game.npcs) {
        const oc = origin.clone().sub(npc.mesh.position);
        const b = oc.dot(dir);
        const r = npc.radius;
        const c = oc.dot(oc) - r * r;
        const disc = b*b - c;
        if (disc < 0) continue;
        const t = -b - Math.sqrt(disc);
        if (t > 0 && t < bestT) { bestT = t; bestProp = npc; }
        else if (t <= 0) {
          const t2 = -b + Math.sqrt(disc);
          if (t2 < bestT) { bestT = t2; bestProp = npc; }
        }
      }
      // Also check remote MP NPCs
      let bestRemoteNpcId = -1;
      if (MP.roomId && MP.remoteNpcs) {
        for (const npcId in MP.remoteNpcs) {
          const rn = MP.remoteNpcs[npcId];
          if (!rn.mesh || !rn.mesh.parent) continue;
          const npcPos = rn.mesh.position.clone();
          npcPos.y += 0.9; // center mass
          const oc = origin.clone().sub(npcPos);
          const b = oc.dot(dir);
          const r = 0.5;
          const c = oc.dot(oc) - r * r;
          const disc = b*b - c;
          if (disc < 0) continue;
          const t = -b - Math.sqrt(disc);
          if (t > 0 && t < bestT) { bestT = t; bestRemoteNpcId = parseInt(npcId); bestProp = null; bestMpPid = -1; bestRemotePropId = -1; bestRemotePropRp = null; }
          else if (t <= 0) {
            const t2 = -b + Math.sqrt(disc);
            if (t2 < bestT) { bestT = t2; bestRemoteNpcId = parseInt(npcId); bestProp = null; bestMpPid = -1; bestRemotePropId = -1; bestRemotePropRp = null; }
          }
        }
      }
      // Also check remote MP props
      let bestRemotePropId = -1;
      let bestRemotePropRp = null;
      if (MP.roomId) {
        for (const propId in MP.remoteProps) {
          const rp = MP.remoteProps[propId];
          if (!rp.mesh || !rp.mesh.parent) continue;
          const oc = origin.clone().sub(rp.mesh.position);
          const b = oc.dot(dir);
          const r = rp.mesh.userData.radius || 0.8;
          const c = oc.dot(oc) - r * r;
          const disc = b * b - c;
          if (disc < 0) continue;
          const t = -b - Math.sqrt(disc);
          if (t > 0 && t < bestT) { bestT = t; bestRemotePropId = parseInt(propId); bestRemotePropRp = rp; bestProp = null; bestMpPid = -1; }
          else if (t <= 0) {
            const t2 = -b + Math.sqrt(disc);
            if (t2 < bestT) { bestT = t2; bestRemotePropId = parseInt(propId); bestRemotePropRp = rp; bestProp = null; bestMpPid = -1; }
          }
        }
      }
      // Also check remote MP players (capsule: radius 0.35, height 1.0, centered at y+0.85)
      if (MP.roomId) {
        for (const pid in MP.players) {
          const rp = MP.players[pid];
          if (!rp.mesh) continue;
          // Sphere intersection at player center (simplified — capsule treated as sphere r=0.5)
          const oc = origin.clone().sub(rp.mesh.position);
          oc.y -= 0.85;
          const b = oc.dot(dir);
          const r = 0.5;
          const c = oc.dot(oc) - r * r;
          const disc = b * b - c;
          if (disc < 0) continue;
          const t = -b - Math.sqrt(disc);
          if (t > 0 && t < bestT) { bestT = t; bestMpPid = parseInt(pid); bestProp = null; }
        }
      }
      // Hit a remote player
      if (bestMpPid >= 0) {
        const hitPos = origin.clone().add(dir.clone().multiplyScalar(bestT));
        spawnImpactParticles(game, hitPos, "wood", 5);
        spawnBlood(game, hitPos, dir);
        // Send damage to server
        if (MP.connected && MP.socket) {
          MP.socket.send(JSON.stringify({ t: MP_TYPE_DAMAGE, targetPid: bestMpPid, dmg: w.damage }));
        }
      } else if (bestRemotePropId >= 0 && bestRemotePropRp) {
        const hitPos = origin.clone().add(dir.clone().multiplyScalar(bestT));
        spawnImpactParticles(game, hitPos, "wood", 4);
        // Send impulse to the owner
        if (MP.connected && MP.socket) {
          MP.socket.send(JSON.stringify({
            t: MP_TYPE_PROPIMPULSE, propId: bestRemotePropId,
            vx: dir.x * w.damage * 1.5, vy: dir.y * w.damage * 1.5 + 2, vz: dir.z * w.damage * 1.5,
            dmg: bestRemotePropRp.item?.breakable ? w.damage : 0,
          }));
        }
      } else if (bestRemoteNpcId >= 0) {
        const hitPos = origin.clone().add(dir.clone().multiplyScalar(bestT));
        spawnImpactParticles(game, hitPos, "wood", 5);
        spawnBlood(game, hitPos, dir);
        // Send NPC kill to the owner
        if (MP.connected && MP.socket) {
          MP.socket.send(JSON.stringify({ t: MP_TYPE_NPCKILL, npcId: bestRemoteNpcId, dmg: w.damage }));
        }
      } else if (bestProp) {
        if (bestProp.isNPC) {
          damageNPC(game, bestProp, w.damage, dir);
        } else {
          bestProp.body.wakeUp();
          bestProp.body.velocity.x += dir.x * w.damage * 1.5;
          bestProp.body.velocity.y += dir.y * w.damage * 1.5 + 2;
          bestProp.body.velocity.z += dir.z * w.damage * 1.5;
          bestProp.body.angularVelocity.set((Math.random()-0.5)*w.damage, (Math.random()-0.5)*w.damage, (Math.random()-0.5)*w.damage);
          // Damage entities
          if (bestProp.entity === "explosive" && !bestProp.exploded) {
            bestProp.health -= w.damage;
          }
          const hitPos = origin.clone().add(dir.clone().multiplyScalar(bestT));
          // Damage breakables
          if (bestProp.breakable && !bestProp.broken) {
            spawnImpactParticles(game, hitPos, bestProp.breakable, Math.min(6, Math.floor(w.damage / 4)));
            damageBreakable(game, bestProp, w.damage, hitPos);
          } else if (!bestProp.breakable) {
            // Spark/dust on non-breakable hit
            const mat = bestProp.shape === "barrel" ? "metal" : "wood";
            spawnImpactParticles(game, hitPos, mat, 4);
            spawnPropDecal(game, bestProp, hitPos, dir.clone().negate(), mat);
          }
        }
      }
      // World hit (ray vs AABB colliders) — only if no prop/NPC was hit
      if (!bestProp) {
        let bestCol = null, bestColT = 100;
        for (const col of game.colliders) {
          const t = rayAABB(origin, dir, col);
          if (t && t > 0 && t < bestColT) { bestColT = t; bestCol = col; }
        }
        if (bestCol) {
          const hitPos = origin.clone().add(dir.clone().multiplyScalar(bestColT));
          // Approximate surface normal from AABB
          const cx = (bestCol.min.x + bestCol.max.x) / 2, cy = (bestCol.min.y + bestCol.max.y) / 2, cz = (bestCol.min.z + bestCol.max.z) / 2;
          const normal = new THREE.Vector3(0, 0, 0);
          const dx = hitPos.x - cx, dy = hitPos.y - cy, dz = hitPos.z - cz;
          const sx = bestCol.max.x - bestCol.min.x, sy = bestCol.max.y - bestCol.min.y, sz = bestCol.max.z - bestCol.min.z;
          const rx = dx / sx, ry = dy / sy, rz = dz / sz;
          if (Math.abs(rx) > Math.abs(ry) && Math.abs(rx) > Math.abs(rz)) normal.set(Math.sign(rx), 0, 0);
          else if (Math.abs(ry) > Math.abs(rz)) normal.set(0, Math.sign(ry), 0);
          else normal.set(0, 0, Math.sign(rz));
          // Guess material: large flat AABBs are concrete, tall thin ones are walls
          const isFloor = bestCol.max.y < 1.5 && (sx > 20 || sz > 20);
          const matType = isFloor ? "concrete" : "concrete";
          spawnImpactParticles(game, hitPos, matType, 4);
          spawnDecal(game, hitPos, normal, matType);
        }
      }
    }
  }

  function showMuzzleFlash() {
    const vm = viewModels[WEAPONS[currentWeapon].id];
    if (!vm || !vm.userData.muzzle) return;
    muzzleFlash.position.copy(vm.userData.muzzle);
    vm.localToWorld(muzzleFlash.position);
    muzzleFlash.material.opacity = 1;
    muzzleFlash.scale.setScalar(0.8 + Math.random() * 0.6);
    muzzleFlash.rotation.z = Math.random() * Math.PI;
    muzzleFlash.visible = true;
    muzzleFlashTime = performance.now();
  }

  function tryReload() {
    const w = WEAPONS[currentWeapon];
    if (w.clip === Infinity || w.clip >= w.maxClip || w.ammo <= 0) return;
    if (animState.reload > 0) return; // already reloading
    const needed = w.maxClip - w.clip;
    const take = Math.min(needed, w.ammo);
    animState.reload = 1;
    animState.reloadStart = performance.now();
    animState.reloadDur = w.type === "shotgun" ? 1800 : 1400;
    animState.reloadPending = { weaponIdx: currentWeapon, take: take };
    playSound(w.id + "_reload");
  }

  function completeReload() {
    if (!animState.reloadPending) return;
    const w = WEAPONS[animState.reloadPending.weaponIdx];
    if (w) {
      w.clip += animState.reloadPending.take;
      w.ammo -= animState.reloadPending.take;
    }
    animState.reloadPending = null;
  }

  // ---- Per-weapon viewmodel animation ----
  function updateViewmodel(dt, now) {
    const wid = WEAPONS[currentWeapon].id;
    const wtype = WEAPONS[currentWeapon].type;
    // Camera has no viewmodel
    if (wtype === "camera") return;
    // Use custom MDL viewmodel if available, else procedural
    const vm = customViewmodels[wid] ? customViewmodels[wid].wrapper : viewModels[wid];
    if (!vm) return;
    const base = vm.userData.basePos, baseRot = vm.userData.baseRot;
    const parts = vm.userData.parts || {};
    const isCustom = !!customViewmodels[wid];

    // Fire anim decay
    animState.fire *= 0.82;

    // Reload progress
    let reloadT = 0;
    if (animState.reload > 0) {
      const elapsed = now - animState.reloadStart;
      reloadT = elapsed / animState.reloadDur;
      if (reloadT >= 1) { animState.reload = 0; completeReload(); }
    }

    // Grab state for physgun / realphysgun
    if (wid === "physgun" || wid === "realphysgun") {
      animState.grab = game.grabbed ? Math.min(1, animState.grab + dt * 6) : Math.max(0, animState.grab - dt * 6);
    }

    // Switch lower animation
    const switchAge = (now - weaponSwitchTime) / 1000;
    let lowerOffset = 0;
    if (switchAge < 0.4) { const t = switchAge / 0.4; lowerOffset = (1 - t) * 0.15; }

    // Bob
    const g = game;
    const moving = (g.keys["w"] || g.keys["a"] || g.keys["s"] || g.keys["d"]) && g.player.onGround;
    if (moving) viewmodelBob += dt * (g.player.sprinting ? 16 : wid === "crowbar" ? 6 : 10);
    const bobAmt = g.player.sprinting ? 0.012 : 0.008;
    const bobX = Math.cos(viewmodelBob) * bobAmt;
    const bobY = Math.abs(Math.sin(viewmodelBob)) * (g.player.sprinting ? 0.015 : 0.01);
    viewmodelSwayX *= 0.9; viewmodelSwayY *= 0.9;

    // Per-weapon offsets
    let offX = 0, offY = 0, offZ = 0, rotX = 0, rotY = 0, rotZ = 0;

    switch (wid) {
      case "physgun": {
        // Idle float
        offY += Math.sin(now * 0.003) * 0.004;
        offX += Math.sin(now * 0.0025) * 0.002;
        // Grab: lift, prongs open, coil spins
        if (animState.grab > 0) {
          offY += animState.grab * 0.03;
          offZ -= animState.grab * 0.02;
          if (parts.coil) parts.coil.rotation.z = now * 0.015 * animState.grab;
          if (parts.backCoil) parts.backCoil.rotation.z = now * 0.01 * animState.grab;
          if (parts.prongs) {
            for (const prong of parts.prongs) {
              const baseAng = prong.userData.baseAng || 0;
              const splay = animState.grab * 0.35;
              prong.position.x = (prong.userData.basePos.x) * (1 + splay * 2);
              prong.position.y = (prong.userData.basePos.y + 0.01) * (1 + splay * 2) - 0.01;
              prong.rotation.y = baseAng * splay * 0.3;
              prong.rotation.x = splay * 0.2;
            }
          }
          if (parts.coil) parts.coil.material.emissiveIntensity = 1.5 + animState.grab * 3 + Math.sin(now * 0.02) * 0.5;
          if (parts.tip) parts.tip.material.emissiveIntensity = 2 + animState.grab * 4;
          if (parts.glowDisc) parts.glowDisc.material.opacity = 0.3 + animState.grab * 0.4;
        } else {
          if (parts.coil) { parts.coil.rotation.z = now * 0.002; parts.coil.material.emissiveIntensity = 1.5 + Math.sin(now * 0.004) * 0.5; }
          if (parts.tip) parts.tip.material.emissiveIntensity = 2;
          if (parts.glowDisc) parts.glowDisc.material.opacity = 0.3;
          if (parts.prongs) {
            for (const prong of parts.prongs) {
              prong.position.copy(prong.userData.basePos);
              prong.rotation.set(0, 0, 0);
            }
          }
        }
        break;
      }
      case "realphysgun": {
        // Idle float
        offY += Math.sin(now * 0.003) * 0.004;
        offX += Math.sin(now * 0.0025) * 0.002;
        if (animState.grab > 0) {
          offY += animState.grab * 0.03;
          offZ -= animState.grab * 0.02;
          if (parts.prongs) {
            for (const prong of parts.prongs) {
              const baseAng = prong.userData.baseAng || 0;
              const splay = animState.grab * 0.35;
              prong.position.x = (prong.userData.basePos.x) * (1 + splay * 2);
              prong.position.y = (prong.userData.basePos.y + 0.01) * (1 + splay * 2) - 0.01;
              prong.rotation.y = baseAng * splay * 0.3;
              prong.rotation.x = splay * 0.2;
            }
          }
          if (parts.coil) parts.coil.rotation.z = now * 0.015 * animState.grab;
          if (parts.backCoil) parts.backCoil.rotation.z = now * 0.01 * animState.grab;
          if (parts.coil) parts.coil.material.emissiveIntensity = 2.5 + animState.grab * 4 + Math.sin(now * 0.02) * 0.5;
          if (parts.tip) parts.tip.material.emissiveIntensity = 4 + animState.grab * 6;
          if (parts.glowDisc) parts.glowDisc.material.opacity = 0.3 + animState.grab * 0.5;
          if (parts.glowTip) { parts.glowTip.material.opacity = 0.6 + animState.grab * 0.4; parts.glowTip.scale.setScalar(1 + animState.grab * 0.5); }
        } else {
          if (parts.coil) { parts.coil.rotation.z = now * 0.002; parts.coil.material.emissiveIntensity = 2.5 + Math.sin(now * 0.004) * 0.5; }
          if (parts.tip) parts.tip.material.emissiveIntensity = 4;
          if (parts.glowDisc) parts.glowDisc.material.opacity = 0.3;
          if (parts.glowTip) { parts.glowTip.material.opacity = 0.6 + Math.sin(now * 0.005) * 0.2; parts.glowTip.scale.setScalar(1); }
          if (parts.prongs) {
            for (const prong of parts.prongs) {
              prong.position.copy(prong.userData.basePos);
              prong.rotation.set(0, 0, 0);
            }
          }
        }
        break;
      }
      case "crowbar": {
        // Idle: hangs with sway
        offX += Math.sin(now * 0.002) * 0.005;
        rotZ += Math.sin(now * 0.002) * 0.02;
        // Swing animation
        if (animState.swinging) {
          const swingAge = (now - animState.swingStart) / 1000;
          const swingDur = 0.45;
          const t = swingAge / swingDur;
          if (t >= 1) { animState.swinging = false; }
          else if (t < 0.3) {
            // Wind up — pull back and up
            const wt = t / 0.3;
            rotX -= wt * 1.2;
            rotZ += wt * 0.5;
            offZ += wt * 0.08;
            offY += wt * 0.04;
          } else if (t < 0.55) {
            // Swing forward — chop down
            const st = (t - 0.3) / 0.25;
            const swing = Math.sin(st * Math.PI);
            rotX += swing * 1.8;
            offZ -= swing * 0.15;
            offY -= swing * 0.05;
          } else {
            // Return to rest
            const rt = (t - 0.55) / 0.45;
            const ret = 1 - rt;
            rotX += ret * 0.5;
            offZ -= ret * 0.05;
          }
        }
        break;
      }
      case "pistol": {
        // Idle breathing
        offY += Math.sin(now * 0.003) * 0.002;
        // Fire: slide kicks back + sharp recoil
        const f = animState.fire;
        if (parts.slide) parts.slide.position.z = -0.1 + f * 0.04;
        rotX += f * 0.12;
        offZ += f * 0.03;
        offY += f * 0.01;
        // Reload: tilt left, mag drop, rack slide
        if (reloadT > 0) {
          if (reloadT < 0.2) { rotZ -= reloadT / 0.2 * 0.4; rotY -= reloadT / 0.2 * 0.2; }
          else if (reloadT < 0.4) { rotZ -= 0.4; rotY -= 0.2; if (parts.mag) parts.mag.position.y = -0.08 - (reloadT - 0.2) / 0.2 * 0.15; }
          else if (reloadT < 0.6) { rotZ -= 0.4; rotY -= 0.2; if (parts.mag) parts.mag.position.y = -0.08 + (reloadT - 0.4) / 0.2 * 0.08; }
          else if (reloadT < 0.8) { rotZ -= 0.4 * (1 - (reloadT - 0.6) / 0.2); rotY -= 0.2 * (1 - (reloadT - 0.6) / 0.2); if (parts.mag) parts.mag.position.y = -0.08; if (parts.slide) parts.slide.position.z = -0.1 + (reloadT - 0.6) / 0.2 * 0.04; }
          else { if (parts.mag) parts.mag.position.y = -0.08; if (parts.slide) parts.slide.position.z = -0.1 + (1 - (reloadT - 0.8) / 0.2) * 0.04; }
        }
        break;
      }
      case "smg1": {
        // Idle breathing
        offY += Math.sin(now * 0.0035) * 0.003;
        // Fire: body kicks back, slight upward rotation
        const f = animState.fire;
        if (parts.body) parts.body.position.z = -0.14 + f * 0.015;
        rotX += f * 0.08;
        offZ += f * 0.025;
        offY += f * 0.008;
        // Reload: tilt, mag out/in
        if (reloadT > 0) {
          if (reloadT < 0.25) { rotZ -= reloadT / 0.25 * 0.3; if (parts.mag) parts.mag.position.y = -0.07 - reloadT / 0.25 * 0.12; }
          else if (reloadT < 0.5) { rotZ -= 0.3; if (parts.mag) parts.mag.position.y = -0.19 + (reloadT - 0.25) / 0.25 * 0.12; }
          else { rotZ -= 0.3 * (1 - (reloadT - 0.5) / 0.5); if (parts.mag) parts.mag.position.y = -0.07; }
        }
        break;
      }
      case "shotgun": {
        // Idle: steady, slight weight
        offY += Math.sin(now * 0.002) * 0.002;
        // Fire: pump action — pump grip moves forward then back, recoil
        const f = animState.fire;
        if (parts.pump) {
          if (f > 0.3) { parts.pump.position.z = -0.1 + (1 - f) * 0.06; } // pump forward
          else { parts.pump.position.z = -0.1 + f * 0.04; } // pump back
        }
        rotX += f * 0.15;
        offZ += f * 0.04;
        offY += f * 0.015;
        // Reload: tilt up, insert shells
        if (reloadT > 0) {
          rotX -= Math.sin(reloadT * Math.PI) * 0.3;
          offY += Math.sin(reloadT * Math.PI) * 0.03;
          if (parts.pump) parts.pump.position.z = -0.1 + Math.sin(reloadT * Math.PI * 2) * 0.03;
        }
        break;
      }
      case "ar2": {
        // Idle: core pulse, energy hum
        offY += Math.sin(now * 0.004) * 0.002;
        if (parts.core) parts.core.material.emissiveIntensity = 1.5 + Math.sin(now * 0.005) * 0.5;
        // Fire: energy discharge, recoil
        const f = animState.fire;
        if (parts.core) parts.core.material.emissiveIntensity += f * 3;
        if (parts.body) parts.body.position.z = -0.15 + f * 0.012;
        rotX += f * 0.1;
        offZ += f * 0.025;
        offY += f * 0.01;
        // Reload: cell out/in with glow
        if (reloadT > 0) {
          if (reloadT < 0.3) { if (parts.mag) parts.mag.position.y = -0.08 - reloadT / 0.3 * 0.1; if (parts.magGlow) parts.magGlow.material.emissiveIntensity = 1 + reloadT * 2; }
          else if (reloadT < 0.6) { if (parts.mag) parts.mag.position.y = -0.18 + (reloadT - 0.3) / 0.3 * 0.1; if (parts.magGlow) parts.magGlow.material.emissiveIntensity = 3 - (reloadT - 0.3) / 0.3 * 2; }
          else { if (parts.mag) parts.mag.position.y = -0.08; if (parts.magGlow) parts.magGlow.material.emissiveIntensity = 1; }
        }
        break;
      }
      case "toolgun": {
        offY += Math.sin(now * 0.003) * 0.003;
        if (parts.screen) parts.screen.material.emissiveIntensity = 1.5 + Math.sin(now * 0.008) * 0.5;
        if (parts.emitter) parts.emitter.material.emissiveIntensity = 1 + Math.sin(now * 0.01) * 0.5;
        const f = animState.fire;
        if (f > 0.1 && parts.emitter) parts.emitter.material.emissiveIntensity = 4;
        rotX += f * 0.1;
        offZ += f * 0.03;
        break;
      }
      case "357": {
        // Idle: slight sway, heavy weight
        offY += Math.sin(now * 0.002) * 0.003;
        offX += Math.sin(now * 0.0018) * 0.002;
        // Fire: strong recoil, hammer snaps
        const f = animState.fire;
        if (parts.hammer) parts.hammer.position.z = 0.06 - f * 0.02;
        if (parts.cyl) parts.cyl.rotation.z = now * 0.001;
        rotX += f * 0.25;
        offZ += f * 0.06;
        offY += f * 0.02;
        // Reload: swing cylinder out, insert rounds, swing back
        if (reloadT > 0) {
          if (reloadT < 0.2) { rotY += reloadT / 0.2 * 0.5; rotZ += reloadT / 0.2 * 0.2; if (parts.cyl) parts.cyl.position.x = 0.02 + reloadT / 0.2 * 0.04; }
          else if (reloadT < 0.5) { rotY += 0.5; rotZ += 0.2; if (parts.cyl) { parts.cyl.position.x = 0.06; parts.cyl.rotation.z = (reloadT - 0.2) / 0.3 * Math.PI * 2; } offY -= 0.04; }
          else if (reloadT < 0.7) { rotY += 0.5; rotZ += 0.2; if (parts.cyl) { parts.cyl.position.x = 0.06; parts.cyl.rotation.z = (reloadT - 0.5) / 0.2 * Math.PI * 2; } offY -= 0.04; }
          else { rotY += 0.5 * (1 - (reloadT - 0.7) / 0.3); rotZ += 0.2 * (1 - (reloadT - 0.7) / 0.3); if (parts.cyl) parts.cyl.position.x = 0.06 * (1 - (reloadT - 0.7) / 0.3); }
        }
        break;
      }
      case "rpg": {
        // Idle: heavy, slight bob
        offY += Math.sin(now * 0.0025) * 0.004;
        // Fire: backblast, rocket leaves
        const f = animState.fire;
        if (parts.rocket) parts.rocket.position.z = -0.58 - f * 0.3;
        if (parts.rocket) parts.rocket.visible = f < 0.3;
        rotX += f * 0.15;
        offZ += f * 0.05;
        offY += f * 0.02;
        // Reload: lower tube, insert rocket, raise
        if (reloadT > 0) {
          if (reloadT < 0.25) { offY -= reloadT / 0.25 * 0.12; rotX -= reloadT / 0.25 * 0.3; }
          else if (reloadT < 0.5) { offY -= 0.12; rotX -= 0.3; if (parts.rocket) { parts.rocket.visible = true; parts.rocket.position.z = -0.58 + (1 - (reloadT - 0.25) / 0.25) * 0.2; } }
          else if (reloadT < 0.75) { offY -= 0.12; rotX -= 0.3; if (parts.rocket) { parts.rocket.position.z = -0.58; } }
          else { offY -= 0.12 * (1 - (reloadT - 0.75) / 0.25); rotX -= 0.3 * (1 - (reloadT - 0.75) / 0.25); if (parts.rocket) parts.rocket.position.z = -0.58; }
        }
        break;
      }
      case "crossbow": {
        offY += Math.sin(now * 0.002) * 0.003;
        const f = animState.fire;
        if (parts.string) {
          if (f > 0.2) { parts.string.position.z = -0.1 + (1 - f) * 0.1; }
          else { parts.string.position.z = -0.1 - f * 0.05; }
        }
        if (parts.bolt) parts.bolt.visible = f < 0.1 && reloadT === 0;
        rotX += f * 0.12;
        offZ += f * 0.04;
        if (reloadT > 0) {
          if (reloadT < 0.4) { rotX -= reloadT / 0.4 * 0.4; if (parts.string) parts.string.position.z = -0.1 - reloadT / 0.4 * 0.1; }
          else if (reloadT < 0.7) { rotX -= 0.4; if (parts.string) parts.string.position.z = -0.2 + (reloadT - 0.4) / 0.3 * 0.1; if (parts.bolt) parts.bolt.visible = reloadT > 0.55; }
          else { rotX -= 0.4 * (1 - (reloadT - 0.7) / 0.3); if (parts.string) parts.string.position.z = -0.1; }
        }
        break;
      }
      case "grenade": {
        offY += Math.sin(now * 0.003) * 0.003;
        const f = animState.fire;
        rotX += f * 0.3;
        offZ += f * 0.05;
        offY += f * 0.02;
        break;
      }

  // ---- Procedural textures ----
  function makeCrateTexture() {
    const c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    const x = c.getContext("2d");
    x.fillStyle = "#9B6B3F"; x.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 35; i++) {
      x.strokeStyle = "rgba(70,42,18," + (0.12 + Math.random() * 0.25) + ")";
      x.lineWidth = 0.5 + Math.random() * 1.2;
      x.beginPath();
      const y = (i / 35) * 256 + (Math.random() - 0.5) * 3;
      x.moveTo(0, y);
      for (let s = 0; s <= 256; s += 6) x.lineTo(s, y + Math.sin(s * 0.04 + i * 1.3) * 2);
      x.stroke();
    }
    x.strokeStyle = "rgba(45,28,12,0.7)"; x.lineWidth = 4;
    x.strokeRect(0, 0, 256, 85); x.strokeRect(0, 86, 256, 85); x.strokeRect(0, 171, 256, 85);
    x.fillStyle = "rgba(70,70,78,0.85)";
    x.fillRect(0, 0, 22, 22); x.fillRect(234, 0, 22, 22);
    x.fillRect(0, 234, 22, 22); x.fillRect(234, 234, 22, 22);
    x.fillStyle = "rgba(40,40,45,0.95)";
