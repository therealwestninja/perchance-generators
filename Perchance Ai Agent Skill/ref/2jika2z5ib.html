          for (const opt of s.options) {
            html += '<button class="ts-btn ' + (opt === val ? "active" : "") + '" data-tskey="' + s.key + '" data-tsval="' + opt + '">' + opt + '</button>';
          }
          html += '</div>';
        } else if (s.type === "toggle") {
          html += '<label class="ts-toggle"><input type="checkbox" data-tskey="' + s.key + '" ' + (val ? "checked" : "") + '><span class="ts-check">' + (val ? "✓" : "") + '</span><span class="ts-toggle-lbl">' + (s.toggleLabel || "Enabled") + '</span></label>';
        }
        html += '</div>';
      }
    }
    return html;
  }

  function fireToolgun() {
    if (!game) return;
    const tool = TOOL_LIST[currentTool];
    const hit = raycastProp(game);
    if (!hit) { playSound("weapon_deny"); return; }
    const mods = { ctrl: game.keys["control"], alt: game.keys["alt"], e: game.keys["e"], shift: game.keys["shift"] };
    playSound("weapon_switch");
    try { tool.fire(game, hit, mods, getToolState()); } catch(e) { console.error("Tool error:", e); }
  }

  function handleToolKey(g, key, mods) {
    const tool = TOOL_LIST[currentTool];
    if (!tool.onKey) return false;
    const hit = raycastProp(g);
    try { tool.onKey(g, key, hit, mods, getToolState()); } catch(e) { console.error(e); }
    return true;
  }


  function raycastProp(g) {
    const origin = g.player.pos.clone();
    const dir = getCameraForward(g);
    let best = null, bestT = 30;
    for (const p of g.props) {
      const oc = origin.clone().sub(p.mesh.position);
      const b = oc.dot(dir);
      const c = oc.dot(oc) - p.radius * p.radius;
      const disc = b * b - c;
      if (disc < 0) continue;
      const t = -b - Math.sqrt(disc);
      if (t > 0 && t < bestT) { bestT = t; best = p; }
      else if (t <= 0) {
        const t2 = -b + Math.sqrt(disc);
        if (t2 < bestT) { bestT = t2; best = p; }
      }
    }
    // Also check NPCs (skip dead/ragdolled — those are grabbed via ragdoll parts below)
    for (const n of g.npcs) {
      if (!n.alive) continue;
      const oc = origin.clone().sub(n.mesh.position);
      const b = oc.dot(dir);
      const r = n.radius;
      const c = oc.dot(oc) - r * r;
      const disc = b * b - c;
      if (disc < 0) continue;
      const t = -b - Math.sqrt(disc);
      if (t > 0 && t < bestT) { bestT = t; best = n; }
      else if (t <= 0) {
        const t2 = -b + Math.sqrt(disc);
        if (t2 < bestT) { bestT = t2; best = n; }
      }
    }
    // Also check ragdoll body parts (for physgun grabbing individual limbs)
    for (const n of g.npcs) {
      if (!n.ragdollBodies) continue;
      for (let i = 0; i < n.ragdollBodies.length; i++) {
        const rb = n.ragdollBodies[i];
        const rm = n.ragdollMeshes[i];
        if (!rb || !rm) continue;
        const oc = origin.clone().sub(rb.position);
        const b = oc.dot(dir);
        const r = 0.3; // approx part radius (generous for easy grabbing)
        const c = oc.dot(oc) - r * r;
        const disc = b * b - c;
        if (disc < 0) continue;
        const t = -b - Math.sqrt(disc);
        if (t > 0 && t < bestT) { bestT = t; best = { body: rb, mesh: rm, radius: r, isRagdollPart: true, npc: n }; }
        else if (t <= 0) {
          const t2 = -b + Math.sqrt(disc);
          if (t2 < bestT) { bestT = t2; best = { body: rb, mesh: rm, radius: r, isRagdollPart: true, npc: n }; }
        }
      }
    }
    // Also check remote (MP) props — return a stub that the grab handler converts to a local prop
    if (MP.roomId) {
      for (const propId in MP.remoteProps) {
        const rp = MP.remoteProps[propId];
        if (!rp.mesh || !rp.mesh.parent) continue;
        const oc = origin.clone().sub(rp.mesh.position);
        const b = oc.dot(dir);
        const r = rp.mesh.userData.radius || 0.8;
        const c = oc.dot(oc) - r * r;
        const disc = b * b - c;
        if (disc < 0) continue;
        const t = -b - Math.sqrt(disc);
        if (t > 0 && t < bestT) { bestT = t; best = { mesh: rp.mesh, radius: r, isRemoteProp: true, mpId: parseInt(propId), rp }; }
        else if (t <= 0) {
          const t2 = -b + Math.sqrt(disc);
          if (t2 < bestT) { bestT = t2; best = { mesh: rp.mesh, radius: r, isRemoteProp: true, mpId: parseInt(propId), rp }; }
        }
      }
    }
    return best;
  }

  // ==================== UNDO SYSTEM ====================
  let undoStack = [];
  const MAX_UNDO = 50;

  function pushUndo(action) {
    undoStack.push(action);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
  }

  function doUndo() {
    if (undoStack.length === 0) return;
    const action = undoStack.pop();
    let msg = "";
    switch (action.type) {
      case "spawnProp":
        if (action.prop && game.props.includes(action.prop)) {
          msg = "Removed prop (" + (action.name || "Prop") + ")";
          removeProp3D(game, action.prop);
        }
        break;
      case "spawnEntity":
        if (action.prop && game.props.includes(action.prop)) {
          msg = "Removed entity (" + (action.name || "Entity") + ")";
          if (action.prop.body) game.world.removeBody(action.prop.body);
          removeProp3D(game, action.prop);
        }
        break;
      case "spawnNPC":
        if (action.npc && game.npcs.includes(action.npc)) {
          msg = "Removed (" + (action.name || "NPC") + ")";
          removeNPC(game, action.npc);
        }
        break;
      case "spawnRagdoll":
        if (action.npc && game.npcs.includes(action.npc)) {
          msg = "Removed ragdoll (" + (action.name || "Ragdoll") + ")";
          removeNPC(game, action.npc);
        }
        break;
      case "tool":
        msg = "Undid " + action.tool + "!";
        if (action.undoFn) { try { action.undoFn(); } catch(e) {} }
        break;
      case "weld":
        msg = "Undid weld";
        if (action.constraint && game.world.constraints.includes(action.constraint)) {
          game.world.removeConstraint(action.constraint);
        }
        break;
    }
    playSound("undo");
    showUndoNotification(msg);
  }

  let undoNotifyEl = null;
  let undoNotifyTimer = null;
  function showUndoNotification(msg) {
    if (!undoNotifyEl) {
      undoNotifyEl = document.createElement("div");
      undoNotifyEl.id = "undoNotify";
      undoNotifyEl.style.cssText = "position:absolute;bottom:70px;left:20px;background:rgba(20,24,28,0.92);color:#ffaa44;font-family:'Trebuchet MS',Verdana,sans-serif;font-size:14px;font-weight:700;padding:8px 14px;border-left:3px solid #ffaa44;border-radius:3px;pointer-events:none;z-index:20;opacity:0;transition:opacity 0.25s;text-shadow:0 0 4px rgba(0,0,0,0.9);max-width:300px;";
      const hud = document.querySelector(".hl2-hud");
      if (hud) hud.appendChild(undoNotifyEl);
      else document.body.appendChild(undoNotifyEl);
    }
    undoNotifyEl.textContent = msg;
    undoNotifyEl.style.opacity = "1";
    if (undoNotifyTimer) clearTimeout(undoNotifyTimer);
    undoNotifyTimer = setTimeout(() => { if (undoNotifyEl) undoNotifyEl.style.opacity = "0"; }, 3000);
  }

  function spawnAtCrosshair(g, item) {
    const origin = g.player.pos.clone();
    const dir = getCameraForward(g);
    let bestT = 12;
    for (const col of g.colliders) {
      const t = rayAABB(origin, dir, col);
      if (t !== null && t < bestT) bestT = t;
    }
    if (dir.y < -0.01) {
      const t = -origin.y / dir.y;
      if (t > 0 && t < bestT) bestT = t;
    }
    const dist = Math.max(3, bestT - 1.5);
    const pos = origin.add(dir.multiplyScalar(dist));
    const prop = spawnProp3D(g, pos.x, pos.y, pos.z, item);
    pushUndo({ type: "spawnProp", prop: prop, name: item.name || "Prop" });
  }

  function spawnNPCCrosshair(g, npcType) {
    const origin = g.player.pos.clone();
    const dir = getCameraForward(g);
    let bestT = 12;
    for (const col of g.colliders) {
      const t = rayAABB(origin, dir, col);
      if (t !== null && t < bestT) bestT = t;
    }
    if (dir.y < -0.01) {
      const t = -origin.y / dir.y;
      if (t > 0 && t < bestT) bestT = t;
    }
    const dist = Math.max(3, bestT - 2);
    const pos = origin.add(dir.multiplyScalar(dist));
    // Spawn on the ground if possible
    const groundY = findGroundHeight(g, pos.x, pos.z);
    const spawnY = groundY !== null ? groundY : pos.y;
    const npc = spawnNPC3D(g, pos.x, spawnY, pos.z, npcType);
    const def = NPC_TYPES.find(t => t.id === npcType);
    if (npcType.startsWith("ragdoll")) {
      pushUndo({ type: "spawnRagdoll", npc: npc, name: def ? def.name : "Ragdoll" });
    } else {
      pushUndo({ type: "spawnNPC", npc: npc, name: def ? def.name : "NPC" });
    }
  }

  function rayAABB(origin, dir, col) {
    let tmin = -Infinity, tmax = Infinity;
    for (const ax of ["x", "y", "z"]) {
      if (Math.abs(dir[ax]) < 1e-8) {
        if (origin[ax] < col.min[ax] || origin[ax] > col.max[ax]) return null;
      } else {
        let t1 = (col.min[ax] - origin[ax]) / dir[ax];
        let t2 = (col.max[ax] - origin[ax]) / dir[ax];
        if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
        tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
        if (tmin > tmax) return null;
      }
    }
    return tmin > 0 ? tmin : (tmax > 0 ? tmax : null);
  }

  function physics3D(g, dt) {
    const T = THREE;
    const p = g.player;

    // ---- NOCLIP MODE ----
    if (p.noclip) {
      // Update camera orientation from yaw/pitch FIRST
      const qYaw = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 1, 0), p.yaw + recoilYaw);
      const qPitch = new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), p.pitch + recoilPitch);
      g.camera.quaternion.copy(qYaw).multiply(qPitch);
      if (g.camera.roll) {
        const qRoll = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 0, 1), g.camera.roll);
        g.camera.quaternion.multiply(qRoll);
      }
      const fwd3 = new T.Vector3();
      g.camera.getWorldDirection(fwd3);
      const right3 = new T.Vector3().crossVectors(fwd3, new T.Vector3(0,1,0)).normalize();
      const SPD = g.keys["shift"] ? 40 : 15;
      const move = new T.Vector3();
      if (g.keys["w"]) move.add(fwd3);
      if (g.keys["s"]) move.sub(fwd3);
      if (g.keys["d"]) move.add(right3);
      if (g.keys["a"]) move.sub(right3);
      if (g.keys[" "]) move.y += 1;
      if (g.keys["control"]) move.y -= 1;
      if (move.lengthSq() > 0) move.normalize().multiplyScalar(SPD * dt);
      p.pos.add(move);
      p.vel.set(0,0,0);
      p.onGround = false;
      g.camera.position.copy(p.pos);
      g.playerBody.position.set(p.pos.x, p.pos.y, p.pos.z);
      g.world.step(1 / 60, dt, 3);
      for (const prop of g.props) { prop.mesh.position.copy(prop.body.position); prop.mesh.quaternion.copy(prop.body.quaternion); }
      for (let i = g.props.length - 1; i >= 0; i--) { if (g.props[i].body.position.y < g.killY) removeProp3D(g, g.props[i]); }
      return;
    }

    // ---- Crouch state (Ctrl) ----
    const wantCrouch = !!(g.keys["control"]);
    // Ceiling check: can we stand up?
    if (!wantCrouch && p.height < 1.6) {
      let blocked = false;
      const headTop = p.pos.y + 0.05;
      const standTop = p.pos.y + (1.7 - p.height) + 0.05;
      for (const col of g.colliders) {
        if (p.pos.x > col.min.x - 0.3 && p.pos.x < col.max.x + 0.3 &&
            p.pos.z > col.min.z - 0.3 && p.pos.z < col.max.z + 0.3 &&
            headTop < col.max.y && standTop > col.min.y) { blocked = true; break; }
      }
      if (blocked) p.crouching = true; else p.crouching = false;
    } else {
      p.crouching = wantCrouch;
    }
    // Smoothly lerp eye height, keep feet planted
    const targetEye = p.crouching ? 1.1 : 1.7;
    const prevEye = p.height;
    p.height = T.MathUtils.lerp(p.height, targetEye, Math.min(1, dt * 12));
    p.pos.y += (p.height - prevEye);

    // ---- Recoil spring (camera kick that springs back to zero) ----
    const springK = 25, dampK = 8;
    recoilVelPitch += (-springK * recoilPitch - dampK * recoilVelPitch) * dt;
    recoilVelYaw += (-springK * recoilYaw - dampK * recoilVelYaw) * dt;
    recoilPitch += recoilVelPitch * dt;
    recoilYaw += recoilVelYaw * dt;
    recoilOffset *= Math.pow(0.001, dt);

    // ---- Camera ----
    g.camera.position.copy(p.pos);
    g.camera.position.add(g.cameraOffset);
    const qYaw = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 1, 0), p.yaw + recoilYaw);
    const qPitch = new T.Quaternion().setFromAxisAngle(new T.Vector3(1, 0, 0), p.pitch + recoilPitch);
    g.camera.quaternion.copy(qYaw).multiply(qPitch);
    if (g.camera.roll || g.cameraRollOffset) {
      const roll = (g.camera.roll || 0) + g.cameraRollOffset;
      if (roll) {
        const qRoll = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 0, 1), roll);
        g.camera.quaternion.multiply(qRoll);
      }
    }

    // ---- Wish direction (ground plane only) ----
    const fwd = new T.Vector3(Math.sin(p.yaw), 0, Math.cos(p.yaw)).multiplyScalar(-1);
    const right = new T.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));
    const wishdir = new T.Vector3();
    if (g.keys["w"]) wishdir.add(fwd);
    if (g.keys["s"]) wishdir.sub(fwd);
    if (g.keys["d"]) wishdir.add(right);
    if (g.keys["a"]) wishdir.sub(right);
    const hasInput = wishdir.lengthSq() > 0;
    if (hasInput) wishdir.normalize();

    // ---- Speeds + sprint stamina ----
    const SPRINT = 13.5, WALK = 8, CROUCH = 3;
    let maxSpeed = WALK;
    p.sprinting = false;
    const movingFwd = g.keys["w"] || g.keys["a"] || g.keys["s"] || g.keys["d"];
    if (p.crouching) {
      maxSpeed = CROUCH;
    } else if (g.keys["shift"] && movingFwd && p.stamina > 0 && p.sprintCooldown <= 0) {
      maxSpeed = SPRINT;
      p.sprinting = true;
      p.stamina = Math.max(0, p.stamina - dt * 22);
      if (p.stamina <= 0) p.sprintCooldown = 1.2;
    } else {
      p.stamina = Math.min(100, p.stamina + dt * 15);
    }
    if (p.sprintCooldown > 0) p.sprintCooldown -= dt;

    const wishspeed = hasInput ? maxSpeed : 0;

    // ---- Jump buffering (for bhop) ----
    if (g.keys[" "]) p.jumpBuffer = 0.15;
    else p.jumpBuffer = Math.max(0, (p.jumpBuffer || 0) - dt);

    // ---- Ground: friction + accelerate ----
    if (p.onGround) {
      // Bhop grace: skip friction if jumping within 100ms of landing (preserves speed)
      const bhopGrace = p.stoodTime < 0.1 && p.jumpBuffer > 0;
      // Friction (sv_friction style) — skipped during bhop grace
      if (!bhopGrace) {
        const speed = Math.sqrt(p.vel.x * p.vel.x + p.vel.z * p.vel.z);
        if (speed > 0.001) {
          const control = Math.max(speed, 1.9); // sv_stopspeed
          const drop = control * 4 * dt;        // sv_friction
          const newspeed = Math.max(0, speed - drop) / speed;
          p.vel.x *= newspeed;
          p.vel.z *= newspeed;
        }
      }
      // Ground accelerate (sv_accelerate)
      if (hasInput) {
        const currentspeed = p.vel.x * wishdir.x + p.vel.z * wishdir.z;
        const addspeed = wishspeed - currentspeed;
        if (addspeed > 0) {
          let accelspeed = 10 * dt * wishspeed;
          if (accelspeed > addspeed) accelspeed = addspeed;
          p.vel.x += wishdir.x * accelspeed;
          p.vel.z += wishdir.z * accelspeed;
        }
      }
      // Jump (with bhop speed preservation — no extra friction on hop)
      if (p.jumpBuffer > 0) {
        p.vel.y = p.crouching ? 5.8 : 7.2;
        p.onGround = false;
        p.jumpBuffer = 0;
        p.stoodTime = 0;
      } else {
        p.stoodTime += dt;
      }
    } else {
      // ---- Air: Source air-accelerate (enables strafe jumping / bhop) ----
      if (hasInput) {
        const airWish = Math.min(wishspeed, 3.0); // cap (lower = harder bhop; higher = easier)
        const currentspeed = p.vel.x * wishdir.x + p.vel.z * wishdir.z;
        const addspeed = airWish - currentspeed;
        if (addspeed > 0) {
          let accelspeed = 30 * dt * airWish; // sv_airaccelerate (boosted for fun bhop)
          if (accelspeed > addspeed) accelspeed = addspeed;
          p.vel.x += wishdir.x * accelspeed;
          p.vel.z += wishdir.z * accelspeed;
        }
      }
    }

    // ---- Gravity ----
    p.vel.y -= 20 * dt;
    if (p.vel.y < -40) p.vel.y = -40;

    // ---- Integrate ----
    p.pos.x += p.vel.x * dt;
    p.pos.z += p.vel.z * dt;
    p.pos.y += p.vel.y * dt;

    // ---- Collision ----
    p.onGround = false;
    // Floor (only for procedural maps — BSP maps use brush colliders)
    if (!g.bspData && p.pos.y < p.height) { p.pos.y = p.height; p.vel.y = 0; p.onGround = true; }

    // Kill plane: respawn player if they fall below the map
    if (p.pos.y < g.killY) {
      if (g.playerSpawn) { p.pos.copy(g.playerSpawn); }
      else { p.pos.set(0, 5, 20); }
      p.vel.set(0, 0, 0);
      p.onGround = false;
    }

    // Build combined collider list: world + remote MP props
    const allColliders = g.colliders.slice();
    if (MP.roomId && MP.remoteProps) {
      for (const propId in MP.remoteProps) {
        const rp = MP.remoteProps[propId];
        if (!rp.mesh || !rp.mesh.parent) continue;
        const r = rp.mesh.userData.radius || 0.6;
        const pos = rp.mesh.position;
        allColliders.push({
          min: { x: pos.x - r, y: pos.y - r, z: pos.z - r },
          max: { x: pos.x + r, y: pos.y + r, z: pos.z + r },
        });
      }
    }

    for (const col of allColliders) {
      const r = p.radius;
      const feetY = p.pos.y - p.height;
      const headY = p.pos.y;
      const prevFeetY = feetY - p.vel.y * dt; // feet Y last frame
      // Standing on top — check FIRST (before side collision) so floor is resolved before walls
      // Use generous XZ tolerance (player radius) so edges feel solid
      if (p.pos.x > col.min.x - r && p.pos.x < col.max.x + r &&
          p.pos.z > col.min.z - r && p.pos.z < col.max.z + r &&
          p.vel.y <= 0) {
        const prevEye = p.pos.y - p.vel.y * dt;
        const topY = col.max.y + p.height;
        // Player was above (or at) the surface last frame, now fell through it
        if (prevEye >= col.max.y - 0.05 && p.pos.y <= topY + 0.5) {
          p.pos.y = topY;
          p.vel.y = 0;
          p.onGround = true;
        }
        // Also catch deep penetration (fell fast, fully inside the collider vertically)
        if (p.pos.y < topY && p.pos.y > col.max.y && feetY < col.max.y) {
          p.pos.y = topY;
          p.vel.y = 0;
          p.onGround = true;
        }
      }
      // Side collision (AABB vs AABB in XZ, overlapping Y)
      // Skip if the player was above the brush last frame — they're landing on top, not walking into a wall
      if (prevFeetY < col.max.y - 0.05 &&
          p.pos.x > col.min.x - r && p.pos.x < col.max.x + r &&
          p.pos.z > col.min.z - r && p.pos.z < col.max.z + r &&
          feetY < col.max.y - 0.02 && headY > col.min.y) {
        const penXn = p.pos.x - (col.min.x - r);
        const penXp = (col.max.x + r) - p.pos.x;
        const penZn = p.pos.z - (col.min.z - r);
        const penZp = (col.max.z + r) - p.pos.z;
        const minPen = Math.min(penXn, penXp, penZn, penZp);
        if (minPen === penXn) { p.pos.x = col.min.x - r; if (p.vel.x > 0) p.vel.x = 0; }
        else if (minPen === penXp) { p.pos.x = col.max.x + r; if (p.vel.x < 0) p.vel.x = 0; }
        else if (minPen === penZn) { p.pos.z = col.min.z - r; if (p.vel.z > 0) p.vel.z = 0; }
        else { p.pos.z = col.max.z + r; if (p.vel.z < 0) p.vel.z = 0; }
      }
      // Head bonk (ceiling)
      const prevHead = p.pos.y - p.vel.y * dt;
      if (p.pos.x > col.min.x && p.pos.x < col.max.x &&
          p.pos.z > col.min.z && p.pos.z < col.max.z &&
          prevHead <= col.min.y && p.pos.y >= col.min.y && p.vel.y > 0) {
        p.pos.y = col.min.y - 0.01;
        p.vel.y = 0;
      }
    }

    // Second pass: resolve any remaining penetration (helps with dense BSP brush layouts)
    for (const col of g.colliders) {
      const r = p.radius;
      const feetY = p.pos.y - p.height;
      const headY = p.pos.y;
      if (p.pos.x > col.min.x - r && p.pos.x < col.max.x + r &&
          p.pos.z > col.min.z - r && p.pos.z < col.max.z + r &&
          feetY < col.max.y - 0.02 && headY > col.min.y) {
        const penXn = p.pos.x - (col.min.x - r);
        const penXp = (col.max.x + r) - p.pos.x;
        const penZn = p.pos.z - (col.min.z - r);
        const penZp = (col.max.z + r) - p.pos.z;
        const minPen = Math.min(penXn, penXp, penZn, penZp);
        if (minPen < 0.05) {
          if (minPen === penXn) p.pos.x = col.min.x - r;
          else if (minPen === penXp) p.pos.x = col.max.x + r;
          else if (minPen === penZn) p.pos.z = col.min.z - r;
          else p.pos.z = col.max.z + r;
        }
      }
    }

    g.playerBody.position.set(p.pos.x, p.pos.y, p.pos.z);

    if (g.grabbed && g.grabbed.body) {
      const f = getCameraForward(g);
      const target = g.player.pos.clone().add(f.multiplyScalar(g.grabDist));
      const b = g.grabbed.body;
      const isRealPhys = WEAPONS[currentWeapon].type === "realphysgun";
      // Ensure grabbed prop has collision (KINEMATIC = collides but isn't pushed away)
      if (b.type !== CANNON.Body.KINEMATIC && b.type !== CANNON.Body.STATIC) {
        b._prevType = b.type;
        b._prevMass = b.mass;
        b.type = CANNON.Body.KINEMATIC;
        b.mass = 0;
        b.updateMassProperties();
      }
      if (isRealPhys) {
        // Physgun: rigid hold — move toward target via velocity so collisions work
        const prevAng = b.quaternion.clone();
        const dx = target.x - b.position.x;
        const dy = target.y - b.position.y;
        const dz = target.z - b.position.z;
        const holdSpeed = 30;
        b.velocity.set(dx * holdSpeed, dy * holdSpeed, dz * holdSpeed);
        b.quaternion.copy(prevAng);
        // E to rotate — uses raw mouse deltas so camera doesn't move
        if (g.keys["e"]) {
          const dx = g._rotMouseDX || 0;
          const dy = g._rotMouseDY || 0;
          g._rotMouseDX = 0;
          g._rotMouseDY = 0;
          const rotSpeed = 0.01;
          const q = new CANNON.Quaternion();
          const newQ = new CANNON.Quaternion();
          // Yaw axis (world up)
          q.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -dx * rotSpeed);
          q.mult(b.quaternion, newQ);
          b.quaternion.copy(newQ);
          // Pitch axis (camera right)
          const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));
          q.setFromAxisAngle(new CANNON.Vec3(right.x, right.y, right.z), -dy * rotSpeed);
          q.mult(b.quaternion, newQ);
          b.quaternion.copy(newQ);
        }
        // Track movement velocity for momentum-preserving release
        if (!g._grabPrevTarget) g._grabPrevTarget = target.clone();
        g._grabVel = new THREE.Vector3(
          (target.x - g._grabPrevTarget.x) / dt,
          (target.y - g._grabPrevTarget.y) / dt,
          (target.z - g._grabPrevTarget.z) / dt
        );
        g._grabPrevTarget.copy(target);
      } else {
        // Gravity gun: springy hold
        const holdStr = 10;
        b.velocity.set(
          (target.x - b.position.x) * holdStr,
          (target.y - b.position.y) * holdStr,
          (target.z - b.position.z) * holdStr
        );
        b.angularVelocity.scale(0.85, b.angularVelocity);
        // E to rotate — uses raw mouse deltas so camera doesn't move
        if (g.keys["e"]) {
          const dx = g._rotMouseDX || 0;
          const dy = g._rotMouseDY || 0;
          g._rotMouseDX = 0;
          g._rotMouseDY = 0;
          const rotSpeed = 0.01;
          const q = new CANNON.Quaternion();
          const newQ = new CANNON.Quaternion();
          q.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), -dx * rotSpeed);
          q.mult(b.quaternion, newQ);
          b.quaternion.copy(newQ);
          const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));
          q.setFromAxisAngle(new CANNON.Vec3(right.x, right.y, right.z), -dy * rotSpeed);
          q.mult(b.quaternion, newQ);
          b.quaternion.copy(newQ);
        }
      }
      b.wakeUp();
      // Render beam
      if (!g.physBeam) {
        const beamMat = new THREE.LineBasicMaterial({ color: 0x66ddff, transparent: true, opacity: 0.7 });
        const beamGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
        g.physBeam = new THREE.Line(beamGeo, beamMat);
        g.scene.add(g.physBeam);
      }
      g.physBeam.visible = true;
      const beamPos = g.physBeam.geometry.attributes.position;
      beamPos.setXYZ(0, g.player.pos.x, g.player.pos.y - 0.1, g.player.pos.z);
      beamPos.setXYZ(1, b.position.x, b.position.y, b.position.z);
      beamPos.needsUpdate = true;
      g.physBeam.material.color.setHex(isRealPhys ? 0x00ffff : 0x66bbff);
    } else if (g.physBeam) {
      g.physBeam.visible = false;
    }

    g.world.step(1 / 60, dt, 3);

    // ---- Resolve player vs prop collisions (model-accurate: capsule vs OBB/sphere) ----
    if (g.playerBody) {
      const pr = p.radius;
      const pTop = p.pos.y;
      const pBot = p.pos.y - p.height;
      const tmpV = new THREE.Vector3();
      const tmpQ = new THREE.Quaternion();
      const localP = new THREE.Vector3();
      const clamped = new THREE.Vector3();
      const closest = new THREE.Vector3();
      for (const prop of g.props) {
        const pb = prop.body;
        tmpQ.set(pb.quaternion.x, pb.quaternion.y, pb.quaternion.z, pb.quaternion.w);

        if (prop.shape === "ball") {
          // ---- Sphere prop: player capsule (vertical segment + radius) vs sphere ----
          const propY = pb.position.y;
          const segY = Math.max(pBot, Math.min(pTop, propY));
          const dx = p.pos.x - pb.position.x;
          const dy = segY - propY;
          const dz = p.pos.z - pb.position.z;
          const distSq = dx*dx + dy*dy + dz*dz;
          const minDist = pr + prop.radius;
          if (distSq < minDist*minDist && distSq > 1e-6) {
            const dist = Math.sqrt(distSq);
            const push = minDist - dist;
            const nx = dx/dist, ny = dy/dist, nz = dz/dist;
            p.pos.x += nx * push;
            p.pos.y += ny * push;
            p.pos.z += nz * push;
            const into = p.vel.x*nx + p.vel.y*ny + p.vel.z*nz;
            if (into < 0) {
              if (ny > 0.5) {
                if (p.vel.y < 0) p.vel.y = 0;
                p.onGround = true;
              } else {
                p.vel.x -= nx*into;
                p.vel.y -= ny*into;
                p.vel.z -= nz*into;
              }
            }
          }
        } else if (prop.halfExtents) {
          // ---- Box prop: player capsule vs oriented bounding box ----
          const he = prop.halfExtents;
          const invQ = tmpQ.clone().invert();
          // Collect all contacts, then apply ground ones first, then wall ones
          const contacts = [];
          const samples = 6;
          for (let s = 0; s <= samples; s++) {
            const sy = pBot + (pTop - pBot) * (s / samples);
            tmpV.set(p.pos.x - pb.position.x, sy - pb.position.y, p.pos.z - pb.position.z);
            localP.copy(tmpV).applyQuaternion(invQ);
            const inside = Math.abs(localP.x) < he.x && Math.abs(localP.y) < he.y && Math.abs(localP.z) < he.z;
            if (inside) {
              const penX = he.x - Math.abs(localP.x);
              const penY = he.y - Math.abs(localP.y);
              const penZ = he.z - Math.abs(localP.z);
              const minPen = Math.min(penX, penY, penZ);
              let lx = 0, ly = 0, lz = 0;
              if (minPen === penX) lx = localP.x > 0 ? 1 : -1;
              else if (minPen === penY) ly = localP.y > 0 ? 1 : -1;
              else lz = localP.z > 0 ? 1 : -1;
              clamped.set(lx, ly, lz);
              closest.copy(clamped).applyQuaternion(tmpQ);
              contacts.push({ nx: closest.x, ny: closest.y, nz: closest.z, push: pr + minPen });
            } else {
              clamped.set(
                Math.max(-he.x, Math.min(he.x, localP.x)),
                Math.max(-he.y, Math.min(he.y, localP.y)),
                Math.max(-he.z, Math.min(he.z, localP.z))
              );
              closest.copy(clamped).applyQuaternion(tmpQ).add(tmpV.set(pb.position.x, pb.position.y, pb.position.z));
              const dx = p.pos.x - closest.x;
              const dy = sy - closest.y;
              const dz = p.pos.z - closest.z;
              const distSq = dx*dx + dy*dy + dz*dz;
              if (distSq < pr*pr && distSq > 1e-6) {
                const dist = Math.sqrt(distSq);
                contacts.push({ nx: dx/dist, ny: dy/dist, nz: dz/dist, push: pr - dist });
              }
            }
          }
          // Sort: ground contacts (ny > 0.3) first so player gets pushed up onto the surface before wall resolution
          contacts.sort((a, b) => b.ny - a.ny);
          for (const c of contacts) {
            p.pos.x += c.nx * c.push;
            p.pos.y += c.ny * c.push;
            p.pos.z += c.nz * c.push;
            const into = p.vel.x*c.nx + p.vel.y*c.ny + p.vel.z*c.nz;
            if (into < 0) {
              if (c.ny > 0.3) {
                if (p.vel.y < 0) p.vel.y = 0;
                p.onGround = true;
              } else {
                p.vel.x -= c.nx*into;
                p.vel.y -= c.ny*into;
                p.vel.z -= c.nz*into;
              }
            }
          }
        }
      }
      g.playerBody.position.set(p.pos.x, p.pos.y, p.pos.z);
    }

    for (const prop of g.props) {
      prop.mesh.position.copy(prop.body.position);
      prop.mesh.quaternion.copy(prop.body.quaternion);
    }

    for (let i = g.props.length - 1; i >= 0; i--) {
      const pr = g.props[i];
      if (pr.body.position.y < g.killY) { removeProp3D(g, pr); continue; }
      // Fragments auto-expire
      if (pr.isFragment) {
        pr.fragLife -= dt;
        if (pr.fragLife <= 0) {
          // Fade out
          if (pr.mesh.material) {
            pr.mesh.material.transparent = true;
            pr.mesh.material.opacity = Math.max(0, (pr.fragLife + 2) / 2);
          }
          if (pr.fragLife <= -2) removeProp3D(g, pr);
        }
      }
    }
    updateFootsteps(g.player, dt);

    // Update grass wind shader time
    if (g.grassUniforms) {
      g.grassUniforms.uTime.value = performance.now() * 0.001;
    }
  }

  let lastFrameTime = 0;
  function toggleFlashlight() {
    if (!game || !game.scene) return;
    if (game.flashlight) {
      game.scene.remove(game.flashlight);
      game.flashlight.target && game.scene.remove(game.flashlight.target);
      game.flashlight = null;
      consoleLog("flashlight off", "sys");
    } else {
      const T = THREE;
      const fl = new T.SpotLight(0xfff0cc, 0, 60, Math.PI/7, 0.4, 1.5);
      fl.castShadow = false;
      fl.position.copy(game.camera.position);
      const tgt = new T.Object3D();
      game.scene.add(tgt);
      fl.target = tgt;
      game.scene.add(fl);
      game.flashlight = fl;
      consoleLog("flashlight on", "sys");
    }
  }

  function updateFlashlight() {
    if (!game || !game.flashlight) return;
    const c = game.camera;
    game.flashlight.position.copy(c.position);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(c.quaternion);
    game.flashlight.target.position.copy(c.position).add(dir);
    game.flashlight.target.updateMatrixWorld();
    game.flashlight.intensity = 8;
  }

  function game3DLoop() {
    if (!gameRunning) return;
    rafId = setTimeout(game3DLoop, 1000 / 60);
    try {
      const now = performance.now();
      if (!lastFrameTime) lastFrameTime = now;
      let dt = (now - lastFrameTime) / 1000;
      lastFrameTime = now;
      if (dt > 0.05) dt = 0.05;
      physics3D(game, dt);
      updateNPCs(game, dt);
      updateEntities(game, dt);
      updateProjectiles(game, dt);
      updateTracers(game, dt);
      updateParticles(dt);
      updateDecals(dt);
      updateLuaHooks(dt);
      updateLuaTimers(dt);
      updateFlashlight();
      // Multiplayer: send our transform + update remote avatar interpolation
      mpSendTransform();
      mpUpdateAvatars(dt);
      mpSendPropTransforms();
      mpUpdateRemoteProps(dt);
      mpSendDragUpdate();
      // Auto-fire if holding LMB
      if (isFiring && !spawnMenuOpen) tryFire(now);
      updateViewmodel(dt, now);
      // Silent auto-deny pending weapon after 3 seconds
      if (pendingWeapon >= 0 && now - pendingWeaponTime > 3000) silentDenyWeapon();
      // Render world, then viewmodel on top
      renderWithPostProcess(game, dt);
      gameRenderer.autoClear = false;
      gameRenderer.clearDepth();
      viewCamera.aspect = gameCamera.aspect;
      viewCamera.updateProjectionMatrix();
      if (WEAPONS[currentWeapon].type !== "camera") {
        gameRenderer.render(viewScene, viewCamera);
      }
      updateHUD3D();
    } catch (err) {
      console.error("gameLoop error:", err);
      gameRunning = false;
    }
  }

  function updateHUD3D() {
    const w = WEAPONS[currentWeapon];
    updateWeaponBar();
    const ammoEl = document.getElementById("hudAmmo");
    const ce = document.getElementById("hudClip");
    const re = document.getElementById("hudReserve");
    if (w.ammo === Infinity) {
      if (ammoEl) ammoEl.classList.add("noammo");
      if (ce) ce.textContent = w.name.toUpperCase();
      if (re) re.textContent = "";
    } else {
      if (ammoEl) ammoEl.classList.remove("noammo");
      if (ce) ce.textContent = w.clip === Infinity ? "\u221E" : w.clip;
      if (re) re.textContent = w.ammo === Infinity ? "\u221E" : w.ammo;
    }
    const ge = document.getElementById("hudGrab");
    if (ge) ge.classList.toggle("on", !!game.grabbed);
    const aux = document.getElementById("hudAux");
    const auxFill = document.getElementById("hudAuxFill");
    if (aux && auxFill && game) {
      const p = game.player;
      const show = p.sprinting || p.stamina < 99.5 || p.sprintCooldown > 0;
      aux.classList.toggle("on", show);
      auxFill.style.width = Math.max(0, Math.min(100, p.stamina)) + "%";
    }
    const speedo = document.getElementById("hudSpeedo");
    const speedVal = document.getElementById("hudSpeedVal");
    if (speedo && speedVal && game) {
      const v = game.player.vel;
      const horiz = Math.sqrt(v.x * v.x + v.z * v.z);
      const total = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
      const ups = Math.round(game.player.noclip ? total * 39.37 : horiz * 39.37);
      speedVal.textContent = ups;
      speedo.classList.toggle("show", !!game.showSpeedo);
    }
  }

  function pauseGame() {
    gameRunning = false;
    if (document.pointerLockElement) document.exitPointerLock();
    const root = document.getElementById("root");
    let ov = document.getElementById("pauseOverlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "pauseOverlay";
      ov.style.cssText = "position:absolute;inset:0;z-index:15;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;";
      root.appendChild(ov);
    }
    ov.innerHTML =
      '<div style="background:#22272a;border:1px solid #000;padding:28px 36px;text-align:center;box-shadow:0 12px 50px rgba(0,0,0,0.8);">' +
      '<div style="font-size:24px;color:#f4c430;font-weight:700;margin-bottom:18px;text-shadow:1px 1px 0 #000;">Paused</div>' +
      '<button class="pbtn primary" style="width:220px;margin-bottom:8px;" onclick="resumeGame()">Resume</button><br>' +
      '<button class="pbtn" style="width:220px;margin-bottom:8px;" onclick="pauseOptionsPanel()">Options</button><br>' +
      '<button class="pbtn" style="width:220px;" onclick="returnToMenu()">Return to Main Menu</button>' +
      '</div>';
  }

  function resumeGame() {
    const ov = document.getElementById("pauseOverlay");
    if (ov) ov.remove();
    gameRunning = true;
    lastFrameTime = 0;
    rafId = setTimeout(game3DLoop, 1000 / 60);
  }

  function returnToMenu() {
    gameRunning = false;
    if (rafId) clearTimeout(rafId);
    if (document.pointerLockElement) document.exitPointerLock();
    const ov = document.getElementById("pauseOverlay");
    if (ov) ov.remove();
    if (bspTexLogEl) { bspTexLogEl.remove(); bspTexLogEl = null; }

function memcopy( dst, dstStart, src, srcStart, len ) {

	for ( let i = 0; i < len; i ++ ) {

		dst[ dstStart + i ] = src[ srcStart + i ];

	}

}

const VVDLoader = function ( manager ) {

	this.manager = ( manager !== undefined ) ? manager : DefaultLoadingManager;

};

VVDLoader.prototype = {

	constructor: VVDLoader,

	load: function ( url, onLoad, onProgress, onError ) {

		const scope = this;

		const loader = new FileLoader( this.manager );
		loader.setPath( this.path );
		loader.setResponseType( 'arraybuffer' );
		loader.load( url, function ( text ) {

			onLoad( scope.parse( text ) );

		}, onProgress, onError );

	},

	parse: function ( buffer ) {

		// https://github.com/ValveSoftware/source-sdk-2013/blob/0d8dceea4310fde5706b3ce1c70609d72a38efdf/sp/src/public/studio.h#L398
		const MAX_NUM_LODS = 8;
		// const MAX_NUM_BONES_PER_VERT = 3;

		// struct vertexFileHeader_t
		function parseHeader( buffer ) {

			const dataView = new DataView( buffer );
			let i = 0;

			// int
			const id = dataView.getInt32( i, true );
			i += 4;

			// int
			const version = dataView.getInt32( i, true );
			i += 4;

			// long
			const checksum = dataView.getInt32( i, true );
			i += 4;

			// int
			const numLODs = dataView.getUint32( i, true );
			i += 4;

			// int
			const numLODVertexes = [];
			for ( let j = 0; j < MAX_NUM_LODS; j ++ ) {

				numLODVertexes.push( dataView.getInt32( i, true ) );
				i += 4;

			}

			// int
			const numFixups = dataView.getInt32( i, true );
			i += 4;

			// int
			const fixupTableStart = dataView.getInt32( i, true );
			i += 4;

			// int
			const vertexDataStart = dataView.getInt32( i, true );
			i += 4;

			// int
			const tangentDataStart = dataView.getInt32( i, true );
			i += 4;

			return {
				id,
				version,
				checksum,
				numLODs,
				numLODVertexes,
				numFixups,
				fixupTableStart,
				vertexDataStart,
				tangentDataStart,
				buffer
			};

		}

		function parseFixups( buffer, numFixups, fixupTableStart ) {

			const dataView = new DataView( buffer );
			let offset = fixupTableStart;
			const res = [];
			for ( let i = 0; i < numFixups; i ++ ) {

				const fixup = {};
				fixup.lod = dataView.getInt32( offset + 0, true );
				fixup.sourceVertexID = dataView.getInt32( offset + 4, true );
				fixup.numVertexes = dataView.getInt32( offset + 8, true );
				offset += 12;

				res.push( fixup );

			}

			return res;

		}

		function getBufferAttribute( buffer, len, start ) {

			const interleavedFloat32Array = new Float32Array( buffer, start, len / 4 );
			const interleavedFloat32Buffer = new InterleavedBuffer( interleavedFloat32Array, 48 / 4 );
			const interleavedUint8Array = new Uint8Array( buffer, start, len );
			const interleavedUint8Buffer = new InterleavedBuffer( interleavedUint8Array, 48 );

			// VVD file describes three bone weights and indices while THREE.js requires four
			const totalVerts = len / 48;
			const skinWeightArray = new Float32Array( totalVerts * 4 );
			const skinIndexArray = new Uint8Array( totalVerts * 4 );

			for ( let i = 0; i < totalVerts; i ++ ) {

				const i4 = i * 4;
				const floatIndex = i * 12;
				skinWeightArray[ i4 + 0 ] = interleavedFloat32Array[ floatIndex + 0 ];
				skinWeightArray[ i4 + 1 ] = interleavedFloat32Array[ floatIndex + 1 ];
				skinWeightArray[ i4 + 2 ] = interleavedFloat32Array[ floatIndex + 2 ];
				skinWeightArray[ i4 + 3 ] = 0;

				const uint8Index = i * 12 * 4 + 12;
				skinIndexArray[ i4 + 0 ] = interleavedUint8Array[ uint8Index + 0 ];
				skinIndexArray[ i4 + 1 ] = interleavedUint8Array[ uint8Index + 1 ];
				skinIndexArray[ i4 + 2 ] = interleavedUint8Array[ uint8Index + 2 ];
				skinIndexArray[ i4 + 3 ] = 0;

			}

			return {

				skinWeight: new BufferAttribute( skinWeightArray, 4, false ),
				skinIndex: new BufferAttribute( skinIndexArray, 4, false ),
				numBones: new InterleavedBufferAttribute( interleavedUint8Buffer, 1, 15, false ),

				position: new InterleavedBufferAttribute( interleavedFloat32Buffer, 3, 4, false ),
				normal: new InterleavedBufferAttribute( interleavedFloat32Buffer, 3, 7, false ),
				uv: new InterleavedBufferAttribute( interleavedFloat32Buffer, 2, 10, false ),

			};

		}

		const header = parseHeader( buffer );
		const fixups = parseFixups( buffer, header.numFixups, header.fixupTableStart );

		// apply fixups
		let attributes;
		const vertArrayLength = header.tangentDataStart - header.vertexDataStart;
		if ( fixups.length !== 0 ) {

			const vertexDataStart = header.vertexDataStart;
			const newBuffer = new ArrayBuffer( vertArrayLength );
			const newUint8Buffer = new Uint8Array( newBuffer );
			const ogUint8Buffer = new Uint8Array( buffer );
			let target = 0;
			for ( let i = 0; i < fixups.length; i ++ ) {

				const fixup = fixups[ i ];
				memcopy(
					newUint8Buffer,
					target * 48,
					ogUint8Buffer,
					vertexDataStart + fixup.sourceVertexID * 48,
					fixup.numVertexes * 48,
				);
				target += fixup.numVertexes;

			}

			attributes = getBufferAttribute( newBuffer, vertArrayLength, 0 );

		} else {

			attributes = getBufferAttribute( buffer, vertArrayLength, header.vertexDataStart );

		}

		return { header, fixups, attributes, buffer };

	}

};

			i += 4;

class SourceModelLoader {

			for ( let i = 0, i2 = array.length - 1; i < halfLen; i ++, i2 -- ) {

				const tmp = array[ i ];

			new MDLLoader( this.manager ).load( `${ url }.mdl`, resolve, undefined, reject );

		} );

		const vvdpr = new Promise( ( resolve, reject ) => {

			new VVDLoader( this.manager ).load( `${ url }.vvd`, resolve, undefined, reject );

		} );

		const vtxpr = new Promise( ( resolve, reject ) => {

			new VTXLoader( this.manager ).load( `${ url }.dx90.vtx`, resolve, undefined, reject );

		} );

			.all( [ mdlpr, vvdpr, vtxpr ] )
			.then( ( [ mdl, vvd, vtx ] ) => {

				const promises = [];

				const tokens = url.split( '/models/' );

				const path = tokens.join( '/models/' ) + '/materials/';
				mdl.textures.forEach( t => {

					const matPromises = [];
					mdl.textureDirectories.forEach( f => {

						const vmtUrl = `${ path }${ f }${ t }.vmt`;

							vmtLoader.load( vmtUrl, material => {

								material.name = t;
								resolve( material );

function parseVTF(buffer) {

  const height = dv.getUint16(18, true);

  const lowResFormat = dv.getUint32(60, true);

    offset += vtfImageSize(lowResWidth, lowResHeight, lowResFormat);

    const numMips = Math.floor(Math.log2(maxDim)) + 1;

function vtfImageSize(w, h, format) {

function parseVMT(text) {

      return canvasTex((ctx, w, h) => {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#8a1a1a'); grad.addColorStop(0.5, '#c4282a'); grad.addColorStop(1, '#7a1515');

  async function loadMDLAsViewmodel(mdlBuf, vvdBuf, vtxBuf, weaponId, textureFiles) {
    if (!window.loadSourceModelFromBuffers) {
      const ok = await ensureMDLLoader();
      if (!ok) { consoleLog("MDL loader failed to initialize", "err"); return false; }
    }

      let procMats = null;

              const origTex = mat.map;
              const c = document.createElement('canvas');
              c.width = c.height = 256;
              const ctx = c.getContext('2d');
              if (origTex.image) { try { ctx.drawImage(origTex.image, 0, 0, 256, 256); } catch(e) { ctx.fillStyle = '#1a2a3a'; ctx.fillRect(0, 0, 256, 256); } }
              ctx.globalCompositeOperation = 'multiply';
              ctx.fillStyle = '#3a4a5a';
              ctx.fillRect(0, 0, 256, 256);
              ctx.globalCompositeOperation = 'screen';
              ctx.fillStyle = 'rgba(0,80,120,0.3)';
              ctx.fillRect(0, 0, 256, 256);
              const newTex = new THREE.CanvasTexture(c);
              newTex.wrapS = newTex.wrapT = THREE.RepeatWrapping;
              newTex.colorSpace = THREE.SRGBColorSpace;
              mat.map = newTex;
            } else {
              mat.color.setHex(0x1a2a3a);
            }
            mat.emissive = new THREE.Color(0x00ddff);
            mat.emissiveIntensity = 0.3;
            o.material = mat;
          }
        }
      });

      // Compute bounding box and normalize
      const box = new THREE.Box3().setFromObject(group);
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);

      // Normalize to ~0.3 units tall (viewmodel scale)
      const maxDim = Math.max(size.x, size.y, size.z);
      const preset = VIEWMODEL_PRESETS[weaponId] || { pos: [0.08, -0.12, -0.25], rot: [0, 0, 0], scale: 1.0 };
      const targetSize = preset.target || 0.2;
      const scale = targetSize / maxDim;

      // Center the model on origin, then apply weapon-specific offset
      group.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
      
      // Create a wrapper group for positioning
      const wrapper = new THREE.Group();
      wrapper.add(group);
      group.scale.setScalar(scale);
      group.position.set(-center.x * scale, -center.y * scale, -center.z * scale);

      wrapper.position.set(preset.pos[0], preset.pos[1], preset.pos[2]);

          rpGroup.traverse(o => {
            if (o.isMesh) {
              o.castShadow = false; o.receiveShadow = false;

                const mat = o.material.clone();
                if (mat.map) {
                  mat.map = mat.map.clone();
                  mat.map.needsUpdate = true;
                  const c = document.createElement('canvas');
                  c.width = c.height = 256;
                  const ctx = c.getContext('2d');
                  ctx.drawImage(mat.map.image, 0, 0, 256, 256);
                  ctx.globalCompositeOperation = 'multiply';
                  ctx.fillStyle = '#3a4a5a';
                  ctx.fillRect(0, 0, 256, 256);
                  ctx.globalCompositeOperation = 'screen';
                  ctx.fillStyle = 'rgba(0,80,120,0.3)';
                  ctx.fillRect(0, 0, 256, 256);
                  const newTex = new THREE.CanvasTexture(c);
                  newTex.wrapS = newTex.wrapT = THREE.RepeatWrapping;
                  newTex.colorSpace = THREE.SRGBColorSpace;
                  mat.map = newTex;
                } else {
                  mat.color.setHex(0x1a2a3a);
                }
                mat.emissive = new THREE.Color(0x00ddff);
                mat.emissiveIntensity = 0.3;
                o.material = mat;
              }
            }
          });
          const rpBox = new THREE.Box3().setFromObject(rpGroup);
          const rpSize = new THREE.Vector3(); rpBox.getSize(rpSize);
          const rpCenter = new THREE.Vector3(); rpBox.getCenter(rpCenter);
          const rpMaxDim = Math.max(rpSize.x, rpSize.y, rpSize.z);
          const rpPreset = VIEWMODEL_PRESETS["realphysgun"] || VIEWMODEL_PRESETS["physgun"];
          const rpScale = (rpPreset.target || 0.25) / rpMaxDim;
          rpGroup.position.set(-rpCenter.x * rpScale, -rpCenter.y * rpScale, -rpCenter.z * rpScale);
          const rpWrapper = new THREE.Group();
          rpWrapper.add(rpGroup);
          rpGroup.scale.setScalar(rpScale);
          rpGroup.position.set(-rpCenter.x * rpScale, -rpCenter.y * rpScale, -rpCenter.z * rpScale);
          rpWrapper.position.set(rpPreset.pos[0], rpPreset.pos[1], rpPreset.pos[2]);
          rpWrapper.rotation.set(rpPreset.rot[0], rpPreset.rot[1], rpPreset.rot[2]);
          rpWrapper.userData.basePos = rpWrapper.position.clone();
          rpWrapper.userData.baseRot = rpWrapper.rotation.clone();
          rpWrapper.userData.parts = {};
          rpWrapper.userData.isCustomMDL = true;
          const rpGlow = new THREE.Mesh(
            new THREE.SphereGeometry(0.02, 12, 8),
            new THREE.MeshBasicMaterial({ color: 0x66ffff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false })
          );
          rpGlow.position.set(0, 0, -0.25);
          rpWrapper.add(rpGlow);

          customViewmodels["realphysgun"] = { wrapper: rpWrapper, group: rpGroup, weaponId: "realphysgun" };

          rpWrapper.visible = (WEAPONS[currentWeapon].id === "realphysgun");
          if (viewModels["realphysgun"]) viewModels["realphysgun"].visible = false;
        } catch(e) { console.warn("Failed to clone physgun MDL for realphysgun:", e); }
      }

      consoleLog("Viewmodel loaded for " + weaponId + " (scale: " + scale.toFixed(3) + ")", "ok");
      // Persist to kv so it survives page reloads
      if (window.root && window.root.kv) {
        try {
          const folder = window.root.kv.viewmodels;
          await folder.set(weaponId + ".mdl", new Uint8Array(mdlBuf));
          await folder.set(weaponId + ".vvd", new Uint8Array(vvdBuf));
          await folder.set(weaponId + ".vtx", new Uint8Array(vtxBuf));
          if (textureFiles) {
            const texMeta = { vmts: textureFiles.vmts || {}, vtfNames: Object.keys(textureFiles.vtfs || {}) };
            await folder.set(weaponId + ".texmeta", texMeta);
            for (const [k, v] of Object.entries(textureFiles.vtfs || {})) {
              await folder.set(weaponId + ".vtf_" + k, new Uint8Array(v));
            }
          } else {
            await folder.delete(weaponId + ".texmeta").catch(()=>{});
          }
          consoleLog("Viewmodel saved for " + weaponId + " (persists across reloads)", "sys");
        } catch(e) { console.warn("kv viewmodel save failed:", e); }
      }
      return true;
    } catch(e) {
      consoleLog("Viewmodel MDL parse error: " + e.message, "err");
      console.error(e);
      return false;
    }
  }

  // Auto-load persisted viewmodels from kv storage (survives page reload)
  async function loadStoredViewmodels() {
    if (!window.root || !window.root.kv) return;
    try {
      const folder = window.root.kv.viewmodels;
      const keys = await folder.keys();
      const mdlKeys = keys.filter(k => k.endsWith(".mdl"));
      if (mdlKeys.length === 0) return;
      if (!window.loadSourceModelFromBuffers) {
        const ok = await ensureMDLLoader();
        if (!ok) { console.warn("MDL loader unavailable, skipping stored viewmodels"); return; }
      }
      for (const mk of mdlKeys) {
        const weaponId = mk.replace(/\.mdl$/, "");
        try {
          const mdl = await folder.get(mk);
          const vvd = await folder.get(weaponId + ".vvd");
          const vtx = await folder.get(weaponId + ".vtx");
          if (!mdl || !vvd || !vtx) { console.warn("Incomplete stored viewmodel:", weaponId); continue; }
          let textureFiles = null;
          const texMeta = await folder.get(weaponId + ".texmeta");
          if (texMeta) {
            textureFiles = { vmts: texMeta.vmts || {}, vtfs: {} };
            for (const name of (texMeta.vtfNames || [])) {
              const vtf = await folder.get(weaponId + ".vtf_" + name);
              if (vtf) textureFiles.vtfs[name] = vtf.buffer || vtf;
            }
          }
          await loadMDLAsViewmodel(mdl.buffer || mdl, vvd.buffer || vvd, vtx.buffer || vtx, weaponId, textureFiles);
        } catch(e) { console.warn("Failed to load stored viewmodel", weaponId, e); }
      }
    } catch(e) { console.warn("kv viewmodel load failed:", e); }
  }

    return !!customViewmodels[weaponId];
  }

    if (customViewmodels[weaponId]) return customViewmodels[weaponId].wrapper;
    return viewModels[weaponId] || null;

  async function ensureMDLLoader() {
    if (mdlLoaderReady) return true;
    try {
      await loadSourceModelLoaderCode();
      mdlLoaderReady = true;

  async function loadSourceModelLoaderCode() {
    // Load toTrianglesDrawMode if not already available
    if (!window._toTrianglesDrawMode) {
      try {
        const { toTrianglesDrawMode } = await import('https://esm.sh/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js');
        window._toTrianglesDrawMode = toTrianglesDrawMode;
      } catch(e) { window._toTrianglesDrawMode = (g) => g; }
    }
    // Initialize the MDL loader (defines parsers on window)
    if (!window.loadSourceModelFromBuffers && window._initMDLLoader) {
      window._initMDLLoader();
    }
    return !!window.loadSourceModelFromBuffers;

  // MDL file drag-and-drop handler
  let droppedMDLFiles = {};
  async function handleMDLDrop(files) {
    const fileMap = {};
    for (const f of files) {
      const name = f.name.toLowerCase();
      if (name.endsWith('.mdl')) fileMap.mdl = f;
      else if (name.endsWith('.vvd')) fileMap.vvd = f;
      else if (name.endsWith('.vtx') || name.endsWith('.dx90.vtx')) fileMap.vtx = f;
      else if (name.endsWith('.vmt')) { fileMap.vmts = fileMap.vmts || []; fileMap.vmts.push(f); }
      else if (name.endsWith('.vtf')) {
        fileMap.vtfs = fileMap.vtfs || [];
        fileMap.vtfs.push(f);
      }
    }
    if (!fileMap.mdl || !fileMap.vvd || !fileMap.vtx) {
      consoleLog("MDL load requires .mdl, .vvd, and .dx90.vtx files", "err");
      return false;
    }
    consoleLog("Loading MDL model: " + fileMap.mdl.name, "sys");
    
    // Read files as ArrayBuffers
    const mdlBuf = await fileMap.mdl.arrayBuffer();
    const vvdBuf = await fileMap.vvd.arrayBuffer();
    const vtxBuf = await fileMap.vtx.arrayBuffer();
    
    // Read texture files if provided
    let textureFiles = null;
    if ((fileMap.vmts && fileMap.vmts.length) || (fileMap.vtfs && fileMap.vtfs.length)) {
      textureFiles = { vmts: {}, vtfs: {} };
      for (const f of (fileMap.vmts || [])) {
        const name = f.name.toLowerCase().replace(/\.vmt$/, '');
        textureFiles.vmts[name] = await f.text();
      }
      for (const f of (fileMap.vtfs || [])) {
        const name = f.name.toLowerCase().replace(/\.vtf$/, '');
        textureFiles.vtfs[name] = await f.arrayBuffer();
      }
      consoleLog("Loaded " + Object.keys(textureFiles.vmts).length + " VMTs, " + Object.keys(textureFiles.vtfs).length + " VTFs", "sys");
    }
    
    if (!window.loadSourceModelFromBuffers) {
      const ok = await ensureMDLLoader();
      if (!ok) { consoleLog("MDL loader failed to initialize", "err"); return false; }
    }

    // Check if this is a viewmodel file (v_*.mdl)
    const weaponId = detectViewmodelWeapon(fileMap.mdl.name);
    if (weaponId) {
      consoleLog("Detected viewmodel for weapon: " + weaponId, "sys");
      const ok = await loadMDLAsViewmodel(mdlBuf, vvdBuf, vtxBuf, weaponId, textureFiles);
      return ok;
    }
    
    try {
      const group = window.loadSourceModelFromBuffers(mdlBuf, vvdBuf, vtxBuf, null, textureFiles);
      // Scale and add to scene
      group.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      
      // Spawn in front of player
      const fwd = getCameraForward(game);
      const pos = game.player.pos.clone().add(fwd.multiplyScalar(4));
      group.position.copy(pos);
      
      // Compute bounding box for physics
      const box = new THREE.Box3().setFromObject(group);
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);
      
      // Center the model
      group.position.x -= center.x - group.position.x;
      group.position.z -= center.z - group.position.z;
      group.position.y = pos.y - size.y / 2;
      
      game.scene.add(group);
      
      // Create physics body
      const C = CANNON;
      const he = { x: Math.max(0.1, size.x / 2), y: Math.max(0.1, size.y / 2), z: Math.max(0.1, size.z / 2) };
      const shape = new C.Box(new C.Vec3(he.x, he.y, he.z));
      const body = new C.Body({ mass: 10, shape });
      body.position.set(group.position.x, group.position.y + he.y, group.position.z);
      body.linearDamping = 0.05;
      body.angularDamping = 0.08;
      game.world.addBody(body);
      
      const prop = {
        mesh: group, body, 
        radius: Math.max(he.x, he.y, he.z),
        halfExtents: he,
        shape: "box",
        isMDL: true,
      };
      game.props.push(prop);
      if (game.props.length > 80) {
        const old = game.props.shift();
        game.scene.remove(old.mesh);
        old.mesh.traverse(o => { if (o.geometry) o.geometry.dispose(); });
        game.world.removeBody(old.body);
      }
      
      consoleLog("MDL model loaded: " + fileMap.mdl.name + " (" + Math.round(size.x*100)/100 + "x" + Math.round(size.y*100)/100 + "x" + Math.round(size.z*100)/100 + ")", "ok");
      return true;
    } catch(e) {
      consoleLog("MDL parse error: " + e.message, "err");
      console.error(e);
      return false;
    }
  }

      luaState = lauxlib.luaL_newstate();
      lualib.luaL_openlibs(luaState);
      // Initialize JS interop library (enables pushjs/tojs with proper metatables)
      lauxlib.luaL_requiref(luaState, to_luastring("js"), interop.luaopen_js, 1);
      lua.lua_pop(luaState, 1);
      
      // Helper to register a JS function as a Lua global
      function register(name, fn) {
        lua.lua_pushjsfunction(luaState, fn);
        lua.lua_setglobal(luaState, to_luastring(name));
      }

      // ===== print() =====
      register("print", (L) => {
        const n = lua.lua_gettop(L);
        const parts = [];
        for (let i = 1; i <= n; i++) {
          const t = lua.lua_type(L, i);
          if (t === lua.LUA_TSTRING) parts.push(lua.lua_tojsstring(L, i));
          else if (t === lua.LUA_TNUMBER) parts.push(String(lua.lua_tonumber(L, i)));
          else if (t === lua.LUA_TBOOLEAN) parts.push(lua.lua_toboolean(L, i) ? "true" : "false");
          else if (t === lua.LUA_TNIL) parts.push("nil");
          else parts.push("[" + to_jsstring(lua.lua_typename(L, t)) + "]");
        }
        consoleLog(parts.join("\t"), "lua");
        return 0;
      });

      // ===== player table =====
      // player.GetPos() -> {x, y, z}
      // player.SetPos(x, y, z)
      // player.GetHealth()
      // player.SetHealth(n)
      const playerAPI = {
        GetPos: () => {
          if (!game || !game.player) return null;
          const p = game.player.pos;
          return { x: p.x, y: p.y, z: p.z };
        },
        SetPos: (x, y, z) => {

        GetAimVector: () => {
          if (!game) return null;
          const f = getCameraForward(game);

        },
      };

      // ===== spawn table =====
      // spawn.Prop(name, x, y, z)  -- name: "crate", "plank", "barrel", "ball", "beam"
      // spawn.NPC(type, x, y, z)   -- type: "citizen", "rebel", "combine", "zombie", "headcrab", "antlion"
      // spawn.Entity(name, x, y, z) -- name: "tnt", "propane", "balloon", "thruster", "beacon"
      function resolvePropItem(name) {
        const lower = (name || "").toLowerCase();
        // Search all prop subcats

        if (lower.includes("beam")) return { name: "Steel Beam", shape: "plank", size: 2.0, mass: 15, color: 0x5a5a5e };
        return { name: name || "Prop", shape: "box", size: 1.0, mass: 4 };

      const npcAPI = {

      // ===== timer table =====
      // timer.Simple(delay, func)
      // timer.Create(name, delay, repeats, func)  -- repeats=0 means infinite
      // timer.Remove(name)
      const timerAPI = {
        Simple: (delay, fn) => {
          luaTimers.push({ name: null, delay, repeats: 1, nextFire: performance.now() + delay * 1000, fn });
        },
        Create: (name, delay, repeats, fn) => {

          luaTimers.push({ name, delay, repeats, nextFire: performance.now() + delay * 1000, fn });
        },
        Remove: (name) => {

      // ===== util table =====
      const utilAPI = {
        GetTime: () => performance.now() / 1000,
        Random: (min, max) => min + Math.random() * (max - min),

      // ===== realism table (camera/viewmodel control for addons) =====
      const realismAPI = {
        SetCameraOffset: (x, y, z) => { if (!game) return; game.cameraOffset.set(x||0, y||0, z||0); },
        GetCameraOffset: () => game ? { x: game.cameraOffset.x, y: game.cameraOffset.y, z: game.cameraOffset.z } : { x:0, y:0, z:0 },

        GetViewmodelOffset: () => game ? { x: game.vmOffset.x, y: game.vmOffset.y, z: game.vmOffset.z } : { x:0, y:0, z:0 },
        SetViewmodelAngle: (x, y, z) => { if (!game) return; game.vmRotOffset.x = x||0; game.vmRotOffset.y = y||0; game.vmRotOffset.z = z||0; },
        GetViewmodelAngle: () => game ? { x: game.vmRotOffset.x, y: game.vmRotOffset.y, z: game.vmRotOffset.z } : { x:0, y:0, z:0 },
        GetPlayerVelocity: () => { if (!game) return { x:0, y:0, z:0 }; const v = game.player.vel; return { x: v.x, y: v.y, z: v.z }; },
        GetPlayerSpeed: () => { if (!game) return 0; return game.player.vel.length(); },
        IsOnGround: () => game ? (game.player.onGround ? true : false) : false,
        IsMoving: () => { if (!game) return false; return (game.keys["w"]||game.keys["a"]||game.keys["s"]||game.keys["d"]) ? true : false; },
        IsSprinting: () => game ? (game.player.sprinting ? true : false) : false,
        IsCrouching: () => game ? (game.player.crouching ? true : false) : false,
        GetViewmodelBobPhase: () => viewmodelBob,
        GetDeltaTime: () => { const now = performance.now(); return lastFrameTime ? Math.min(0.05, (now - lastFrameTime)/1000) : 0.016; },
      };

      // Helper: push a JS function as a Lua function on the stack
      function pushJSFn(fn) {
        lua.lua_pushjsfunction(luaState, fn);
      }

      // Helper: create a Lua table from an object of JS functions
      function registerTable(name, obj) {
        lua.lua_createtable(luaState, 0, Object.keys(obj).length);
        for (const [key, val] of Object.entries(obj)) {
          if (typeof val === 'function') {
            pushJSFn((L) => {
              const top = lua.lua_gettop(L);
              const jsArgs = [];
              for (let i = 1; i <= top; i++) {
                jsArgs.push(interop.tojs(L, i));
              }
              const result = val(...jsArgs);
              return pushResult(L, result);
            });
            lua.lua_setfield(luaState, -2, to_luastring(key));
          } else {
            interop.pushjs(luaState, val);
            lua.lua_setfield(luaState, -2, to_luastring(key));
          }
        }
        lua.lua_setglobal(luaState, to_luastring(name));
      }

      // Push a JS return value as the appropriate Lua type
      function pushResult(L, result) {
        if (result === undefined || result === null) {
          lua.lua_pushnil(L);
          return 1;
        }
        if (typeof result === 'number') {
          lua.lua_pushnumber(L, result);
          return 1;
        }
        if (typeof result === 'string') {
          lua.lua_pushstring(L, to_luastring(result));
          return 1;
        }
        if (typeof result === 'boolean') {
          lua.lua_pushboolean(L, result ? 1 : 0);
          return 1;
        }
        // Objects/arrays: convert to Lua table manually
        if (typeof result === 'object') {
          if (Array.isArray(result)) {
            lua.lua_createtable(L, result.length, 0);
            for (let i = 0; i < result.length; i++) {
              pushResult(L, result[i]);
              lua.lua_rawseti(L, -2, i + 1);
            }
          } else {
            const keys = Object.keys(result);
            lua.lua_createtable(L, 0, keys.length);
            for (const k of keys) {
              pushResult(L, result[k]);
              lua.lua_setfield(L, -2, to_luastring(k));
            }
          }
          return 1;
        }
        // Fallback
        lua.lua_pushnil(L);
        return 1;
      }

      // Register tables
      registerTable("player", playerAPI);
      registerTable("spawn", spawnAPI);
      registerTable("entity", entityAPI);
      registerTable("npc", npcAPI);
      registerTable("hook", hookAPI);
      registerTable("timer", timerAPI);
      registerTable("util", utilAPI);
      registerTable("realism", realismAPI);

      // Set up math.randomseed
      lauxlib.luaL_dostring(luaState, to_luastring(`math.randomseed(os.time())`));

      luaLoaded = true;
      consoleLog("Lua engine initialized (Fengari)", "lua");
      return true;
    } catch (e) {
      consoleLog("Lua init failed: " + e.message, "err");
      console.error(e);
      return false;
    }
  }

  function runLuaCode(code) {

    const F = window.__fengari;
    const { lauxlib, to_luastring } = F;
    try {
      const ok = lauxlib.luaL_dostring(luaState, to_luastring(code));
      if (ok !== 0) {
        const msg = F.lua.lua_tojsstring(luaState, -1);
        consoleLog("Lua error: " + msg, "err");
      }
    } catch (e) {
      consoleLog("Lua runtime error: " + e.message, "err");
    }

  function updateLuaHooks(dt) {
    if (!luaLoaded || luaThinkHooks.length === 0) return;
    for (const h of luaThinkHooks) {
      try { h.fn(dt); } catch (e) { consoleLog("Lua hook error [" + h.name + "]: " + e.message, "err"); }
    }
  }

  function updateLuaTimers(dt) {
    if (!luaLoaded || luaTimers.length === 0) return;
    const now = performance.now();
    for (let i = luaTimers.length - 1; i >= 0; i--) {
      const t = luaTimers[i];
      if (now >= t.nextFire) {
        try { t.fn(); } catch (e) { consoleLog("Lua timer error: " + e.message, "err"); }
        if (t.repeats === 1) {
          luaTimers.splice(i, 1);
        } else if (t.repeats > 1) {
          t.repeats--;
          t.nextFire = now + t.delay * 1000;
        } else {
          // repeats === 0 means infinite (GMod convention)
          t.nextFire = now + t.delay * 1000;
        }
      }
    }
  }

        el.style.top = rect.top + "px";
        dragOffX = e.clientX - rect.left;
        dragOffY = e.clientY - rect.top;
        e.preventDefault();
      };
      document.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        el.style.left = Math.max(0, Math.min(window.innerWidth - 100, e.clientX - dragOffX)) + "px";
        el.style.top = Math.max(0, Math.min(window.innerHeight - 40, e.clientY - dragOffY)) + "px";
      });
      document.addEventListener("mouseup", () => { dragging = false; });
    }

    // Resizing
    let resizing = false, startW = 0, startH = 0, startX = 0, startY = 0;
    if (resizer) {
      resizer.onmousedown = (e) => {
        resizing = true;
        startW = el.offsetWidth;
        startH = el.offsetHeight;
        startX = e.clientX;
        startY = e.clientY;
        e.preventDefault();
        e.stopPropagation();
      };
      document.addEventListener("mousemove", (e) => {
        if (!resizing) return;
        el.style.width = Math.max(300, Math.min(window.innerWidth - 20, startW + (e.clientX - startX))) + "px";
        el.style.height = Math.max(200, Math.min(window.innerHeight - 20, startH + (e.clientY - startY))) + "px";
      });
      document.addEventListener("mouseup", () => { resizing = false; });
    }
  }

  let suggestSelIdx = -1;
  let suggestItems = [];

  function updateConsoleSuggest() {
    const inp = document.getElementById("dcInput");
    const box = document.getElementById("dcSuggest");
    if (!inp || !box) return;
    const raw = inp.value;
    const parts = raw.trim().split(/\s+/);
    const typed = parts[0].toLowerCase();

    if (!raw.trim()) {
      // Empty input — show all commands
      suggestItems = CONSOLE_COMMANDS.map(c => {
        let val = c.getVal ? c.getVal() : null;
        return { name: c.name, args: c.args, val, desc: c.desc, full: false };
      });
    } else if (parts.length > 1) {
      // When a full command + args are being typed, show the command's current value if it's a cvar
      const cmd = CONSOLE_COMMANDS.find(c => c.name === typed);
      if (cmd && cmd.getVal) {
        const v = cmd.getVal();
        if (v !== null) {
          suggestItems = [{ name: cmd.name, val: v, desc: cmd.desc, full: true }];
        } else { suggestItems = []; }
      } else { suggestItems = []; }
    } else {
      // Typing the command name — filter matches
      const matches = typed
        ? CONSOLE_COMMANDS.filter(c => c.name.startsWith(typed))
        : CONSOLE_COMMANDS;
      suggestItems = matches.map(c => {
        let val = c.getVal ? c.getVal() : null;
        return { name: c.name, args: c.args, val, desc: c.desc, full: false };
      });
    }

    if (suggestItems.length === 0) {
      box.classList.remove("show");
      box.innerHTML = "";
      suggestSelIdx = -1;
      return;
    }

    box.innerHTML = suggestItems.map((it, i) => {
      let html = '<div class="dc-suggest-item' + (i === suggestSelIdx ? " sel" : "") + '" data-idx="' + i + '">';
      html += '<span class="dc-sug-cmd">' + it.name + '</span>';
      if (it.args) html += ' <span class="dc-sug-arg">' + it.args + '</span>';
      if (it.val !== null && it.val !== undefined) html += ' <span class="dc-sug-val">= ' + it.val + '</span>';
      if (it.desc) html += '<span class="dc-sug-desc">— ' + it.desc + '</span>';
      html += '</div>';
      return html;
    }).join("");
    box.classList.add("show");

    // Click to autocomplete
    box.querySelectorAll(".dc-suggest-item").forEach(el => {
      el.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const idx = parseInt(el.dataset.idx);
        const item = suggestItems[idx];
        if (item) {
          inp.value = item.name + (item.args ? " " : "");
          updateConsoleSuggest();
          inp.focus();
        }
      });
    });
  }

  function moveSuggestSel(dir) {
    if (suggestItems.length === 0) return;
    if (dir > 0) {
      suggestSelIdx = (suggestSelIdx + 1) % suggestItems.length;
    } else {
      suggestSelIdx = suggestSelIdx <= 0 ? suggestItems.length - 1 : suggestSelIdx - 1;
    }
    if (suggestSelIdx === 0 && dir < 0 && suggestItems.length > 1) suggestSelIdx = 0;
    updateConsoleSuggestSel();
  }

  function updateConsoleSuggestSel() {
    const box = document.getElementById("dcSuggest");
    if (!box) return;
    box.querySelectorAll(".dc-suggest-item").forEach((el, i) => {
      el.classList.toggle("sel", i === suggestSelIdx);
    });
    const sel = box.querySelector(".dc-suggest-item.sel");
    if (sel) sel.scrollIntoView({ block: "nearest" });
  }

  function acceptSuggestion() {
    const inp = document.getElementById("dcInput");
    if (!inp || suggestItems.length === 0) return;
    const idx = suggestSelIdx >= 0 ? suggestSelIdx : 0;

    if (item) {

      updateConsoleSuggest();
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  }
